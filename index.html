<!DOCTYPE html>
<html lang="fr">
<head>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLVsEFu1aubVt6yOAwjFiAceBOQ_t3QXw",
  authDomain: "vmf-mdt.firebaseapp.com",
  projectId: "vmf-mdt",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db;
window.fsLib = { collection, doc, getDocs, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp, increment, runTransaction };
window.fb = {
  listen: (col, cb) => onSnapshot(collection(db, col), snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
  listenDoc: (col, id, cb) => onSnapshot(doc(db, col, id), snap => cb(snap.exists() ? { id: snap.id, ...snap.data() } : null)),
  add: (col, data) => addDoc(collection(db, col), { ...data, createdAt: serverTimestamp() }),
  set: (col, id, data) => setDoc(doc(db, col, id), data, { merge: true }),
  delete: (col, id) => deleteDoc(doc(db, col, id)),
  increment,
  runTransaction,
  doc: (col, id) => doc(db, col, id),
};
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMF — Réseau Privé</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#0e0e10;--bg2:#141416;--bg3:#1a1a1e;--bgc:#161618;--bgch:#1e1e22;
  --bdr:#2a2a30;--bdrb:#38383f;
  --red:#c0392b;--redf:rgba(192,57,43,0.12);
  --green:#00d084;--greenf:rgba(0,208,132,0.1);
  --gold:#c9a84c;--goldf:rgba(201,168,76,0.1);
  --txt:#f0f0f5;--txt2:#9090a0;--txtm:#4a4a55;
  --acc:#c8cad4;--accf:rgba(200,202,212,0.1);
  --sw:220px;--th:56px;
  --fm:'Syne',sans-serif;--fc:'JetBrains Mono',monospace;
  --r:6px;--rl:10px;--tr:0.18s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--fm);overflow:hidden;}
#root{height:100%;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bdrb);border-radius:2px;}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sw);min-width:var(--sw);height:100vh;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;z-index:50;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;}
.scroll{flex:1;overflow-y:auto;padding:20px;}

/* SIDEBAR */
.slogo{padding:18px 16px 14px;border-bottom:1px solid var(--bdr);}
.logo-icon{width:30px;height:30px;background:var(--acc);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#0e0e10;font-family:var(--fc);flex-shrink:0;}
.suser{padding:10px 14px;border-bottom:1px solid var(--bdr);background:var(--bg3);}
.snav{flex:1;overflow-y:auto;padding:6px 0;}
.nav-lbl{font-size:9px;font-family:var(--fc);color:var(--txtm);letter-spacing:.18em;padding:8px 14px 3px;text-transform:uppercase;}
.nav-it{display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;transition:var(--tr);border-left:2px solid transparent;font-size:12px;font-weight:500;color:var(--txt2);}
.nav-it:hover{color:var(--txt);background:var(--bgch);}
.nav-it.active{color:var(--txt);background:var(--accf);border-left-color:var(--acc);}
.nav-it .ic{width:15px;text-align:center;font-size:13px;flex-shrink:0;}
.sfooter{padding:10px 14px;border-top:1px solid var(--bdr);}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pg 2s infinite;}
@keyframes pg{0%,100%{opacity:1}50%{opacity:.4}}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}

/* CARDS & GRID */
.card{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;}
.ch{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;}
.ct{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--txt);text-transform:uppercase;}
.csub{font-size:10px;font-family:var(--fc);color:var(--txtm);margin-left:auto;}
.cb{padding:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* STAT CARDS */
.sc{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px;position:relative;overflow:hidden;transition:var(--tr);}
.sc:hover{border-color:var(--bdrb);}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc.r::before{background:var(--red)}.sc.g::before{background:var(--green)}.sc.gd::before{background:var(--gold)}.sc.b::before{background:#60a5fa}
.sl{font-size:10px;font-family:var(--fc);color:var(--txtm);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.sv{font-size:20px;font-weight:800;color:var(--txt);line-height:1;}
.ss{font-size:10px;font-family:var(--fc);color:var(--txtm);margin-top:5px;}
.si{position:absolute;right:10px;top:10px;font-size:20px;opacity:.12;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}

/* TABLE */
.dt{width:100%;border-collapse:collapse;font-size:12px;}
.dt th{text-align:left;padding:8px 12px;font-size:10px;font-family:var(--fc);font-weight:500;color:var(--txtm);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--bdr);white-space:nowrap;}
.dt td{padding:9px 12px;border-bottom:1px solid var(--bdr);color:var(--txt2);vertical-align:middle;}
.dt tr:last-child td{border-bottom:none;}
.dt tr:hover td{background:var(--bgch);color:var(--txt);}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:9px;font-family:var(--fc);font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.bdg-r{background:rgba(192,57,43,.12);color:#e87060;border:1px solid rgba(192,57,43,.3);}
.bdg-g{background:var(--greenf);color:var(--green);border:1px solid rgba(0,208,132,.3);}
.bdg-gd{background:var(--goldf);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.bdg-gr{background:rgba(61,84,112,.2);color:var(--txt2);border:1px solid var(--bdr);}
.bdg-b{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.bdg-p{background:rgba(168,85,247,.1);color:#c084fc;border:1px solid rgba(168,85,247,.3);}

/* GRADES */
.gCollaborateur{color:#7a90a8}.gSyndic{color:#60a5fa}.gSenechaux{color:var(--green)}.gRegent{color:var(--gold)}.gHeritier{color:var(--acc)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:12px;font-weight:600;font-family:var(--fm);cursor:pointer;transition:var(--tr);border:none;outline:none;letter-spacing:.04em;}
.btn-p{background:var(--acc);color:#0e0e10;}.btn-p:hover{background:#fff;}
.btn-s{background:var(--bgc);color:var(--txt2);border:1px solid var(--bdr);}.btn-s:hover{background:var(--bgch);color:var(--txt);border-color:var(--bdrb);}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-g{background:var(--greenf);color:var(--green);border:1px solid rgba(0,208,132,.3);}.btn-g:hover{background:rgba(0,208,132,.2);}
.btn-d{background:rgba(192,57,43,.15);color:#e87060;border:1px solid rgba(192,57,43,.3);}.btn-d:hover{background:rgba(192,57,43,.25);}
.btn-gd{background:var(--goldf);color:var(--gold);border:1px solid rgba(201,168,76,.3);}

/* FORM */
.inp{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 11px;font-size:12px;color:var(--txt);font-family:var(--fm);outline:none;transition:var(--tr);width:100%;}
.inp:focus{border-color:var(--acc)}.inp::placeholder{color:var(--txtm)}
.sel{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 11px;font-size:12px;color:var(--txt);font-family:var(--fm);outline:none;cursor:pointer;width:100%;}
.sel:focus{border-color:var(--acc)}
.lbl{font-size:10px;font-family:var(--fc);color:var(--txtm);letter-spacing:.07em;margin-bottom:5px;display:block;}
.fg{margin-bottom:12px;}

/* MODAL */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;animation:fi .15s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--bdrb);border-radius:var(--rl);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;animation:su .2s ease;}
@keyframes su{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.mt{font-size:13px;font-weight:700;color:var(--txt);}
.mc{background:none;border:none;color:var(--txtm);cursor:pointer;font-size:18px;}.mc:hover{color:var(--txt)}
.mb{padding:18px;}
.mf{padding:11px 18px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:7px;}

/* LOGIN */
.ls{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden;}
.lc{background:var(--bg2);border:1px solid var(--bdrb);border-radius:var(--rl);padding:36px;width:350px;position:relative;z-index:1;}
.lbtn{background:var(--acc);color:#0e0e10;border:none;padding:11px;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;width:100%;transition:var(--tr);}.lbtn:hover{background:#fff}

/* CHAT */
.cmsg{max-width:76%;}.cmsg.mine{align-self:flex-end;}.cmsg.theirs{align-self:flex-start;}
.cbub{padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.5;}
.mine .cbub{background:var(--accf);border:1px solid rgba(200,202,212,.2);color:var(--txt);}
.theirs .cbub{background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);}
.cmeta{font-size:9px;font-family:var(--fc);color:var(--txtm);padding:2px 4px;}.mine .cmeta{text-align:right}

/* MISC */
.pb{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.pf{height:100%;border-radius:2px;transition:width .4s ease;}
.ann{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px;margin-bottom:10px;transition:var(--tr);border-left:3px solid;}
.ann.high{border-left-color:var(--red)}.ann.medium{border-left-color:var(--gold)}.ann.low{border-left-color:var(--txtm)}
.pe{animation:pi .2s ease;}
@keyframes pi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.logrow{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bdr);align-items:flex-start;font-size:11px;}
.logrow:last-child{border-bottom:none}
.llt{font-family:var(--fc);color:var(--txtm);white-space:nowrap;font-size:10px;padding-top:1px;}
.llm{flex:1;color:var(--txt2);}
.llv{font-family:var(--fc);font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;flex-shrink:0;}
.llv.info{color:var(--txtm);background:rgba(61,84,112,.15)}.llv.warn{color:var(--gold);background:var(--goldf)}.llv.danger{color:#e87060;background:rgba(192,57,43,.12)}

/* PERM TOGGLE */
.ptog{width:34px;height:18px;border-radius:9px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.ptog.on{background:var(--green)}.ptog.off{background:var(--bdrb)}
.ptog::after{content:'';position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;}
.ptog.on::after{left:18px}.ptog.off::after{left:2px}

/* FOUR specific */
.four-item{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px;transition:var(--tr);position:relative;overflow:hidden;}
.four-item:hover{border-color:var(--bdrb);background:var(--bgch);}
.four-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);}
.treasury{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--gold);border-radius:var(--rl);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.treasury::before{content:'💰';position:absolute;right:16px;top:16px;font-size:40px;opacity:.08;}

@media(max-width:900px){:root{--sw:44px}.nav-it span:not(.ic),.logo-text,.logo-sub,.nav-lbl,.suser .ui,.sfooter span{display:none}.nav-it{justify-content:center;padding:9px}.slogo{padding:10px 6px}.logo-mark{justify-content:center}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── FIREBASE HELPERS ────────────────────────────────────────────────────────
const fbAdd  = (col, data) => window.fb.add(col, data);
const fbSet  = (col, id, data) => window.fb.set(col, id, data);
const fbDel  = (col, id) => window.fb.delete(col, id);
const fbLsn  = (col, cb) => window.fb.listen(col, cb);
const fbLsnD = (col, id, cb) => window.fb.listenDoc(col, id, cb);

// ─── PRESENCE FIREBASE ───────────────────────────────────────────────────────
// On stocke la présence dans Firestore: collection "presence", doc = accountId
const setPresence = async (accountId, online) => {
  try {
    await fbSet('presence', accountId, { online, lastSeen: Date.now() });
  } catch(e) {}
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
const fmtMoney = n => '$' + Number(n||0).toLocaleString('fr-FR');
const fmtDate  = () => new Date().toISOString().split('T')[0];
const fmtTime  = () => new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

const GRADES = ['Collaborateur','Syndic','Senechaux','Regent','Heritier'];
const WEAPON_TYPES = ['couteau','machette','petoire','revolver','batte','hache','marteau','katana','pied de biche','queue de billard','queue de golf','cambu'];
const ITEM_CATS = ['Arme','Drogue','Argent','Matériel','Véhicule','Document','Autre'];

// Permissions: chaque clé est une action, la valeur = grade minimum requis par défaut
// Dans Firestore on stocke un objet { perm_key: { Collaborateur:bool, Syndic:bool, ... } }
const ALL_PERMS = {
  members_view:       { label:'👥 Voir les membres',         cat:'Membres' },
  members_add:        { label:'👥 Ajouter un membre',        cat:'Membres' },
  members_edit:       { label:'👥 Modifier une fiche',       cat:'Membres' },
  weapons_view:       { label:'🗡 Voir les armes',           cat:'Armes' },
  weapons_add:        { label:'🗡 Déclarer une arme',        cat:'Armes' },
  weapons_delete:     { label:'🗡 Supprimer une arme',       cat:'Armes' },
  debts_view:         { label:'💰 Voir les dettes',          cat:'Dettes' },
  debts_manage:       { label:'💰 Créer/gérer les dettes',   cat:'Dettes' },
  vehicles_view:      { label:'🚗 Voir les véhicules',       cat:'Véhicules' },
  vehicles_add:       { label:'🚗 Ajouter un véhicule',      cat:'Véhicules' },
  storage_view:       { label:'🏭 Voir le stockage',         cat:'Stockage' },
  storage_manage:     { label:'🏭 Gérer le stockage',        cat:'Stockage' },
  four_view:          { label:'🍖 Voir le four',             cat:'Four' },
  four_buy:           { label:'🍖 Acheter des lots',         cat:'Four' },
  four_sell:          { label:'🍖 Enregistrer une vente',    cat:'Four' },
  four_manage:        { label:'🍖 Gérer les produits',       cat:'Four' },
  announcements_view: { label:'📢 Voir les annonces',        cat:'Annonces' },
  announcements_post: { label:'📢 Publier une annonce',      cat:'Annonces' },
  chat_read:          { label:'💬 Lire le chat',             cat:'Chat' },
  chat_write:         { label:'💬 Écrire dans le chat',      cat:'Chat' },
  logs_view:          { label:'📋 Voir les logs',            cat:'Logs' },
  map_view:           { label:'🗺 Voir la carte',            cat:'Carte' },
};

const DEFAULT_PERMS_BY_GRADE = {
  Heritier:     Object.fromEntries(Object.keys(ALL_PERMS).map(k=>[k,true])),
  Regent:       { members_view:true,members_add:true,members_edit:true,weapons_view:true,weapons_add:true,weapons_delete:true,debts_view:true,debts_manage:true,vehicles_view:true,vehicles_add:true,storage_view:true,storage_manage:true,four_view:true,four_buy:true,four_sell:true,four_manage:true,announcements_view:true,announcements_post:true,chat_read:true,chat_write:true,logs_view:false,map_view:true },
  Senechaux:    { members_view:true,members_add:false,members_edit:false,weapons_view:true,weapons_add:true,weapons_delete:false,debts_view:true,debts_manage:false,vehicles_view:true,vehicles_add:false,storage_view:true,storage_manage:true,four_view:true,four_buy:false,four_sell:true,four_manage:false,announcements_view:true,announcements_post:true,chat_read:true,chat_write:true,logs_view:false,map_view:true },
  Syndic:       { members_view:true,members_add:false,members_edit:false,weapons_view:true,weapons_add:false,weapons_delete:false,debts_view:true,debts_manage:false,vehicles_view:true,vehicles_add:false,storage_view:true,storage_manage:false,four_view:true,four_buy:false,four_sell:true,four_manage:false,announcements_view:true,announcements_post:false,chat_read:true,chat_write:true,logs_view:false,map_view:true },
  Collaborateur:{ members_view:true,members_add:false,members_edit:false,weapons_view:false,weapons_add:false,weapons_delete:false,debts_view:false,debts_manage:false,vehicles_view:true,vehicles_add:false,storage_view:false,storage_manage:false,four_view:true,four_buy:false,four_sell:false,four_manage:false,announcements_view:true,announcements_post:false,chat_read:true,chat_write:true,logs_view:false,map_view:true },
};

const gradeColor = g => ({Heritier:'#c8cad4',Regent:'#c9a84c',Senechaux:'#00d084',Syndic:'#60a5fa',Collaborateur:'#7a90a8'}[g]||'#7a90a8');
const gradeClass = g => 'g'+g;

const pushLog = async (type,msg,level='info') => {
  try { await fbAdd('logs',{type,msg,level,time:fmtTime(),date:fmtDate()}); } catch(e){}
};

// ─── MODAL ───────────────────────────────────────────────────────────────────
function Modal({title,onClose,children,footer,wide}){
  return(
    <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={wide?{maxWidth:700}:{}}>
        <div className="mh"><span className="mt">{title}</span><button className="mc" onClick={onClose}>×</button></div>
        <div className="mb">{children}</div>
        {footer&&<div className="mf">{footer}</div>}
      </div>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({currentUser}){
  const [members,setMembers]=useState([]);
  const [debts,setDebts]=useState([]);
  const [anns,setAnns]=useState([]);
  const [presence,setPresence2]=useState([]);
  const [treasury,setTreasury]=useState(null);
  const [fourItems,setFourItems]=useState([]);

  useEffect(()=>{
    const u1=fbLsn('members',setMembers);
    const u2=fbLsn('debts',setDebts);
    const u3=fbLsn('announcements',d=>setAnns(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));
    const u4=fbLsn('presence',setPresence2);
    const u5=fbLsnD('treasury','main',setTreasury);
    const u6=fbLsn('four_items',setFourItems);
    return()=>{u1();u2();u3();u4();u5();u6();};
  },[]);

  const online=presence.filter(p=>p.online).length;
  const unpaid=debts.filter(d=>d.status!=='payé').reduce((s,d)=>s+(d.amount-d.paid),0);
  const totalStock=fourItems.reduce((s,i)=>s+(i.stock||0),0);
  const tAmount=treasury?.amount||0;

  return(
    <div className="pe">
      <div className="sgrid">
        <div className="sc g"><div className="sl">Membres en ligne</div><div className="sv">{online}</div><div className="ss">/{members.length} total</div><span className="si">👥</span></div>

// ─── MEMBERS ─────────────────────────────────────────────────────────────────
function Members({currentUser,perms}){
  const [members,setMembers]=useState([]);
  const [presence,setPresence2]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [editM,setEditM]=useState(null);
  const [form,setForm]=useState({pseudo:'',grade:'Collaborateur',phone:''});
  const [filter,setFilter]=useState('all');

  useEffect(()=>{
    const u1=fbLsn('members',setMembers);
    const u2=fbLsn('presence',setPresence2);
    return()=>{u1();u2();};
  },[]);

  const isOnline=mId=>{
    const p=presence.find(x=>x.memberId===mId);
    return p?.online||false;
  };

  const addMember=async()=>{
    if(!form.pseudo)return;
    await fbAdd('members',{pseudo:form.pseudo,grade:form.grade,phone:form.phone,joined:fmtDate(),avatar:form.pseudo[0].toUpperCase(),avatarColor:gradeColor(form.grade)});
    pushLog('modification',`Membre ajouté: ${form.pseudo} par ${currentUser.pseudo}`,'info');
    setShowAdd(false);setForm({pseudo:'',grade:'Collaborateur',phone:''});
  };
  const saveEdit=async()=>{
    if(!editM)return;
    const{id,...d}=editM;
    await fbSet('members',id,{...d,avatarColor:gradeColor(d.grade)});
    pushLog('modification',`Fiche ${editM.pseudo} modifiée par ${currentUser.pseudo}`,'info');
    setEditM(null);
  };
  const delMember=async id=>{
    await fbDel('members',id);
    pushLog('suppression',`Membre supprimé par ${currentUser.pseudo}`,'danger');
  };

  const filtered=filter==='all'?members:members.filter(m=>m.grade===filter);

  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {['all',...GRADES].map(g=>(
            <button key={g} className={`btn btn-sm ${filter===g?'btn-p':'btn-s'}`} onClick={()=>setFilter(g)}>{g==='all'?'Tous':g}</button>
          ))}
        </div>
        {perms.members_add&&<button className="btn btn-p btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAdd(true)}>+ Nouveau membre</button>}
      </div>
      <div className="card">
        <table className="dt">
          <thead><tr><th>MEMBRE</th><th>GRADE</th><th>TÉLÉPHONE</th><th>STATUT</th><th>INTÉGRATION</th>{perms.members_edit&&<th>ACTION</th>}</tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td>
                  <div style={{display:'flex',alignItems:'center',gap:9}}>
                    <div style={{width:26,height:26,borderRadius:'50%',background:m.avatarColor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,fontFamily:'var(--fc)',color:'#fff',flexShrink:0,position:'relative'}}>
                      {m.avatar}
                      {isOnline(m.id)&&<span style={{position:'absolute',bottom:-1,right:-1,width:8,height:8,borderRadius:'50%',background:'var(--green)',border:'2px solid var(--bgc)'}}></span>}
                    </div>
                    <span style={{color:'var(--txt)',fontWeight:600}}>{m.pseudo}</span>
                  </div>
                </td>
                <td><span className={gradeClass(m.grade)} style={{fontSize:11,fontWeight:600}}>{m.grade}</span></td>
                <td><span style={{fontFamily:'var(--fc)',fontSize:11}}>{m.phone||'—'}</span></td>
                <td>{isOnline(m.id)?<span className="bdg bdg-g">● En ligne</span>:<span className="bdg bdg-gr">○ Hors ligne</span>}</td>
                <td><span style={{fontSize:11,fontFamily:'var(--fc)'}}>{m.joined}</span></td>
                {perms.members_edit&&<td><div style={{display:'flex',gap:4}}>
                  <button className="btn btn-s btn-sm" onClick={()=>setEditM({...m})}>✏</button>
                  {currentUser.grade==='Heritier'&&m.id!==currentUser.id&&<button className="btn btn-d btn-sm" onClick={()=>delMember(m.id)}>🗑</button>}
                </div></td>}
              </tr>
            ))}
          </tbody>
        </table>

      {showAdd&&<Modal title="Nouveau Membre" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addMember}>Confirmer</button></>}>
        <div className="fg"><label className="lbl">PSEUDO RP</label><input className="inp" value={form.pseudo} onChange={e=>setForm({...form,pseudo:e.target.value})} placeholder="Ex: Shadow"/></div>
        <div className="fg"><label className="lbl">GRADE</label><select className="sel" value={form.grade} onChange={e=>setForm({...form,grade:e.target.value})}>{GRADES.map(g=><option key={g}>{g}</option>)}</select></div>
        <div className="fg"><label className="lbl">TÉLÉPHONE RP</label><input className="inp" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Ex: 06 12 34 56"/></div>
      </Modal>}

      {editM&&<Modal title={`Modifier — ${editM.pseudo}`} onClose={()=>setEditM(null)} footer={<><button className="btn btn-s" onClick={()=>setEditM(null)}>Annuler</button><button className="btn btn-p" onClick={saveEdit}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">PSEUDO RP</label><input className="inp" value={editM.pseudo} onChange={e=>setEditM({...editM,pseudo:e.target.value})}/></div>
        <div className="fg"><label className="lbl">GRADE</label><select className="sel" value={editM.grade} onChange={e=>setEditM({...editM,grade:e.target.value})}>{GRADES.map(g=><option key={g}>{g}</option>)}</select></div>

      </Modal>}

  );
}

// ─── DEBTS ───────────────────────────────────────────────────────────────────
function Debts({currentUser,perms}){
  const [debts,setDebts]=useState([]);
  const [members,setMembers]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [rembModal,setRembModal]=useState(null);
  const [tab,setTab]=useState('non-payé');
  const [form,setForm]=useState({debtor:'',amount:'',reason:'',date:''});
  const [rAmt,setRAmt]=useState('');

  useEffect(()=>{
    const u1=fbLsn('debts',setDebts);
    const u2=fbLsn('members',setMembers);
    return()=>{u1();u2();};
  },[]);

  if(!perms.debts_view)return<AccessDenied/>;

  const addDebt=async()=>{
    if(!form.debtor||!form.amount)return;
    await fbAdd('debts',{debtor:form.debtor,amount:parseInt(form.amount),reason:form.reason,date:form.date||fmtDate(),status:'non-payé',paid:0});
    pushLog('modification',`Dette créée: ${form.debtor} ${fmtMoney(parseInt(form.amount))} par ${currentUser.pseudo}`,'warn');
    setShowAdd(false);setForm({debtor:'',amount:'',reason:'',date:''});
  };
  const addRemb=async()=>{
    const val=parseInt(rAmt);if(!val||val<=0)return;
    const d=debts.find(x=>x.id===rembModal);if(!d)return;
    const np=Math.min(d.paid+val,d.amount);
    await fbSet('debts',d.id,{paid:np,status:np>=d.amount?'payé':np>0?'partiel':'non-payé'});
    pushLog('modification',`Remboursement ${fmtMoney(val)} — ${d.debtor}`,'info');
    setRAmt('');setRembModal(null);
  };
  const delDebt=async id=>{
    await fbDel('debts',id);
    pushLog('suppression',`Dette supprimée par ${currentUser.pseudo}`,'danger');
  };

  const total=debts.filter(d=>d.status!=='payé').reduce((s,d)=>s+d.amount-d.paid,0);
  const counts={'non-payé':debts.filter(d=>d.status==='non-payé').length,partiel:debts.filter(d=>d.status==='partiel').length,'payé':debts.filter(d=>d.status==='payé').length};
  const filtered=debts.filter(d=>d.status===tab);

  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <div className="sc r" style={{flex:1,padding:11,marginBottom:0}}><div className="sl">Total Dettes Actives</div><div className="sv" style={{fontSize:17}}>{fmtMoney(total)}</div></div>
        <div className="sc g" style={{flex:1,padding:11,marginBottom:0}}><div className="sl">Soldées</div><div className="sv" style={{fontSize:17}}>{counts['payé']}</div></div>
        {perms.debts_manage&&<button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}>+ Créer dette</button>}
      </div>
      <div style={{display:'flex',gap:4,marginBottom:10}}>
        {[{k:'non-payé',l:'Impayées'},{k:'partiel',l:'Partielles'},{k:'payé',l:'Payées'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} className={`btn btn-sm ${tab===t.k?'btn-p':'btn-s'}`}>{t.l} <span style={{fontFamily:'var(--fc)',fontSize:10,opacity:.7}}>({counts[t.k]})</span></button>
        ))}
      </div>
      <div className="card">
        {filtered.length===0?<div style={{padding:36,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucune dette dans cette catégorie</div>:
          <table className="dt">
            <thead><tr><th>DÉBITEUR</th><th>MONTANT</th><th>RAISON</th><th>DATE</th><th>REMBOURSÉ</th><th>ACTION</th></tr></thead>
            <tbody>
              {filtered.map(d=>(
                <tr key={d.id}>
                  <td style={{color:'var(--txt)',fontWeight:600}}>{d.debtor}</td>
                  <td style={{fontFamily:'var(--fc)',color:d.status!=='payé'?'#e87060':'var(--green)',fontWeight:700}}>{fmtMoney(d.amount)}</td>
                  <td style={{fontSize:11,maxWidth:130,color:'var(--txtm)'}}>{d.reason}</td>
                  <td style={{fontSize:11,fontFamily:'var(--fc)'}}>{d.date}</td>
                  <td>
                    <div style={{fontSize:11,fontFamily:'var(--fc)',marginBottom:3}}>{fmtMoney(d.paid)}/{fmtMoney(d.amount)}</div>
                    <div className="pb" style={{width:90}}><div className="pf" style={{width:`${Math.min(100,Math.round(d.paid/d.amount*100))}%`,background:d.status==='payé'?'var(--green)':d.status==='partiel'?'var(--gold)':'#e87060'}}></div></div>
                  </td>
                  <td><div style={{display:'flex',gap:4}}>
                    {d.status!=='payé'&&perms.debts_manage&&<button className="btn btn-s btn-sm" onClick={()=>{setRembModal(d.id);setRAmt('');}}>+ Remb.</button>}
                    {perms.debts_manage&&<button className="btn btn-d btn-sm" onClick={()=>delDebt(d.id)}>🗑</button>}
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        }
      </div>

      {showAdd&&<Modal title="Créer une Dette" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addDebt}>Créer</button></>}>
        <div className="fg"><label className="lbl">MEMBRE DÉBITEUR</label><select className="sel" value={form.debtor} onChange={e=>setForm({...form,debtor:e.target.value})}><option value="">Sélectionner...</option>{members.map(m=><option key={m.id}>{m.pseudo}</option>)}</select></div>
        <div className="fg"><label className="lbl">MONTANT ($)</label><input type="number" className="inp" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="25000"/></div>
        <div className="fg"><label className="lbl">RAISON</label><input className="inp" value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} placeholder="Livraison..."/></div>
        <div className="fg"><label className="lbl">DATE</label><input type="date" className="inp" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
      </Modal>}

      {rembModal&&(()=>{const d=debts.find(x=>x.id===rembModal);if(!d)return null;return(
        <Modal title="Ajouter un Remboursement" onClose={()=>setRembModal(null)} footer={<><button className="btn btn-s" onClick={()=>setRembModal(null)}>Annuler</button><button className="btn btn-p" onClick={addRemb}>Confirmer</button></>}>
          <div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:12,marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:'var(--txt)',marginBottom:8}}>{d.debtor}</div>
            <div style={{display:'flex',gap:18}}>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>TOTAL DÛ</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(d.amount)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>PAYÉ</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(d.paid)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>RESTE</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'var(--gold)',fontWeight:700}}>{fmtMoney(d.amount-d.paid)}</div></div>
            </div>
          </div>
          <div className="fg"><label className="lbl">MONTANT REMBOURSÉ ($)</label><input type="number" className="inp" value={rAmt} onChange={e=>setRAmt(e.target.value)} placeholder={`Max: ${fmtMoney(d.amount-d.paid)}`}/></div>
        </Modal>
      );})()}
    </div>
  );
}

// ─── VEHICLES ────────────────────────────────────────────────────────────────
function Vehicles({currentUser,perms}){
  const [vehicles,setVehicles]=useState([]);
  const [members,setMembers]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [selUser,setSelUser]=useState(currentUser.pseudo);
  const [form,setForm]=useState({model:'',plate:'',state:'Parfait'});

  useEffect(()=>{
    const u1=fbLsn('vehicles',setVehicles);
    const u2=fbLsn('members',setMembers);
    return()=>{u1();u2();};
  },[]);

  if(!perms.vehicles_view)return<AccessDenied/>;

  const sColor=s=>({Parfait:'var(--green)',Bon:'var(--gold)',Endommagé:'#e87060','Saisie probable':'#888'}[s]||'var(--txtm)');

  const addV=async()=>{
    if(!form.model||!form.plate)return;
    await fbAdd('vehicles',{model:form.model,plate:form.plate,state:form.state,lastUsedBy:'',usage:[]});
    pushLog('stock',`Véhicule ajouté: ${form.model} (${form.plate}) par ${currentUser.pseudo}`,'info');
    setShowAdd(false);setForm({model:'',plate:'',state:'Parfait'});
  };
  const claim=async id=>{
    const v=vehicles.find(x=>x.id===id);
    const d=new Date();const ds=`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
    await fbSet('vehicles',id,{lastUsedBy:selUser,usage:[...(v?.usage||[]),`${selUser} - ${ds}`]});
    pushLog('transfert',`Véhicule utilisé par ${selUser}`,'info');
  };
  const del=async id=>{
    const v=vehicles.find(x=>x.id===id);
    await fbDel('vehicles',id);
    pushLog('suppression',`Véhicule supprimé: ${v?.model} par ${currentUser.pseudo}`,'danger');
  };

  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <label className="lbl" style={{marginBottom:0,whiteSpace:'nowrap'}}>DÉCLARER POUR :</label>
        <select className="sel" style={{width:170}} value={selUser} onChange={e=>setSelUser(e.target.value)}>{members.map(m=><option key={m.id}>{m.pseudo}</option>)}</select>
        {perms.vehicles_add&&<button className="btn btn-p btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAdd(true)}>+ Ajouter</button>}
      </div>
      <div className="card">
        {vehicles.length===0?<div style={{padding:36,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucun véhicule</div>:
          <table className="dt">
            <thead><tr><th>MODÈLE</th><th>PLAQUE</th><th>ÉTAT</th><th>DERNIER USAGE</th><th>ACTION</th></tr></thead>
            <tbody>
              {vehicles.map(v=>(
                <tr key={v.id}>
                  <td style={{color:'var(--txt)',fontWeight:600}}>{v.model}</td>
                  <td><span style={{fontSize:10,background:'var(--bg3)',padding:'2px 6px',borderRadius:3,border:'1px solid var(--bdr)',fontFamily:'var(--fc)'}}>{v.plate}</span></td>
                  <td><span style={{fontSize:11,color:sColor(v.state),fontWeight:600}}>{v.state}</span></td>
                  <td style={{fontSize:11,color:'var(--txtm)',fontFamily:'var(--fc)'}}>{(v.usage||[]).length>0?v.usage[v.usage.length-1]:'—'}</td>
                  <td><div style={{display:'flex',gap:4}}>
                    <button className={`btn btn-sm ${v.lastUsedBy===selUser?'btn-g':'btn-s'}`} onClick={()=>claim(v.id)}>{v.lastUsedBy===selUser?`✓ ${selUser}`:`→ ${selUser}`}</button>
                    {currentUser.grade==='Heritier'&&<button className="btn btn-d btn-sm" onClick={()=>del(v.id)}>🗑</button>}
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        }
      </div>
      {showAdd&&<Modal title="Ajouter un Véhicule" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addV}>Enregistrer</button></>}>
        <div className="fg"><label className="lbl">MODÈLE</label><input className="inp" value={form.model} onChange={e=>setForm({...form,model:e.target.value})} placeholder="Sultan RS"/></div>
        <div className="fg"><label className="lbl">PLAQUE</label><input className="inp" value={form.plate} onChange={e=>setForm({...form,plate:e.target.value})} placeholder="VMF-01"/></div>
        <div className="fg"><label className="lbl">ÉTAT</label><select className="sel" value={form.state} onChange={e=>setForm({...form,state:e.target.value})}>{['Parfait','Bon','Endommagé','Saisie probable'].map(s=><option key={s}>{s}</option>)}</select></div>
      </Modal>}
    </div>
  );
}

// ─── FOUR (économie groupe) ───────────────────────────────────────────────────
function Four({currentUser,perms}){
  const [items,setItems]=useState([]);
  const [treasury,setTreasury]=useState(null);
  const [showAddItem,setShowAddItem]=useState(false);
  const [showBuy,setShowBuy]=useState(null);   // item
  const [showSell,setShowSell]=useState(null);  // item
  const [showEditItem,setShowEditItem]=useState(null);
  const [showEditT,setShowEditT]=useState(false);
  const [itemForm,setItemForm]=useState({name:'',buyPrice:'',sellPrice:'',category:'Drogue',unit:'unité'});
  const [buyQty,setBuyQty]=useState(1);
  const [sellQty,setSellQty]=useState(1);
  const [sellPrice2,setSellPrice2]=useState('');
  const [tForm,setTForm]=useState('');
  const [transLog,setTransLog]=useState([]);

  useEffect(()=>{
    const u1=fbLsn('four_items',setItems);
    const u2=fbLsnD('treasury','main',setTreasury);
    const u3=fbLsn('four_transactions',d=>setTransLog(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));
    return()=>{u1();u2();u3();};
  },[]);

  const tAmount=treasury?.amount||0;

  // Init treasury si inexistant
  const ensureTreasury=async()=>{
    if(!treasury){await fbSet('treasury','main',{amount:0});}
  };

  const addItem=async()=>{
    if(!itemForm.name||!itemForm.buyPrice||!itemForm.sellPrice)return;
    await fbAdd('four_items',{name:itemForm.name,buyPrice:parseInt(itemForm.buyPrice),sellPrice:parseInt(itemForm.sellPrice),category:itemForm.category,unit:itemForm.unit||'unité',stock:0,totalBought:0,totalSold:0,revenue:0});
    pushLog('stock',`Produit four ajouté: ${itemForm.name} par ${currentUser.pseudo}`,'info');
    setShowAddItem(false);setItemForm({name:'',buyPrice:'',sellPrice:'',category:'Drogue',unit:'unité'});
  };

  const buyItem=async()=>{
    const qty=parseInt(buyQty)||1;
    if(!showBuy||qty<=0)return;
    await ensureTreasury();
    const cost=showBuy.buyPrice*qty;
    if(tAmount<cost){alert(`Trésorerie insuffisante! Disponible: ${fmtMoney(tAmount)}, Coût: ${fmtMoney(cost)}`);return;}
    await fbSet('four_items',showBuy.id,{stock:(showBuy.stock||0)+qty,totalBought:(showBuy.totalBought||0)+qty});
    await fbSet('treasury','main',{amount:tAmount-cost});
    await fbAdd('four_transactions',{type:'achat',item:showBuy.name,qty,price:showBuy.buyPrice,total:cost,by:currentUser.pseudo,date:fmtDate()});
    pushLog('stock',`Achat: ${qty}x ${showBuy.name} pour ${fmtMoney(cost)} par ${currentUser.pseudo}`,'warn');
    setShowBuy(null);setBuyQty(1);
  };

  const sellItem=async()=>{
    const qty=parseInt(sellQty)||1;
    const sprice=parseInt(sellPrice2)||showSell.sellPrice;
    if(!showSell||qty<=0)return;
    if(qty>(showSell.stock||0)){alert('Stock insuffisant!');return;}
    await ensureTreasury();
    const gain=sprice*qty;
    await fbSet('four_items',showSell.id,{stock:(showSell.stock||0)-qty,totalSold:(showSell.totalSold||0)+qty,revenue:(showSell.revenue||0)+gain});
    await fbSet('treasury','main',{amount:tAmount+gain});
    await fbAdd('four_transactions',{type:'vente',item:showSell.name,qty,price:sprice,total:gain,by:currentUser.pseudo,date:fmtDate()});
    pushLog('stock',`Vente: ${qty}x ${showSell.name} pour ${fmtMoney(gain)} par ${currentUser.pseudo}`,'info');
    setShowSell(null);setSellQty(1);setSellPrice2('');
  };

  const delItem=async id=>{
    await fbDel('four_items',id);
    pushLog('suppression',`Produit four supprimé par ${currentUser.pseudo}`,'danger');
  };

  const saveEditItem=async()=>{
    if(!showEditItem)return;
    const{id,...d}=showEditItem;
    await fbSet('four_items',id,{name:d.name,buyPrice:parseInt(d.buyPrice),sellPrice:parseInt(d.sellPrice),category:d.category,unit:d.unit});
    setShowEditItem(null);
  };

  const setTreasury2=async()=>{
    const v=parseInt(tForm);if(isNaN(v))return;
    await fbSet('treasury','main',{amount:v});
    pushLog('modification',`Trésorerie définie à ${fmtMoney(v)} par ${currentUser.pseudo}`,'warn');
    setShowEditT(false);setTForm('');
  };

  const adjustTreasury=async(delta)=>{
    await ensureTreasury();
    await fbSet('treasury','main',{amount:Math.max(0,tAmount+delta)});
  };

  if(!perms.four_view)return<AccessDenied/>;

  const catColors={'Drogue':'var(--green)','Arme':'#e87060','Argent':'var(--gold)','Matériel':'#60a5fa','Autre':'var(--txtm)'};

  const totalRevenue=items.reduce((s,i)=>s+(i.revenue||0),0);
  const totalSpent=items.reduce((s,i)=>s+(i.totalBought||0)*(i.buyPrice||0),0);

  return(
    <div className="pe">
      {/* Trésorerie */}
      <div className="treasury">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
          <div>
            <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--gold)',letterSpacing:'.12em',marginBottom:6}}>TRÉSORERIE DU GROUPE</div>
            <div style={{fontSize:32,fontWeight:800,color:'var(--gold)',lineHeight:1}}>{fmtMoney(tAmount)}</div>
            <div style={{display:'flex',gap:20,marginTop:10}}>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>REVENUS TOTAUX</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(totalRevenue)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>DÉPENSES TOTALES</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(totalSpent)}</div></div>
            </div>
          </div>
          {(currentUser.grade==='Heritier'||currentUser.grade==='Regent')&&(
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <button className="btn btn-s btn-sm" onClick={()=>{setTForm(String(tAmount));setShowEditT(true);}}>✏ Définir</button>
              <button className="btn btn-g btn-sm" onClick={()=>{const v=prompt('Ajouter combien?');const n=parseInt(v);if(n>0)adjustTreasury(n);}}>+ Ajouter</button>
              <button className="btn btn-d btn-sm" onClick={()=>{const v=prompt('Retirer combien?');const n=parseInt(v);if(n>0)adjustTreasury(-n);}}>− Retirer</button>
            </div>
          )}
        </div>
      </div>

      {/* Header produits */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <span style={{fontSize:13,fontWeight:700,color:'var(--txt)'}}>🍖 Produits en stock</span>
        {perms.four_manage&&<button className="btn btn-p btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAddItem(true)}>+ Nouveau produit</button>}
      </div>

      {/* Grille produits */}
      {items.length===0?
        <div className="card"><div style={{padding:40,textAlign:'center',color:'var(--txtm)',fontSize:12,fontFamily:'var(--fc)'}}>Aucun produit défini</div></div>
      :
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:12,marginBottom:20}}>
          {items.map(item=>{
            const margin=item.sellPrice-item.buyPrice;
            const marginPct=item.buyPrice>0?Math.round((margin/item.buyPrice)*100):0;
            return(
              <div className="four-item" key={item.id}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:'var(--txt)'}}>{item.name}</div>
                    <div style={{fontSize:10,fontFamily:'var(--fc)',color:catColors[item.category]||'var(--txtm)',marginTop:2}}>{item.category} • {item.unit}</div>
                  </div>
                  <div style={{display:'flex',gap:4}}>
                    {perms.four_manage&&<button className="btn btn-s btn-sm" onClick={()=>setShowEditItem({...item})}>✏</button>}
                    {perms.four_manage&&currentUser.grade==='Heritier'&&<button className="btn btn-d btn-sm" onClick={()=>delItem(item.id)}>🗑</button>}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:12}}>
                  <div style={{background:'var(--bg3)',borderRadius:4,padding:'6px 8px'}}>
                    <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>ACHAT</div>
                    <div style={{fontSize:12,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(item.buyPrice)}</div>
                  </div>
                  <div style={{background:'var(--bg3)',borderRadius:4,padding:'6px 8px'}}>
                    <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>VENTE</div>
                    <div style={{fontSize:12,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(item.sellPrice)}</div>
                  </div>
                  <div style={{background:'var(--bg3)',borderRadius:4,padding:'6px 8px'}}>
                    <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>MARGE</div>
                    <div style={{fontSize:12,fontFamily:'var(--fc)',color:'var(--gold)',fontWeight:700}}>+{marginPct}%</div>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div><span style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>STOCK </span><span style={{fontSize:18,fontWeight:800,color:(item.stock||0)>0?'var(--txt)':'#e87060'}}>{item.stock||0}</span><span style={{fontSize:10,color:'var(--txtm)'}}> {item.unit}s</span></div>
                  <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>Vendu: {item.totalSold||0} | Rev: {fmtMoney(item.revenue||0)}</div>
                </div>
                <div style={{display:'flex',gap:6}}>
                  {perms.four_buy&&<button className="btn btn-d btn-sm" style={{flex:1}} onClick={()=>{setShowBuy(item);setBuyQty(1);}}>🛒 Acheter</button>}
                  {perms.four_sell&&(item.stock||0)>0&&<button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>{setShowSell(item);setSellQty(1);setSellPrice2('');}}>💵 Vendre</button>}
                  {perms.four_sell&&(item.stock||0)===0&&<button className="btn btn-s btn-sm" style={{flex:1}} disabled>Stock vide</button>}
                </div>
              </div>
            );
          })}
        </div>
      }

      {/* Historique transactions */}
      {transLog.length>0&&(
        <div className="card" style={{marginTop:4}}>
          <div className="ch"><span className="ct">📜 Historique des transactions</span><span className="csub">{transLog.length} opérations</span></div>
          <div style={{maxHeight:220,overflowY:'auto'}}>
            {transLog.slice(0,50).map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 14px',borderBottom:'1px solid var(--bdr)',fontSize:11}}>
                <span style={{fontSize:14}}>{t.type==='achat'?'🔴':'🟢'}</span>
                <span style={{fontFamily:'var(--fc)',color:'var(--txtm)',width:70,flexShrink:0}}>{t.date}</span>
                <span style={{flex:1,color:'var(--txt2)'}}>{t.type==='achat'?'Achat':'Vente'} {t.qty}x <strong style={{color:'var(--txt)'}}>{t.item}</strong></span>
                <span style={{fontFamily:'var(--fc)',fontWeight:700,color:t.type==='achat'?'#e87060':'var(--green)'}}>{t.type==='achat'?'-':'+' }{fmtMoney(t.total)}</span>
                <span style={{fontSize:9,color:'var(--txtm)',fontFamily:'var(--fc)'}}>{t.by}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Modals */}
      {showAddItem&&<Modal title="Nouveau Produit" onClose={()=>setShowAddItem(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAddItem(false)}>Annuler</button><button className="btn btn-p" onClick={addItem}>Ajouter</button></>}>
        <div className="fg"><label className="lbl">NOM DU PRODUIT</label><input className="inp" value={itemForm.name} onChange={e=>setItemForm({...itemForm,name:e.target.value})} placeholder="Ex: Héroïne"/></div>
        <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={itemForm.category} onChange={e=>setItemForm({...itemForm,category:e.target.value})}>{['Drogue','Arme','Argent','Matériel','Autre'].map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="fg"><label className="lbl">UNITÉ</label><input className="inp" value={itemForm.unit} onChange={e=>setItemForm({...itemForm,unit:e.target.value})} placeholder="unité, sachet, kg..."/></div>
        <div className="g2">
          <div className="fg"><label className="lbl">PRIX D'ACHAT ($)</label><input type="number" className="inp" value={itemForm.buyPrice} onChange={e=>setItemForm({...itemForm,buyPrice:e.target.value})} placeholder="5000"/></div>
          <div className="fg"><label className="lbl">PRIX DE VENTE ($)</label><input type="number" className="inp" value={itemForm.sellPrice} onChange={e=>setItemForm({...itemForm,sellPrice:e.target.value})} placeholder="8000"/></div>
        </div>
        {itemForm.buyPrice&&itemForm.sellPrice&&<div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:'8px 12px',fontSize:11,fontFamily:'var(--fc)',color:'var(--green)'}}>Marge: {fmtMoney(parseInt(itemForm.sellPrice||0)-parseInt(itemForm.buyPrice||0))} (+{Math.round(((parseInt(itemForm.sellPrice||0)-parseInt(itemForm.buyPrice||0))/Math.max(1,parseInt(itemForm.buyPrice||1)))*100)}%)</div>}
      </Modal>}

      {showEditItem&&<Modal title={`Modifier — ${showEditItem.name}`} onClose={()=>setShowEditItem(null)} footer={<><button className="btn btn-s" onClick={()=>setShowEditItem(null)}>Annuler</button><button className="btn btn-p" onClick={saveEditItem}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">NOM</label><input className="inp" value={showEditItem.name} onChange={e=>setShowEditItem({...showEditItem,name:e.target.value})}/></div>
        <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={showEditItem.category} onChange={e=>setShowEditItem({...showEditItem,category:e.target.value})}>{['Drogue','Arme','Argent','Matériel','Autre'].map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="fg"><label className="lbl">UNITÉ</label><input className="inp" value={showEditItem.unit} onChange={e=>setShowEditItem({...showEditItem,unit:e.target.value})}/></div>
        <div className="g2">
          <div className="fg"><label className="lbl">PRIX D'ACHAT ($)</label><input type="number" className="inp" value={showEditItem.buyPrice} onChange={e=>setShowEditItem({...showEditItem,buyPrice:e.target.value})}/></div>
          <div className="fg"><label className="lbl">PRIX DE VENTE ($)</label><input type="number" className="inp" value={showEditItem.sellPrice} onChange={e=>setShowEditItem({...showEditItem,sellPrice:e.target.value})}/></div>
        </div>
      </Modal>}

      {showBuy&&<Modal title={`🛒 Acheter — ${showBuy.name}`} onClose={()=>setShowBuy(null)} footer={<><button className="btn btn-s" onClick={()=>setShowBuy(null)}>Annuler</button><button className="btn btn-d" onClick={buyItem}>Confirmer l'achat</button></>}>
        <div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:12,marginBottom:14}}>
          <div style={{display:'flex',gap:20}}>
            <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>PRIX UNITAIRE</div><div style={{fontSize:14,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(showBuy.buyPrice)}</div></div>
            <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>TRÉSORERIE</div><div style={{fontSize:14,fontFamily:'var(--fc)',color:'var(--gold)',fontWeight:700}}>{fmtMoney(tAmount)}</div></div>
            <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>STOCK ACTUEL</div><div style={{fontSize:14,fontFamily:'var(--fc)',color:'var(--txt)',fontWeight:700}}>{showBuy.stock||0}</div></div>
          </div>
        </div>
        <div className="fg"><label className="lbl">QUANTITÉ À ACHETER</label><input type="number" className="inp" min="1" value={buyQty} onChange={e=>setBuyQty(e.target.value)}/></div>
        {buyQty>0&&<div style={{background:tAmount<showBuy.buyPrice*parseInt(buyQty||1)?'rgba(192,57,43,.12)':'var(--greenf)',border:`1px solid ${tAmount<showBuy.buyPrice*parseInt(buyQty||1)?'rgba(192,57,43,.3)':'rgba(0,208,132,.3)'}`,borderRadius:'var(--r)',padding:'10px 12px',fontSize:12,fontFamily:'var(--fc)',display:'flex',justifyContent:'space-between'}}>
          <span>Coût total:</span>
          <span style={{fontWeight:700,color:tAmount<showBuy.buyPrice*parseInt(buyQty||1)?'#e87060':'var(--green)'}}>{fmtMoney(showBuy.buyPrice*parseInt(buyQty||1))}</span>
        </div>}
      </Modal>}

      {showSell&&<Modal title={`💵 Vendre — ${showSell.name}`} onClose={()=>setShowSell(null)} footer={<><button className="btn btn-s" onClick={()=>setShowSell(null)}>Annuler</button><button className="btn btn-g" onClick={sellItem}>Confirmer la vente</button></>}>
        <div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:12,marginBottom:14}}>
          <div style={{display:'flex',gap:20}}>
            <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>PRIX SUGGÉRÉ</div><div style={{fontSize:14,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(showSell.sellPrice)}</div></div>
            <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>STOCK DISPO</div><div style={{fontSize:14,fontFamily:'var(--fc)',color:'var(--txt)',fontWeight:700}}>{showSell.stock||0}</div></div>
          </div>
        </div>
        <div className="fg"><label className="lbl">QUANTITÉ VENDUE</label><input type="number" className="inp" min="1" max={showSell.stock||0} value={sellQty} onChange={e=>setSellQty(e.target.value)}/></div>
        <div className="fg"><label className="lbl">PRIX DE VENTE RÉEL (laisser vide = prix suggéré)</label><input type="number" className="inp" value={sellPrice2} onChange={e=>setSellPrice2(e.target.value)} placeholder={String(showSell.sellPrice)}/></div>
        {sellQty>0&&<div style={{background:'var(--greenf)',border:'1px solid rgba(0,208,132,.3)',borderRadius:'var(--r)',padding:'10px 12px',fontSize:12,fontFamily:'var(--fc)',display:'flex',justifyContent:'space-between'}}>
          <span>Gain total:</span>
          <span style={{fontWeight:700,color:'var(--green)'}}>{fmtMoney((parseInt(sellPrice2)||showSell.sellPrice)*parseInt(sellQty||1))}</span>
        </div>}
      </Modal>}

      {showEditT&&<Modal title="Définir la Trésorerie" onClose={()=>setShowEditT(false)} footer={<><button className="btn btn-s" onClick={()=>setShowEditT(false)}>Annuler</button><button className="btn btn-p" onClick={setTreasury2}>Confirmer</button></>}>
        <div className="fg"><label className="lbl">MONTANT ($)</label><input type="number" className="inp" value={tForm} onChange={e=>setTForm(e.target.value)} placeholder="0"/></div>
        <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>⚠ Cela remplace directement le montant actuel.</div>
      </Modal>}
    </div>
  );
}

// ─── CHAT ────────────────────────────────────────────────────────────────────
function Chat({currentUser,perms}){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [presence,setPresence2]=useState([]);
  const [members,setMembers]=useState([]);
  const endRef=useRef(null);

  useEffect(()=>{
    const u1=fbLsn('messages',d=>setMessages(d.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0))));
    const u2=fbLsn('presence',setPresence2);
    const u3=fbLsn('members',setMembers);
    return()=>{u1();u2();u3();};
  },[]);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const send=()=>{
    if(!input.trim()||!perms.chat_write)return;
    fbAdd('messages',{userId:currentUser.id,pseudo:currentUser.pseudo,content:input.trim(),time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),avatar:currentUser.avatar,color:currentUser.avatarColor});
    setInput('');
  };

  const onlineCount=presence.filter(p=>p.online).length;
  if(!perms.chat_read)return<AccessDenied/>;

  return(
    <div className="pe" style={{height:'calc(100vh - var(--th) - 40px)',display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,display:'flex',minHeight:0,background:'var(--bgc)',border:'1px solid var(--bdr)',borderRadius:'var(--rl)',overflow:'hidden'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          <div style={{padding:'9px 14px',borderBottom:'1px solid var(--bdr)',background:'var(--bg3)',display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:'var(--red)',display:'inline-block'}}></span>
            <span style={{fontSize:12,fontWeight:700}}># canal général</span>
            <span style={{marginLeft:'auto',fontSize:10,fontFamily:'var(--fc)',color:'var(--green)'}}>{onlineCount} en ligne</span>
          </div>
          <div style={{flex:1,overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:7}}>
            {messages.length===0&&<div style={{textAlign:'center',color:'var(--txtm)',fontSize:12,padding:'20px 0'}}>Aucun message</div>}
            {messages.map(m=>(
              <div key={m.id} className={`cmsg ${m.userId===currentUser.id?'mine':'theirs'}`}>
                <div className="cbub">{m.content}</div>
                <div className="cmeta">{m.pseudo} • {m.time}</div>
              </div>
            ))}
            <div ref={endRef}/>
          </div>
          <div style={{padding:'10px 14px',borderTop:'1px solid var(--bdr)',background:'var(--bgc)'}}>
            {perms.chat_write
              ?<div style={{display:'flex',gap:7}}><input className="inp" style={{fontSize:12}} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Message..."/><button style={{background:'var(--acc)',color:'#0e0e10',border:'none',padding:'7px 13px',borderRadius:'var(--r)',fontSize:12,cursor:'pointer',fontWeight:600}} onClick={send}>Envoyer</button></div>
              :<div style={{textAlign:'center',fontSize:11,fontFamily:'var(--fc)',color:'var(--txtm)',padding:'6px'}}>Écriture désactivée pour votre grade</div>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ANNOUNCEMENTS ───────────────────────────────────────────────────────────
function Announcements({currentUser,perms}){
  const [anns,setAnns]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [editA,setEditA]=useState(null);
  const [form,setForm]=useState({title:'',content:'',priority:'medium'});

  useEffect(()=>{return fbLsn('announcements',d=>setAnns(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));},[]);

  if(!perms.announcements_view)return<AccessDenied/>;

  const addAnn=async()=>{
    if(!form.title||!form.content)return;
    await fbAdd('announcements',{...form,author:currentUser.pseudo,date:fmtDate()});
    pushLog('modification',`Annonce: "${form.title}" par ${currentUser.pseudo}`,'info');
    setShowAdd(false);setForm({title:'',content:'',priority:'medium'});

  const saveEdit=async()=>{
    if(!editA)return;const{id,createdAt,...d}=editA;
    await fbSet('announcements',id,d);setEditA(null);
  };
  const del=async id=>{await fbDel('announcements',id);pushLog('suppression',`Annonce supprimée par ${currentUser.pseudo}`,'warn');};

    <div className="pe">
      {perms.announcements_post&&<div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}><button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}>+ Nouvelle annonce</button></div>}
      {anns.length===0&&<div style={{textAlign:'center',color:'var(--txtm)',fontSize:12,fontFamily:'var(--fc)',padding:'40px 0'}}>Aucune annonce</div>}
      {anns.map(a=>(
        <div className={`ann ${a.priority}`} key={a.id}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--txt)'}}>{a.title}</div>
            <div style={{display:'flex',gap:5,flexShrink:0}}>
              <span className={`bdg ${a.priority==='high'?'bdg-r':a.priority==='medium'?'bdg-gd':'bdg-gr'}`}>{a.priority==='high'?'URGENT':a.priority==='medium'?'IMPORTANT':'INFO'}</span>
              {(currentUser.grade==='Heritier'||a.author===currentUser.pseudo)&&<><button className="btn btn-s btn-sm" onClick={()=>setEditA({...a})}>✏</button><button className="btn btn-d btn-sm" onClick={()=>del(a.id)}>🗑</button></>}
            </div>
          </div>
          <div style={{fontSize:11,color:'var(--txt2)',lineHeight:1.6,marginTop:6}}>{a.content}</div>
          <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',marginTop:6,display:'flex',gap:10}}><span>{a.author}</span><span>{a.date}</span></div>
        </div>
      ))}
      {showAdd&&<Modal title="Nouvelle Annonce" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addAnn}>Publier</button></>}>
        <div className="fg"><label className="lbl">TITRE</label><input className="inp" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></div>
        <div className="fg"><label className="lbl">PRIORITÉ</label><select className="sel" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option></select></div>
        <div className="fg"><label className="lbl">CONTENU</label><textarea className="inp" rows={5} value={form.content} onChange={e=>setForm({...form,content:e.target.value})} style={{resize:'none'}}/></div>
      </Modal>}
      {editA&&<Modal title="Modifier" onClose={()=>setEditA(null)} footer={<><button className="btn btn-s" onClick={()=>setEditA(null)}>Annuler</button><button className="btn btn-p" onClick={saveEdit}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">TITRE</label><input className="inp" value={editA.title} onChange={e=>setEditA({...editA,title:e.target.value})}/></div>
        <div className="fg"><label className="lbl">PRIORITÉ</label><select className="sel" value={editA.priority} onChange={e=>setEditA({...editA,priority:e.target.value})}><option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option></select></div>
        <div className="fg"><label className="lbl">CONTENU</label><textarea className="inp" rows={5} value={editA.content} onChange={e=>setEditA({...editA,content:e.target.value})} style={{resize:'none'}}/></div>
      </Modal>}
    </div>
  );
}

// ─── LOGS ────────────────────────────────────────────────────────────────────
