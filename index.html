function Storage({currentUser,perms}){
  const[warehouses,setWarehouses]=useState([]);
  const[items,setItems]=useState([]);
  const[fourItems,setFourItems]=useState([]);
  const[selWh,setSelWh]=useState(null);
  const[showWh,setShowWh]=useState(false);
  const[showItem,setShowItem]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[editWh,setEditWh]=useState(null);
  const[whForm,setWhForm]=useState({name:'',zone:'',capacity:50});
  const[itemForm,setItemForm]=useState({name:'',category:'Matériel',qty:1,warehouseId:'',note:'',imageUrl:''});
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const[itemsDb,setItemsDb]=useState([]);

  useEffect(()=>{
    const u1=fbLsn('warehouses',setWarehouses);
    const u2=fbLsn('storage_items',setItems);
    const u3=fbLsn('four_items',setFourItems);
    const u4=fbLsn('items_db',setItemsDb);
    return()=>{u1();u2();u3();u4();};
  },[]);

  if(!perms.storage_view)return<AccessDenied/>;

  const addWh=async()=>{
    if(!whForm.name)return;
    const cols=['#c0392b','#c9a84c','#00d084','#60a5fa','#a78bfa'];
    await fbAdd('warehouses',{name:whForm.name,zone:whForm.zone,capacity:Number(whForm.capacity)||50,color:cols[warehouses.length%cols.length]});
    pushLog('stock',`Entrepôt créé: ${whForm.name}`,'info');
    setShowWh(false);setWhForm({name:'',zone:'',capacity:50});
  };

  const saveEditWh=async()=>{
    if(!editWh)return;
    const{id,...d}=editWh;
    await fbSet('warehouses',id,{name:d.name,zone:d.zone,capacity:Number(d.capacity)||50});
    setEditWh(null);
  };

  const delWh=async id=>{
    await fbDel('warehouses',id);
    for(const i of items.filter(x=>x.warehouseId===id))await fbDel('storage_items',i.id);
    if(selWh===id)setSelWh(null);
  };

  const addItem=async()=>{
    if(!itemForm.name||!itemForm.warehouseId)return;
    const addedQty=Number(itemForm.qty)||1;
    await fbAdd('storage_items',{...itemForm,qty:addedQty,addedBy:currentUser.pseudo,date:fmtDate()});
    // Recalcul stock Four = somme storage
    const updatedStorage=[...items,{name:itemForm.name,qty:addedQty,warehouseId:itemForm.warehouseId}];
    await syncFourStock(itemForm.name,fourItems,updatedStorage);
    pushLog('stock',`Objet ajouté: ${addedQty}x ${itemForm.name}`,'info');
    setShowItem(false);setItemForm({name:'',category:'Matériel',qty:1,warehouseId:'',note:'',imageUrl:''});
  };

  const saveEditItem=async()=>{
    if(!editItem)return;
    const{id,...d}=editItem;
    const newQty=Number(d.qty)||0;
    await fbSet('storage_items',id,{name:d.name,category:d.category,qty:newQty,note:d.note||'',imageUrl:d.imageUrl||''});
    // Recalcul stock Four = somme storage mise à jour
    const updatedStorage=items.map(i=>i.id===id?{...i,qty:newQty,name:d.name}:i);
    await syncFourStock(d.name,fourItems,updatedStorage);
    setEditItem(null);
  };

  const delItem=async id=>{
    const item=items.find(i=>i.id===id);
    await fbDel('storage_items',id);
    // Recalcul stock Four = somme storage sans l'item supprimé
    if(item){
      const updatedStorage=items.filter(i=>i.id!==id);
      await syncFourStock(item.name,fourItems,updatedStorage);
    }
  };

  const whUsage=id=>items.filter(i=>i.warehouseId===id).reduce((s,i)=>s+i.qty,0);
  const sortedWarehouses=[...warehouses].sort((a,b)=>a.name.localeCompare(b.name));
  const visible=items.filter(i=>{
    if(selWh&&i.warehouseId!==selWh)return false;
    if(filter!=='all'&&i.category!==filter)return false;
    if(search&&!i.name.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));

  return(
    <div className="pe">
      {/* Stats */}
      <div className="sgrid" style={{marginBottom:14}}>
        <div className="sc g"><div className="sl">Entrepôts</div><div className="sv">{warehouses.length}</div><span className="si">🏭</span></div>
        <div className="sc gd"><div className="sl">Références</div><div className="sv">{items.length}</div><div className="ss">{items.reduce((s,i)=>s+i.qty,0)} unités</div><span className="si">📦</span></div>
        <div className="sc b"><div className="sl">Sélection</div><div className="sv">{selWh?warehouses.find(w=>w.id===selWh)?.name||'—':'Tout'}</div><div className="ss">{visible.length} objets</div><span className="si">🎯</span></div>
      </div>

      {/* Warehouse TABS */}
      <div style={{marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.1em',color:'var(--txt)',textTransform:'uppercase'}}>🏭 Entrepôts</div>
          {perms.storage_warehouse&&<button className="btn btn-p btn-sm" onClick={()=>setShowWh(true)}>+ Ajouter</button>}
        </div>
        {(()=>{
          const total=sortedWarehouses.length+1; // +1 for "all" tab
          const cols=total<=3?total:total<=6?Math.ceil(total/2)*2:total<=12?Math.ceil(total/3)*3:Math.ceil(total/4)*4;
          const minW=total<=4?160:total<=8?130:total<=12?110:90;
          return(
            <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(total,total<=4?total:total<=8?4:total<=12?6:8)},1fr)`,gap:8}}>
              {/* ALL tab */}
              <div onClick={()=>setSelWh(null)} style={{cursor:'pointer',background:selWh===null?'var(--accf)':'var(--bgc)',border:`2px solid ${selWh===null?'var(--acc)':'var(--bdr)'}`,borderRadius:10,padding:total<=6?'14px 16px':'10px 12px',transition:'var(--tr)',position:'relative',overflow:'hidden',minWidth:0}}>
                <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:selWh===null?'var(--acc)':'var(--bdrb)',transition:'var(--tr)'}}></div>
                {total<=6&&<div style={{fontSize:18,marginBottom:4}}>🏭</div>}
                <div style={{fontSize:total<=6?13:11,fontWeight:700,color:'var(--txt)',marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Tout</div>
                <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{items.length} obj • {items.reduce((s,i)=>s+i.qty,0)} un.</div>
              </div>
              {sortedWarehouses.map(w=>{
                const usage=whUsage(w.id);
                const pct=Math.min(100,Math.round(usage/(w.capacity||50)*100));
                const isActive=selWh===w.id;
                const compact=total>6;
                return(
                  <div key={w.id} onClick={()=>setSelWh(isActive?null:w.id)}
                    style={{cursor:'pointer',background:isActive?'var(--accf)':'var(--bgc)',border:`2px solid ${isActive?w.color:'var(--bdr)'}`,borderRadius:10,padding:compact?'10px 12px':'14px 16px',transition:'var(--tr)',position:'relative',overflow:'hidden',minWidth:0}}>
                    <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:w.color,opacity:isActive?1:0.5,transition:'var(--tr)'}}></div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:compact?3:6}}>
                      <div style={{width:8,height:8,borderRadius:'50%',background:w.color,marginTop:2,flexShrink:0}}></div>
                      {!compact&&<div style={{display:'flex',gap:3}} onClick={e=>e.stopPropagation()}>
                        {perms.storage_warehouse&&<button className="btn btn-s btn-sm" style={{padding:'2px 6px',fontSize:10}} onClick={()=>setEditWh({...w})}>✏</button>}
                        {perms.storage_warehouse&&<button className="btn btn-d btn-sm" style={{padding:'2px 6px',fontSize:10}} onClick={()=>delWh(w.id)}>🗑</button>}
                      </div>}
                      {compact&&<div style={{display:'flex',gap:2}} onClick={e=>e.stopPropagation()}>
                        {perms.storage_manage&&<button className="btn btn-s btn-sm" style={{padding:'1px 4px',fontSize:9}} onClick={()=>setEditWh({...w})}>✏</button>}
                      </div>}
                    </div>
                    <div style={{fontSize:compact?11:13,fontWeight:700,color:'var(--txt)',marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{w.name}</div>
                    {!compact&&<div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',marginBottom:6}}>{w.zone||'Sans zone'}</div>}
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{fontSize:9,fontFamily:'var(--fc)',color:w.color,fontWeight:700}}>{usage}<span style={{color:'var(--txtm)',fontWeight:400}}>/{w.capacity}</span></span>
                      <span style={{fontSize:8,fontFamily:'var(--fc)',color:'var(--txtm)'}}>{pct}%</span>
                    </div>
                    <div style={{height:3,background:'var(--bg3)',borderRadius:2,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${pct}%`,background:w.color,borderRadius:2,transition:'width .4s ease'}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </div>

      {/* Inventaire — full width big list */}
      <div className="card">
        <div className="ch">
          <span className="ct">📦 Inventaire{selWh?' — '+warehouses.find(w=>w.id===selWh)?.name:''}</span>
          <span className="csub">{visible.length} objet{visible.length!==1?'s':''}</span>
          {perms.storage_add&&<button className="btn btn-p btn-sm" style={{marginLeft:8}} onClick={()=>setShowItem(true)}>+ Ajouter</button>}
        </div>
        {/* Filters + search */}
        <div style={{padding:'8px 14px',borderBottom:'1px solid var(--bdr)',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            {['all',...ITEM_CATS].map(c=>{
              const cc=catColors[c]||'var(--txtm)';
              return(<button key={c} onClick={()=>setFilter(c)}
                style={{padding:'3px 10px',fontSize:10,fontFamily:'var(--fc)',fontWeight:600,borderRadius:'var(--r)',cursor:'pointer',border:`1px solid ${filter===c?cc:'var(--bdr)'}`,background:filter===c?`${cc}22`:'var(--bgc)',color:filter===c?cc:'var(--txt2)',transition:'var(--tr)'}}>
                {c==='all'?'Tout':c}
              </button>);
            })}
          </div>
          <input className="searchbar" style={{marginLeft:'auto',width:220}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher..."/>
        </div>
        {/* Big item list */}
        {visible.length===0
          ?<div style={{padding:32,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucun objet trouvé</div>
          :<div style={{maxHeight:'calc(100vh - 420px)',overflowY:'auto'}}>
            {visible.map(i=>{
              const wh=warehouses.find(w=>w.id===i.warehouseId);
              const icc=catColors[i.category]||'var(--txtm)';
              return(
                <div key={i.id} style={{display:'flex',alignItems:'center',gap:16,padding:'14px 18px',borderBottom:'1px solid var(--bdr)',transition:'var(--tr)',background:'transparent',borderLeft:`3px solid ${icc}`}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--bgch)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  {/* Image */}
                  <div style={{width:54,height:54,borderRadius:10,flexShrink:0,overflow:'hidden',border:`1px solid ${icc}44`,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>
                    {i.imageUrl?<img src={i.imageUrl} alt={i.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:'📦'}
                  </div>
                  {/* Info */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:'var(--txt)',marginBottom:3}}>{i.name}</div>
                    <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                      <span style={{fontSize:9,fontFamily:'var(--fc)',fontWeight:700,color:icc,background:`${icc}18`,border:`1px solid ${icc}44`,borderRadius:3,padding:'1px 6px',textTransform:'uppercase',letterSpacing:'.06em'}}>{i.category}</span>
                      {wh&&<span style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',display:'flex',alignItems:'center',gap:4}}>
                        <span style={{width:7,height:7,borderRadius:'50%',background:wh.color,display:'inline-block'}}></span>
                        {wh.name}
                      </span>}
                      {i.note&&<span style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',fontStyle:'italic'}}>"{i.note}"</span>}
                    </div>
                  </div>
                  {/* Qty big */}
                  <div style={{textAlign:'right',flexShrink:0,minWidth:80}}>
                    <div style={{fontSize:28,fontWeight:800,color:icc,lineHeight:1}}>{i.qty}</div>
                    <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',marginTop:2}}>unité{i.qty!==1?'s':''}</div>
                  </div>
                  {/* Actions */}
                  {(perms.storage_edit||perms.storage_delete)&&<div style={{display:'flex',gap:5,flexShrink:0}}>
                    <button className="btn btn-s btn-sm" onClick={()=>setEditItem({...i})}>✏</button>
                    <button className="btn btn-d btn-sm" onClick={()=>delItem(i.id)}>🗑</button>
                  </div>}
                </div>
              );
            })}
          </div>
        }
      </div>

      {/* Modal add warehouse */}
      {showWh&&<Modal title="Nouvel Entrepôt" onClose={()=>setShowWh(false)} footer={<><button className="btn btn-s" onClick={()=>setShowWh(false)}>Annuler</button><button className="btn btn-p" onClick={addWh}>Créer</button></>}>
        <div className="fg"><label className="lbl">NOM</label><input className="inp" value={whForm.name} onChange={e=>setWhForm({...whForm,name:e.target.value})} autoFocus/></div>
        <div className="fg"><label className="lbl">ZONE</label><input className="inp" value={whForm.zone} onChange={e=>setWhForm({...whForm,zone:e.target.value})} placeholder="La Mesa"/></div>
        <div className="fg"><label className="lbl">CAPACITÉ</label><input type="number" className="inp" value={whForm.capacity} onChange={e=>setWhForm({...whForm,capacity:e.target.value})}/></div>
      </Modal>}

      {/* Modal edit warehouse */}
      {editWh&&<Modal title={`Modifier — ${editWh.name}`} onClose={()=>setEditWh(null)} footer={<><button className="btn btn-s" onClick={()=>setEditWh(null)}>Annuler</button><button className="btn btn-p" onClick={saveEditWh}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">NOM</label><input className="inp" value={editWh.name} onChange={e=>setEditWh({...editWh,name:e.target.value})} autoFocus/></div>
        <div className="fg"><label className="lbl">ZONE</label><input className="inp" value={editWh.zone||''} onChange={e=>setEditWh({...editWh,zone:e.target.value})}/></div>
        <div className="fg"><label className="lbl">CAPACITÉ</label><input type="number" className="inp" value={editWh.capacity} onChange={e=>setEditWh({...editWh,capacity:e.target.value})}/></div>
      </Modal>}

      {/* Modal add item */}
      {showItem&&<Modal title="Ajouter un Objet" onClose={()=>setShowItem(false)} footer={<><button className="btn btn-s" onClick={()=>setShowItem(false)}>Annuler</button><button className="btn btn-p" onClick={addItem}>Enregistrer</button></>} wide>
        <div style={{display:'flex',gap:16}}>
          <div style={{flex:1}}>
            <div className="fg"><label className="lbl">ENTREPÔT</label><select className="sel" value={itemForm.warehouseId} onChange={e=>setItemForm({...itemForm,warehouseId:e.target.value})}><option value="">Sélectionner...</option>{sortedWarehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
            <div className="fg"><label className="lbl">OBJET</label><input className="inp" value={itemForm.name} onChange={e=>{
              const name=e.target.value;
              const match=itemsDb.find(d=>d.name.toLowerCase()===name.toLowerCase());
              if(match){setItemForm({...itemForm,name,category:match.category,imageUrl:match.imageUrl||itemForm.imageUrl});}
              else{setItemForm({...itemForm,name});}
            }} autoFocus/></div>
            {itemForm.name&&itemsDb.find(d=>d.name.toLowerCase()===itemForm.name.toLowerCase())&&(
              <div style={{background:'var(--accf)',border:'1px solid rgba(200,202,212,.2)',borderRadius:'var(--r)',padding:'7px 10px',fontSize:10,fontFamily:'var(--fc)',color:'var(--acc)',marginBottom:10}}>
                ✓ Item trouvé dans la DB — catégorie et image auto-remplies
              </div>
            )}
            <div style={{background:'var(--greenf)',border:'1px solid rgba(0,208,132,.2)',borderRadius:'var(--r)',padding:'7px 10px',fontSize:10,fontFamily:'var(--fc)',color:'var(--green)',marginBottom:10}}>
              💡 Si le nom correspond à un produit du Four, le stock sera synchronisé automatiquement.
            </div>
            <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={itemForm.category} onChange={e=>setItemForm({...itemForm,category:e.target.value})}>{ITEM_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label className="lbl">QUANTITÉ</label><input type="number" className="inp" min="1" value={itemForm.qty} onChange={e=>setItemForm({...itemForm,qty:e.target.value})}/></div>
            <div className="fg"><label className="lbl">NOTE</label><input className="inp" value={itemForm.note} onChange={e=>setItemForm({...itemForm,note:e.target.value})}/></div>
          </div>
          <div style={{width:200}}>
            <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
              {itemForm.imageUrl?<img src={itemForm.imageUrl} alt="icon" style={{width:52,height:52,objectFit:'cover',borderRadius:10,border:'1px solid var(--bdr)'}}/>
                :<div style={{width:52,height:52,borderRadius:10,background:'var(--bg3)',border:'1px dashed var(--bdrb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',textAlign:'center',padding:4}}>Aucune image</div>}
            </div>
            <ItemIconPicker imageUrl={itemForm.imageUrl||''} onChangeImage={u=>setItemForm({...itemForm,imageUrl:u})}/>
          </div>
        </div>
      </Modal>}

      {/* Modal edit item */}
      {editItem&&<Modal title={`Modifier — ${editItem.name}`} onClose={()=>setEditItem(null)} footer={<><button className="btn btn-s" onClick={()=>setEditItem(null)}>Annuler</button><button className="btn btn-p" onClick={saveEditItem}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">NOM</label><input className="inp" value={editItem.name} onChange={e=>setEditItem({...editItem,name:e.target.value})}/></div>
        <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={editItem.category} onChange={e=>setEditItem({...editItem,category:e.target.value})}>{ITEM_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="fg"><label className="lbl">QUANTITÉ</label><input type="number" className="inp" min="0" value={editItem.qty} onChange={e=>setEditItem({...editItem,qty:e.target.value})}/></div>
        <div style={{background:'var(--goldf)',border:'1px solid rgba(201,168,76,.2)',borderRadius:'var(--r)',padding:'7px 10px',fontSize:10,fontFamily:'var(--fc)',color:'var(--gold)',marginBottom:10}}>
          ⚠ Modifier la quantité met à jour le stock du Four si le produit correspond.
        </div>
        <div className="fg"><label className="lbl">NOTE</label><input className="inp" value={editItem.note||''} onChange={e=>setEditItem({...editItem,note:e.target.value})}/></div>
        <div className="fg"><label className="lbl">IMAGE</label><input className="inp" value={editItem.imageUrl||''} onChange={e=>setEditItem({...editItem,imageUrl:e.target.value})} placeholder="https://..."/></div>
      </Modal>}
    </div>
  );
}

// ─── PERMISSIONS ─────────────────────────────────────────────────────────────
function Permissions({currentUser}){
  const[fbPermsData,setFbPermsData]=useState(null);
  const[members,setMembers]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[memberPerms,setMemberPerms]=useState({});
  const[tab,setTab]=useState('grades');
  const[selMember,setSelMember]=useState(null);
  useEffect(()=>{
    const u1=fbLsn('permissions',d=>{const doc=d.find(x=>x.id==='config');if(doc){const{id,createdAt,...p}=doc;setFbPermsData(p);}else setFbPermsData(null);});
    const u2=fbLsn('members',setMembers);
    const u3=fbLsn('accounts',setAccounts);
    const u4=fbLsn('member_perms',d=>{const map={};d.forEach(x=>{const{id,...p}=x;map[id]=p;});setMemberPerms(map);});
    return()=>{u1();u2();u3();u4();};
  },[]);
  if(currentUser.grade!=='Heritier')return<AccessDenied/>;
  const eff={...DEFAULT_PERMS,...(fbPermsData||{}),Heritier:ALL_TRUE};
  const toggleGrade=async(grade,perm)=>{
    if(grade==='Heritier')return;
    const updated={...eff,[grade]:{...eff[grade],[perm]:!eff[grade]?.[perm]}};
    await fbSet('permissions','config',{...updated,Heritier:ALL_TRUE});
    pushLog('modification',`Perm grade "${perm}" pour ${grade} modifiée`,'warn');
  };
  const toggleMember=async(accountId,perm)=>{
    const curr=memberPerms[accountId]||{};
    const acc=accounts.find(a=>a.id===accountId);
    const mem=members.find(m=>m.id===acc?.memberId);
    if(mem?.grade==='Heritier')return;
    const base=eff[mem?.grade||'Collaborateur']||{};
    const currentVal=accountId in memberPerms&&perm in(memberPerms[accountId]||{})?curr[perm]:base[perm];
    await fbSet('member_perms',accountId,{...curr,[perm]:!currentVal});
    pushLog('modification',`Perm individuelle "${perm}" pour ${mem?.pseudo||accountId} modifiée`,'warn');
  };
  const resetMember=async id=>{await fbDel('member_perms',id);};
  const reset=async()=>{await fbSet('permissions','config',{...DEFAULT_PERMS,Heritier:ALL_TRUE});};
  const cats=[...new Set(Object.values(ALL_PERMS).map(p=>p.cat))];
  const getMemberPerm=(accountId,perm)=>{
    const acc=accounts.find(a=>a.id===accountId);
    const mem=members.find(m=>m.id===acc?.memberId);
    if(mem?.grade==='Heritier')return true;
    const base=eff[mem?.grade||'Collaborateur']?.[perm]||false;
    const ov=memberPerms[accountId];
    if(ov&&perm in ov)return ov[perm];
    return base;
  };
  const hasOv=id=>id in memberPerms&&Object.keys(memberPerms[id]).length>0;
  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:5}}>
          <button className={`btn btn-sm ${tab==='grades'?'btn-p':'btn-s'}`} onClick={()=>setTab('grades')}>🛡 Par Grade</button>
          <button className={`btn btn-sm ${tab==='members'?'btn-p':'btn-s'}`} onClick={()=>setTab('members')}>👤 Par Membre</button>
        </div>
        {tab==='grades'&&<button className="btn btn-s btn-sm" style={{marginLeft:'auto'}} onClick={reset}>↺ Réinitialiser défauts</button>}
      </div>
      {tab==='grades'&&(
        <div>
          {/* Grade header legend */}

// ─── ACCOUNT MANAGER ─────────────────────────────────────────────────────────
function AccountManager({currentUser}){
  const[accounts,setAccounts]=useState([]);
  const[members,setMembers]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[showPassFor,setShowPassFor]=useState(null);
  const[form,setForm]=useState({memberId:'',username:'',password:''});
  useEffect(()=>{const u1=fbLsn('accounts',setAccounts);const u2=fbLsn('members',setMembers);return()=>{u1();u2();};},[]);
  if(currentUser.grade!=='Heritier')return<AccessDenied/>;
  const create=async()=>{
    if(!form.memberId||!form.username||!form.password)return;
    if(accounts.find(a=>a.username===form.username)){alert('Identifiant déjà utilisé');return;}
    const id='u'+Date.now();
    await fbSet('accounts',id,{username:form.username,password:form.password,memberId:form.memberId});
    pushLog('connexion',`Nouveau compte: ${form.username} par ${currentUser.pseudo}`,'info');
    setShowAdd(false);setForm({memberId:'',username:'',password:''});
  };
  const del=async id=>{
    if(id===currentUser.accountId){alert('Impossible de supprimer votre propre compte.');return;}
    await fbDel('accounts',id);await fbDel('presence',id);
    pushLog('suppression',`Compte supprimé par ${currentUser.pseudo}`,'danger');
  };
  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <div style={{background:'var(--goldf)',border:'1px solid rgba(201,168,76,.3)',borderRadius:'var(--r)',padding:'7px 12px',fontSize:10,fontFamily:'var(--fc)',color:'var(--gold)',flex:1}}>👑 Seul l'Héritier peut créer des comptes.</div>
        <button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}>+ Créer un compte</button>
      </div>
      <div className="card">
        <table className="dt"><thead><tr><th>IDENTIFIANT</th><th>MEMBRE LIÉ</th><th>MOT DE PASSE</th><th>ACTION</th></tr></thead>
        <tbody>
          {accounts.map(a=>{
            const m=members.find(x=>x.id===a.memberId);
            return(
              <tr key={a.id}>
                <td style={{color:'var(--txt)',fontWeight:600,fontFamily:'var(--fc)'}}>{a.username}</td>
                <td>{m?<span className={gradeClass(m.grade)} style={{fontWeight:600}}>{m.pseudo} — {m.grade}</span>:<span style={{color:'#e87060'}}>Introuvable</span>}</td>
                <td><div style={{display:'flex',alignItems:'center',gap:7}}><span style={{fontFamily:'var(--fc)',fontSize:12}}>{showPassFor===a.id?a.password:'••••••••'}</span><button className="btn btn-s btn-sm" onClick={()=>setShowPassFor(showPassFor===a.id?null:a.id)}>{showPassFor===a.id?'🙈':'👁'}</button></div></td>
                <td>{a.id!==currentUser.accountId?<button className="btn btn-d btn-sm" onClick={()=>del(a.id)}>🗑</button>:<span style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>Vous</span>}</td>
              </tr>
            );
          })}
        </tbody></table>
      </div>
      {showAdd&&<Modal title="Créer un Compte" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={create}>Créer</button></>}>
        <div className="fg"><label className="lbl">MEMBRE</label><select className="sel" value={form.memberId} onChange={e=>setForm({...form,memberId:e.target.value})}><option value="">Sélectionner...</option>{members.map(m=><option key={m.id} value={m.id} disabled={!!accounts.find(a=>a.memberId===m.id)}>{m.pseudo} — {m.grade}{accounts.find(a=>a.memberId===m.id)?' (existant)':''}</option>)}</select></div>
        <div className="fg"><label className="lbl">IDENTIFIANT</label><input className="inp" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} autoComplete="off"/></div>
        <div className="fg"><label className="lbl">MOT DE PASSE</label><input type="text" className="inp" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} autoComplete="off"/></div>
      </Modal>}
    </div>
  );
}

// ─── PROFILE ─────────────────────────────────────────────────────────────────
function Profile({currentUser,setCurrentUser}){
  const[accounts,setAccounts]=useState([]);
  const[pseudo,setPseudo]=useState(currentUser.pseudo);
  const[oldPwd,setOldPwd]=useState('');
  const[newPwd,setNewPwd]=useState('');
  const[newPwd2,setNewPwd2]=useState('');
  const[discord,setDiscord]=useState(currentUser.discordUsername||'');
  const[avatar,setAvatar]=useState(currentUser.avatar||'👤');
  const[avatarColor,setAvatarColor]=useState(currentUser.avatarColor||gradeColor(currentUser.grade));
  const[avatarImage,setAvatarImage]=useState(currentUser.avatarImage||'');
  const[imgUrl,setImgUrl]=useState(currentUser.avatarImage||'');
  const[dragging,setDragging]=useState(false);
  const[msg,setMsg]=useState('');
  const[err,setErr]=useState('');
  useEffect(()=>{return fbLsn('accounts',setAccounts);},[]);
  const myAccount=accounts.find(a=>a.id===currentUser.accountId);
  const notify=(m,isErr)=>{if(isErr)setErr(m);else setMsg(m);setTimeout(()=>{setMsg('');setErr('');},3000);};
  const applyImage=url=>{setAvatarImage(url);setImgUrl(url);};
  const handleDrop=e=>{
    e.preventDefault();setDragging(false);
    const url=e.dataTransfer.getData('text/plain')||e.dataTransfer.getData('text/uri-list');
    if(url)applyImage(url.trim());
  };
  const saveProfile=async()=>{
    if(!pseudo.trim()){notify('Le pseudo ne peut pas être vide',true);return;}
    const updated={...currentUser,pseudo,avatar,avatarColor,avatarImage:avatarImage||'',discordUsername:discord};
    await fbSet('members',currentUser.id,{pseudo,avatar,avatarColor,avatarImage:avatarImage||'',discordUsername:discord});
    saveSession(updated);setCurrentUser(updated);
    notify('✓ Profil sauvegardé');
  };
  const changePwd=async()=>{
    if(!myAccount){notify('Compte introuvable',true);return;}
    if(myAccount.password!==oldPwd){notify('Mot de passe actuel incorrect',true);return;}
    if(newPwd.length<4){notify('Nouveau mot de passe trop court',true);return;}
    if(newPwd!==newPwd2){notify('Les mots de passe ne correspondent pas',true);return;}
    await fbSet('accounts',currentUser.accountId,{password:newPwd});
    pushLog('modification',`${currentUser.pseudo} a changé son mot de passe`,'info');
    setOldPwd('');setNewPwd('');setNewPwd2('');
    notify('✓ Mot de passe modifié');
  };
  return(
    <div className="pe">
      <div className="profile-card">
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:24}}>
          {avatarImage?<img src={avatarImage} alt="avatar" style={{width:70,height:70,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--bdrb)'}} onError={()=>setAvatarImage('')}/>
            :<div className="avatar-big" style={{background:avatarColor,fontSize:30,width:70,height:70}}>{avatar}</div>}
          <div>
            <div style={{fontSize:16,fontWeight:800,color:'var(--txt)'}}>{currentUser.pseudo}</div>
            <span className={gradeClass(currentUser.grade)} style={{fontSize:12,fontFamily:'var(--fc)'}}>{currentUser.grade}</span>
          </div>
        </div>
        <div style={{borderBottom:'1px solid var(--bdr)',marginBottom:18,paddingBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--txt)',marginBottom:12}}>PHOTO DE PROFIL</div>
          <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop}
            style={{border:`2px dashed ${dragging?'var(--acc)':'var(--bdrb)'}`,borderRadius:'var(--r)',padding:16,textAlign:'center',marginBottom:10,background:dragging?'var(--accf)':'var(--bg3)',transition:'var(--tr)',cursor:'default'}}>
            {avatarImage?<img src={avatarImage} alt="preview" style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--bdrb)'}} onError={()=>applyImage('')}/>
              :<div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>Glisser une image ici</div>}
          </div>
          <div className="fg">
            <label className="lbl">LIEN IMAGE</label>
            <div style={{display:'flex',gap:6}}>
              <input className="inp" value={imgUrl} onChange={e=>setImgUrl(e.target.value)} placeholder="https://...image.png"/>
              <button className="btn btn-s btn-sm" onClick={()=>applyImage(imgUrl)}>OK</button>
            </div>
          </div>
          {avatarImage&&<button className="btn btn-d btn-sm" style={{fontSize:10,marginBottom:8}} onClick={()=>applyImage('')}>✕ Retirer</button>}
          <AvatarPicker emoji={avatar} color={avatarColor} onChangeEmoji={setAvatar} onChangeColor={setAvatarColor}/>
        </div>
        <div style={{borderBottom:'1px solid var(--bdr)',marginBottom:18,paddingBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--txt)',marginBottom:12}}>INFORMATIONS</div>
          <div className="fg"><label className="lbl">PSEUDO RP</label><input className="inp" value={pseudo} onChange={e=>setPseudo(e.target.value)}/></div>
          <div className="fg"><label className="lbl">DISCORD</label><input className="inp" value={discord} onChange={e=>setDiscord(e.target.value)} placeholder="Ex: shadow#1234"/></div>
          <button className="btn btn-p" onClick={saveProfile}>💾 Sauvegarder</button>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--txt)',marginBottom:12}}>CHANGER LE MOT DE PASSE</div>
          <div className="fg"><label className="lbl">ACTUEL</label><input type="password" className="inp" value={oldPwd} onChange={e=>setOldPwd(e.target.value)}/></div>
          <div className="fg"><label className="lbl">NOUVEAU</label><input type="password" className="inp" value={newPwd} onChange={e=>setNewPwd(e.target.value)}/></div>
          <div className="fg"><label className="lbl">CONFIRMER</label><input type="password" className="inp" value={newPwd2} onChange={e=>setNewPwd2(e.target.value)}/></div>
          <button className="btn btn-s" onClick={changePwd}>🔒 Changer</button>
        </div>
        {msg&&<div style={{marginTop:14,background:'var(--greenf)',border:'1px solid rgba(0,208,132,.3)',borderRadius:'var(--r)',padding:'8px 12px',fontSize:11,color:'var(--green)',fontFamily:'var(--fc)'}}>{msg}</div>}
        {err&&<div style={{marginTop:14,background:'var(--redf)',border:'1px solid rgba(192,57,43,.3)',borderRadius:'var(--r)',padding:'8px 12px',fontSize:11,color:'#e87060',fontFamily:'var(--fc)'}}>{err}</div>}
      </div>
    </div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[username,setUsername]=useState('');
  const[password,setPassword]=useState('');
  const[error,setError]=useState('');
  const[loading,setLoading]=useState(false);
  const login=async()=>{
    setLoading(true);setError('');
    try{
      const{collection,getDocs}=window.fsLib;
      const[accSnap,memSnap]=await Promise.all([getDocs(collection(window.db,'accounts')),getDocs(collection(window.db,'members'))]);
      const accounts=accSnap.docs.map(d=>({id:d.id,...d.data()}));
      const members=memSnap.docs.map(d=>({id:d.id,...d.data()}));
      const account=accounts.find(a=>a.username===username&&a.password===password);
      if(account){
        const member=members.find(m=>m.id===account.memberId);
        if(member){
          await setPresenceF(account.id,member.id,true);
          try{const wsnap=await window.fsLib.getDoc?.(window.fsLib.doc?.(window.db,'settings','webhooks'));if(wsnap?.exists())window._setWebhooks(wsnap.data());}catch(e){}
          pushLog('connexion',`${member.pseudo} connecté`,'info','connexions');
          onLogin({...member,accountId:account.id});
        }else{setError('Membre introuvable.');}
      }else{setError('Identifiants incorrects.');}
    }catch(e){setError('Erreur de connexion.');console.error(e);}
    setLoading(false);
  };
  return(
    <div className="ls">
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at 20% 20%,rgba(192,57,43,.04) 0%,transparent 60%)'}}></div>
      <div style={{position:'absolute',top:0,left:0,right:0,height:2,background:'linear-gradient(to right,transparent,var(--red),transparent)'}}></div>
      <div className="lc">
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:48,height:48,margin:'0 auto 10px',background:'var(--acc)',clipPath:'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,fontWeight:800,color:'#0e0e10',fontFamily:'var(--fc)'}}>V</div>
          <div style={{fontSize:19,fontWeight:800,letterSpacing:'.12em'}}>VMF</div>
          <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',letterSpacing:'.18em',marginTop:3}}>RÉSEAU PRIVÉ // v5.1.0</div>
        </div>
        <div style={{background:'var(--accf)',border:'1px solid rgba(200,202,212,.2)',borderRadius:'var(--r)',padding:'9px 11px',fontSize:10,fontFamily:'var(--fc)',color:'var(--acc)',marginBottom:16,display:'flex',alignItems:'center',gap:7}}>
          <span>⚠</span><span>ACCÈS RÉSERVÉ — Toute tentative sera enregistrée.</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div><label className="lbl">IDENTIFIANT</label><input className="inp" placeholder="Identifiant" value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} autoComplete="off"/></div>
          <div><label className="lbl">MOT DE PASSE</label><input className="inp" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} autoComplete="off"/></div>
          <div style={{fontSize:11,fontFamily:'var(--fc)',color:'#e87060',textAlign:'center',minHeight:15}}>{error}</div>
          <button className="lbtn" onClick={login} disabled={loading}>{loading?'█ AUTHENTIFICATION...':'→ ACCÉDER AU RÉSEAU'}</button>
        </div>
        <div style={{textAlign:'center',marginTop:16,fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
          <span className="sdot"></span>COMPTES GÉRÉS PAR L'HÉRITIER
        </div>
      </div>
    </div>
  );
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
const PAGE_NAMES={dashboard:'Dashboard',members:'Membres',weapons:'Armes',debts:'Dettes',vehicles:'Véhicules',chat:'Messagerie',map:'Carte',announcements:'Annonces',logs:'Logs',permissions:'Permissions',accounts:'Comptes',storage:'Stockage',four:'Four — Économie',webhooks:'Webhooks Discord',profile:'Mon Profil',flappy:'🐦 Flappy VMF'};


// ─── ITEMS DB ─────────────────────────────────────────────────────────────────
function ItemsDB({currentUser,perms}){
  const[items,setItems]=useState([]);
  const[search,setSearch]=useState('');
  const[filterCat,setFilterCat]=useState('all');
  const[showAdd,setShowAdd]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[form,setForm]=useState({name:'',category:'Drogue',imageUrl:''});
  const canManage=perms.items_manage||currentUser.grade==='Heritier'||currentUser.grade==='Regent';

  useEffect(()=>{return fbLsn('items_db',setItems);},[]);

  if(!perms.items_view)return<AccessDenied/>;

  const resetForm=()=>setForm({name:'',category:'Drogue',imageUrl:''});

  const addItem=async()=>{
    if(!form.name.trim())return;
    const dup=items.find(i=>i.name.toLowerCase()===form.name.trim().toLowerCase());
    if(dup){alert('Un item avec ce nom existe déjà.');return;}
    await fbAdd('items_db',{name:form.name.trim(),category:form.category,imageUrl:form.imageUrl||''});
    pushLog('items',`Item ajouté à la DB: ${form.name}`,'info');
    setShowAdd(false);resetForm();
  };

  const saveEdit=async()=>{
    if(!editItem||!editItem.name.trim())return;
    await fbSet('items_db',editItem.id,{name:editItem.name.trim(),category:editItem.category,imageUrl:editItem.imageUrl||''});
    pushLog('items',`Item modifié: ${editItem.name}`,'info');
    setEditItem(null);
  };

  const delItem=async(id,name)=>{
    if(!window.confirm(`Supprimer "${name}" de la DB ?`))return;
    await fbDel('items_db',id);
    pushLog('items',`Item supprimé: ${name}`,'warn');
  };

  const visible=items.filter(i=>{
    if(filterCat!=='all'&&i.category!==filterCat)return false;
    if(search&&!i.name.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));

  return(
    <div className="pe">
      {/* Stats */}
      <div className="sgrid" style={{marginBottom:14}}>
        <div className="sc b"><div className="sl">Total items</div><div className="sv">{items.length}</div><span className="si">📦</span></div>
        <div className="sc g"><div className="sl">Catégories actives</div><div className="sv">{[...new Set(items.map(i=>i.category))].length}</div><span className="si">🏷</span></div>
        <div className="sc gd"><div className="sl">Avec image</div><div className="sv">{items.filter(i=>i.imageUrl).length}</div><span className="si">🖼</span></div>
      </div>

      <div className="card">
        <div className="ch">
          <span className="ct">📦 Base de données Items</span>
          <span className="csub">{visible.length}/{items.length}</span>
          {canManage&&<button className="btn btn-p btn-sm" style={{marginLeft:8}} onClick={()=>{resetForm();setShowAdd(true);}}>+ Ajouter</button>}
        </div>
        {/* Filtres */}
        <div style={{padding:'8px 14px',borderBottom:'1px solid var(--bdr)',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <button onClick={()=>setFilterCat('all')} style={{padding:'3px 10px',fontSize:10,fontFamily:'var(--fc)',fontWeight:600,borderRadius:'var(--r)',cursor:'pointer',border:`1px solid ${filterCat==='all'?'var(--acc)':'var(--bdr)'}`,background:filterCat==='all'?'var(--accf)':'var(--bgc)',color:filterCat==='all'?'var(--acc)':'var(--txt2)',transition:'var(--tr)'}}>Tout</button>
          {ITEM_CATS.map(c=>{const cc=catColors[c]||'var(--txtm)';return(<button key={c} onClick={()=>setFilterCat(c)} style={{padding:'3px 10px',fontSize:10,fontFamily:'var(--fc)',fontWeight:600,borderRadius:'var(--r)',cursor:'pointer',border:`1px solid ${filterCat===c?cc:'var(--bdr)'}`,background:filterCat===c?`${cc}22`:'var(--bgc)',color:filterCat===c?cc:'var(--txt2)',transition:'var(--tr)'}}>{c}</button>);})}
          <input className="searchbar" style={{marginLeft:'auto',width:220}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher..."/>
        </div>

        {/* Grille */}
        {visible.length===0
          ?<div style={{padding:40,textAlign:'center',color:'var(--txtm)',fontSize:12,fontFamily:'var(--fc)'}}>Aucun item — {canManage?'cliquez sur + Ajouter pour commencer':'aucun item enregistré'}</div>
          :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10,padding:14}}>
            {visible.map(item=>{
              const cc=catColors[item.category]||'var(--txtm)';
              return(
                <div key={item.id} style={{background:'var(--bgc)',border:'1px solid var(--bdr)',borderRadius:10,overflow:'hidden',transition:'var(--tr)',cursor:'default'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=cc;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bdr)';}}>
                  <div style={{height:3,background:cc}}/>
                  <div style={{height:90,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
                    {item.imageUrl
                      ?<img src={item.imageUrl} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                      :<div style={{fontSize:30}}>📦</div>}
                  </div>
                  <div style={{padding:'8px 10px'}}>
                    <div style={{fontSize:12,fontWeight:700,color:'var(--txt)',marginBottom:4,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={item.name}>{item.name}</div>
                    <span style={{fontSize:9,fontFamily:'var(--fc)',fontWeight:700,color:cc,background:`${cc}18`,border:`1px solid ${cc}44`,borderRadius:3,padding:'1px 6px',textTransform:'uppercase',letterSpacing:'.06em'}}>{item.category}</span>
                  </div>
                  {canManage&&<div style={{padding:'0 10px 8px',display:'flex',gap:4}}>
                    <button className="btn btn-s btn-sm" style={{flex:1,fontSize:10}} onClick={()=>setEditItem({...item})}>✏</button>
                    <button className="btn btn-d btn-sm" style={{fontSize:10}} onClick={()=>delItem(item.id,item.name)}>🗑</button>
                  </div>}
                </div>
              );
            })}
          </div>
        }
      </div>

      {/* Modal ajouter */}
      {showAdd&&<Modal title="Nouvel Item" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addItem}>Enregistrer</button></>}>
        <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
          <div style={{width:80,flexShrink:0}}>
            <div style={{height:80,background:'var(--bg3)',border:'1px dashed var(--bdrb)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',marginBottom:6}}>
              {form.imageUrl?<img src={form.imageUrl} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<div style={{fontSize:26}}>📦</div>}
            </div>
          </div>
          <div style={{flex:1}}>
            <div className="fg"><label className="lbl">NOM *</label><input className="inp" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus placeholder="ex: Methamphetamine"/></div>
            <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>{ITEM_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label className="lbl">IMAGE URL</label><input className="inp" value={form.imageUrl} onChange={e=>setForm({...form,imageUrl:e.target.value})} placeholder="https://..."/></div>
          </div>
        </div>
      </Modal>}

      {/* Modal modifier */}
      {editItem&&<Modal title={`Modifier — ${editItem.name}`} onClose={()=>setEditItem(null)} footer={<><button className="btn btn-s" onClick={()=>setEditItem(null)}>Annuler</button><button className="btn btn-p" onClick={saveEdit}>Sauvegarder</button></>}>
        <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
          <div style={{width:80,flexShrink:0}}>
            <div style={{height:80,background:'var(--bg3)',border:'1px dashed var(--bdrb)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',marginBottom:6}}>
              {editItem.imageUrl?<img src={editItem.imageUrl} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<div style={{fontSize:26}}>📦</div>}
            </div>
          </div>
          <div style={{flex:1}}>
            <div className="fg"><label className="lbl">NOM</label><input className="inp" value={editItem.name} onChange={e=>setEditItem({...editItem,name:e.target.value})} autoFocus/></div>
            <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={editItem.category} onChange={e=>setEditItem({...editItem,category:e.target.value})}>{ITEM_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label className="lbl">IMAGE URL</label><input className="inp" value={editItem.imageUrl||''} onChange={e=>setEditItem({...editItem,imageUrl:e.target.value})} placeholder="https://..."/></div>
          </div>
        </div>
      </Modal>}
    </div>
  );
}


const NAV_BASE=[
  {section:'Général',items:[
    {id:'dashboard',ic:'⬡',label:'Dashboard'},
    {id:'announcements',ic:'📢',label:'Annonces'},
    {id:'chat',ic:'💬',label:'Messagerie'},
    {id:'map',ic:'🗺',label:'Carte'},
  ]},
  {section:'Économie',items:[
    {id:'four',ic:'🍖',label:'Four'},
    {id:'debts',ic:'💰',label:'Dettes'},
  ]},
  {section:'Gestion',items:[
    {id:'members',ic:'👥',label:'Membres'},
    {id:'weapons',ic:'🗡',label:'Armes'},
    {id:'vehicles',ic:'🚗',label:'Véhicules'},
    {id:'storage',ic:'🏭',label:'Stockage'},
    {id:'items',ic:'📦',label:'Items DB'},
  ]},
  {section:'Admin',items:[
    {id:'logs',ic:'📋',label:'Logs'},
    {id:'permissions',ic:'🛡',label:'Permissions'},
    {id:'webhooks',ic:'🔗',label:'Webhooks'},
    {id:'accounts',ic:'🔑',label:'Comptes'},
  ]},
];

// ─── SESSION ─────────────────────────────────────────────────────────────────
const SESSION_KEY='vmf_session';
const SESSION_TTL=8*60*60*1000;
function saveSession(user){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({user,ts:Date.now()}));}catch(e){}}
function loadSession(){
  try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;const{user,ts}=JSON.parse(raw);if(Date.now()-ts>SESSION_TTL){sessionStorage.removeItem(SESSION_KEY);return null;}return user;}catch(e){return null;}
}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const[currentUser,setCurrentUser]=useState(()=>loadSession());
  const[page,setPage]=useState('dashboard');
  const[fbPermsData,setFbPermsData]=useState(null);
  const[memberPermsData,setMemberPermsData]=useState({});
  useEffect(()=>{
    if(!currentUser)return;
    const u1=fbLsn('permissions',d=>{const doc=d.find(x=>x.id==='config');if(doc){const{id,createdAt,...p}=doc;setFbPermsData(p);}else setFbPermsData(null);});
    const u2=fbLsn('member_perms',d=>{const map={};d.forEach(x=>{const{id,...p}=x;map[id]=p;});setMemberPermsData(map);});
    const u3=fbLsnD('settings','webhooks',d=>{if(d){const{id,...rest}=d;window._setWebhooks(rest);}});
    const interval=setInterval(()=>{setPresenceF(currentUser.accountId,currentUser.id,true);},30000);
    const onUnload=()=>{setPresenceF(currentUser.accountId,currentUser.id,false);};
    window.addEventListener('beforeunload',onUnload);
    return()=>{u1();u2();u3();clearInterval(interval);window.removeEventListener('beforeunload',onUnload);};
  },[currentUser]);

  const perms=useMemo(()=>{
    if(!currentUser)return{};
    if(currentUser.grade==='Heritier')return ALL_TRUE;
    const base=fbPermsData||DEFAULT_PERMS;
    const gradePerms=(base[currentUser.grade])||DEFAULT_PERMS[currentUser.grade]||{};
    const overrides=(memberPermsData&&currentUser.accountId)?memberPermsData[currentUser.accountId]||{}:{};
    return{...gradePerms,...overrides};
  },[currentUser?.grade,currentUser?.accountId,fbPermsData,memberPermsData]);

  const logout=async()=>{
    if(currentUser){await setPresenceF(currentUser.accountId,currentUser.id,false);pushLog('connexion',`${currentUser.pseudo} déconnecté`,'info','connexions');}
    clearSession();setCurrentUser(null);
  };

  useEffect(()=>{if(currentUser)saveSession(currentUser);},[currentUser]);

  const grBadge=g=>({Heritier:'bdg-r',Regent:'bdg-gd',Senechaux:'bdg-g',Syndic:'bdg-b',Collaborateur:'bdg-gr'}[g]||'bdg-gr');

  // Nav avec Flappy selon perms
  const nav=useMemo(()=>{
    if(!perms.flappy_access)return NAV_BASE;
    const copy=NAV_BASE.map(s=>({...s,items:[...s.items]}));
    copy[copy.length-1].items.push({id:'flappy',ic:'🐦',label:'Flappy Bird'});
    return copy;
  },[perms]);

  if(!currentUser)return<LoginScreen onLogin={u=>{saveSession(u);setCurrentUser(u);}}/>;

  const renderPage=()=>{
    switch(page){
      case 'dashboard':return<Dashboard currentUser={currentUser}/>;
      case 'members':return<Members currentUser={currentUser} perms={perms}/>;
      case 'weapons':return<Weapons currentUser={currentUser} perms={perms}/>;
      case 'debts':return<Debts currentUser={currentUser} perms={perms}/>;
      case 'vehicles':return<Vehicles currentUser={currentUser} perms={perms}/>;
      case 'chat':return<Chat currentUser={currentUser} perms={perms}/>;
      case 'map':return<MapCanvas perms={perms}/>;
      case 'announcements':return<Announcements currentUser={currentUser} perms={perms}/>;
      case 'logs':return<Logs currentUser={currentUser} perms={perms}/>;
      case 'permissions':return<Permissions currentUser={currentUser}/>;
      case 'accounts':return<AccountManager currentUser={currentUser}/>;
      case 'storage':return<Storage currentUser={currentUser} perms={perms}/>;
      case 'items':return<ItemsDB currentUser={currentUser} perms={perms}/>;
      case 'four':return<Four currentUser={currentUser} perms={perms}/>;
      case 'webhooks':return<Webhooks currentUser={currentUser} perms={perms}/>;
      case 'profile':return<Profile currentUser={currentUser} setCurrentUser={setCurrentUser}/>;
      case 'flappy':return perms.flappy_access?<FlappyBird/>:<AccessDenied/>;
      default:return<Dashboard currentUser={currentUser}/>;
    }
  };

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="slogo">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="logo-icon">V</div>
            <div><div style={{fontSize:15,fontWeight:800,letterSpacing:'.1em',color:'var(--txt)'}}>VMF</div><div style={{fontSize:8,fontFamily:'var(--fc)',color:'var(--txtm)',letterSpacing:'.18em'}}>réseau privé</div></div>
          </div>
        </div>
        <div className="suser" onClick={()=>setPage('profile')} title="Mon profil">
          <div style={{display:'flex',alignItems:'center',gap:7}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:currentUser.avatarColor||gradeColor(currentUser.grade),display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,flexShrink:0,overflow:'hidden'}}>
              {currentUser.avatarImage?<img src={currentUser.avatarImage} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:currentUser.avatar}
            </div>
            <div className="ui" style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{currentUser.pseudo}</div>
              <div className={gradeClass(currentUser.grade)} style={{fontSize:9,fontFamily:'var(--fc)'}}>{currentUser.grade}</div>
            </div>
            <div className="online-dot"></div>
          </div>
        </div>
        <nav className="snav">
          {nav.map(s=>(
            <div key={s.section}>
              <div className="nav-lbl">{s.section}</div>
              {s.items.map(item=>(
                <div key={item.id} className={`nav-it ${page===item.id?'active':''}`} onClick={()=>setPage(item.id)}>
                  <span className="ic">{item.ic}</span>
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
          ))}
        </nav>
        <div className="sfooter">
          <div style={{display:'flex',alignItems:'center',gap:5,fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>
            <span className="sdot"></span><span>SÉCURISÉ</span>
            <button style={{marginLeft:'auto',background:'none',border:'none',color:'#e87060',cursor:'pointer',fontSize:9,fontFamily:'var(--fc)'}} onClick={logout}>⏻ Déco</button>
          </div>
        </div>
      </aside>
      <div className="main">
        <div className="topbar">
          <div>
            <div style={{fontSize:13,fontWeight:700}}>{PAGE_NAMES[page]||page}</div>
            <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>VMF // {PAGE_NAMES[page]||page}</div>
          </div>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
            <div onClick={()=>setPage('profile')} style={{width:28,height:28,borderRadius:'50%',background:currentUser.avatarColor||gradeColor(currentUser.grade),display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,cursor:'pointer',overflow:'hidden'}} title="Mon profil">
              {currentUser.avatarImage?<img src={currentUser.avatarImage} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:currentUser.avatar}
            </div>
            <span style={{fontSize:11,fontFamily:'var(--fc)',color:'var(--txtm)'}}>{currentUser.pseudo}</span>
            <span className={`bdg ${grBadge(currentUser.grade)}`}>{currentUser.grade}</span>
          </div>
        </div>
        <div className="scroll">{renderPage()}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
