import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const fc={apiKey:"AIzaSyDLVsEFu1aubVt6yOAwjFiAceBOQ_t3QXw",authDomain:"vmf-mdt.firebaseapp.com",projectId:"vmf-mdt"};
const app=initializeApp(fc);
const db=getFirestore(app);
window.db=db;
window.fsLib={collection,doc,getDocs,setDoc,addDoc,deleteDoc,onSnapshot,serverTimestamp};
window.fb={
  listen:(col,cb)=>onSnapshot(collection(db,col),snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()})))),
  listenDoc:(col,id,cb)=>onSnapshot(doc(db,col,id),snap=>cb(snap.exists()?{id:snap.id,...snap.data()}:null)),
  add:(col,data)=>addDoc(collection(db,col),{...data,createdAt:serverTimestamp()}),
  set:(col,id,data)=>setDoc(doc(db,col,id),data,{merge:true}),
  delete:(col,id)=>deleteDoc(doc(db,col,id)),
};

// ─── FLAPPY BIRD ─────────────────────────────────────────────────────────────
function FlappyBird(){
  const canvasRef=useRef(null);
  const stateRef=useRef({
    bird:{y:150,vy:0},pipes:[],score:0,best:0,frame:0,status:'idle'
  });
  const rafRef=useRef(null);
  const W=380,H=480,GAP=175,PIPE_W=48,SPEED=1.8,GRAV=0.19,JUMP=-5.5;

  const resetPipes=()=>[
    {x:W+60,top:80+Math.random()*(H-GAP-120)},
    {x:W+60+200,top:80+Math.random()*(H-GAP-120)},
  ];

  const draw=useCallback(()=>{
    const c=canvasRef.current;if(!c)return;
    const ctx=c.getContext('2d');
    const s=stateRef.current;
    // bg
    ctx.fillStyle='#0e0e10';ctx.fillRect(0,0,W,H);
    // ground
    ctx.fillStyle='#1a1a1e';ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle='#2a2a30';ctx.fillRect(0,H-40,W,2);
    // pipes
    s.pipes.forEach(p=>{
      ctx.fillStyle='#00d084';
      ctx.fillRect(p.x,0,PIPE_W,p.top);
      ctx.fillRect(p.x,p.top+GAP,PIPE_W,H-p.top-GAP);
      ctx.fillStyle='#00b874';
      ctx.fillRect(p.x-3,p.top-18,PIPE_W+6,18);
      ctx.fillRect(p.x-3,p.top+GAP,PIPE_W+6,18);
    });
    // bird
    const bx=60,by=s.bird.y;
    ctx.save();ctx.translate(bx+12,by+12);
    ctx.rotate(Math.max(-0.5,Math.min(0.8,s.bird.vy*0.06)));
    ctx.fillStyle='#c9a84c';
    ctx.beginPath();ctx.ellipse(0,0,14,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e87060';
    ctx.beginPath();ctx.ellipse(12,2,6,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-4,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0e0e10';ctx.beginPath();ctx.arc(-1,-4,2.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // score
    ctx.fillStyle='#f0f0f5';ctx.font='bold 22px Syne,sans-serif';ctx.textAlign='center';
    ctx.fillText(s.score,W/2,40);
    // status overlay
    if(s.status==='idle'){
      ctx.fillStyle='rgba(14,14,16,.75)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#c8cad4';ctx.font='bold 28px Syne,sans-serif';ctx.textAlign='center';
      ctx.fillText('FLAPPY VMF',W/2,H/2-40);
      ctx.fillStyle='#9090a0';ctx.font='14px JetBrains Mono,monospace';
      ctx.fillText('Cliquer ou Espace pour jouer',W/2,H/2);
      if(s.best>0){ctx.fillStyle='#c9a84c';ctx.font='13px JetBrains Mono,monospace';ctx.fillText('BEST: '+s.best,W/2,H/2+30);}
    }
    if(s.status==='dead'){
      ctx.fillStyle='rgba(14,14,16,.75)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#e87060';ctx.font='bold 26px Syne,sans-serif';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,H/2-40);
      ctx.fillStyle='#f0f0f5';ctx.font='16px JetBrains Mono,monospace';
      ctx.fillText('Score: '+s.score,W/2,H/2-10);
      ctx.fillStyle='#c9a84c';ctx.fillText('Best: '+s.best,W/2,H/2+16);
      ctx.fillStyle='#9090a0';ctx.font='13px JetBrains Mono,monospace';
      ctx.fillText('Cliquer pour rejouer',W/2,H/2+48);
    }
  },[]);

  const tick=useCallback(()=>{
    const s=stateRef.current;
    if(s.status!=='playing'){draw();return;}
    s.bird.vy+=GRAV;
    s.bird.y+=s.bird.vy;
    s.frame++;
    // move pipes
    s.pipes.forEach(p=>{p.x-=SPEED;});
    // recycle pipe
    s.pipes.forEach(p=>{
      if(p.x+PIPE_W<0){p.x=W+60;p.top=80+Math.random()*(H-GAP-120);}
    });
    // score
    s.pipes.forEach(p=>{
      if(Math.abs(p.x+PIPE_W/2-60)<SPEED+0.5){s.score++;}
    });
    // collision
    const bx=60,by=s.bird.y;
    if(by+20>H-40||by<0){s.status='dead';s.best=Math.max(s.best,s.score);}
    s.pipes.forEach(p=>{
      if(bx+22>p.x&&bx<p.x+PIPE_W){if(by<p.top||by+20>p.top+GAP){s.status='dead';s.best=Math.max(s.best,s.score);}}
    });
    draw();
    rafRef.current=requestAnimationFrame(tick);
  },[draw]);

  useEffect(()=>{
    draw();
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[draw]);

  const action=()=>{
    const s=stateRef.current;
    if(s.status==='idle'||s.status==='dead'){
      s.bird={y:150,vy:0};s.pipes=resetPipes();s.score=0;s.status='playing';
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      rafRef.current=requestAnimationFrame(tick);
    } else if(s.status==='playing'){
      s.bird.vy=JUMP;
    }
  };

  useEffect(()=>{
    const onKey=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();action();}};
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[tick]);

  return(
    <div className="pe" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--acc)',letterSpacing:'.1em'}}>🐦 FLAPPY VMF — Easter Egg</div>
      <canvas ref={canvasRef} width={W} height={H} className="flappy-canvas" onClick={action} style={{maxWidth:'100%'}}/>
      <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>Cliquer sur le canvas ou appuyer sur Espace / ↑ pour sauter</div>
    </div>
  );
}

                  </div>
                  <span className={gradeClass(m.grade)} style={{fontWeight:600}}>{m.pseudo}</span>
                </div></td>
                <td><span className={gradeClass(m.grade)} style={{fontSize:11,fontWeight:600}}>{m.grade}</span></td>
                <td><span style={{fontFamily:'var(--fc)',fontSize:11}}>{m.phone||'—'}</span></td>

// ─── DEBTS ───────────────────────────────────────────────────────────────────
function Debts({currentUser,perms}){
  const[debts,setDebts]=useState([]);
  const[members,setMembers]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[rembModal,setRembModal]=useState(null);
  const[tab,setTab]=useState('non-payé');
  const[form,setForm]=useState({debtor:'',amount:'',reason:'',date:''});
  const[rAmt,setRAmt]=useState('');
  useEffect(()=>{const u1=fbLsn('debts',setDebts);const u2=fbLsn('members',setMembers);return()=>{u1();u2();};},[]);
  if(!perms.debts_view)return<AccessDenied/>;
  const addDebt=async()=>{
    if(!form.debtor||!form.amount)return;
    await fbAdd('debts',{debtor:form.debtor,amount:parseInt(form.amount),reason:form.reason,date:form.date||fmtDate(),status:'non-payé',paid:0});
    pushLog('modification',`Dette: ${form.debtor} ${fmtMoney(parseInt(form.amount))} par ${currentUser.pseudo}`,'warn','dettes');
    setShowAdd(false);setForm({debtor:'',amount:'',reason:'',date:''});
  };
  const addRemb=async()=>{
    const val=parseInt(rAmt);if(!val||val<=0)return;
    const d=debts.find(x=>x.id===rembModal);if(!d)return;
    const np=Math.min(d.paid+val,d.amount);
    await fbSet('debts',d.id,{paid:np,status:np>=d.amount?'payé':np>0?'partiel':'non-payé'});
    pushLog('modification',`Remboursement ${fmtMoney(val)} — ${d.debtor}`,'info','dettes');
    setRAmt('');setRembModal(null);
  };
  const delDebt=async id=>{await fbDel('debts',id);pushLog('suppression','Dette supprimée','danger','dettes');};
  const total=debts.filter(d=>d.status!=='payé').reduce((s,d)=>s+d.amount-d.paid,0);
  const counts={'non-payé':debts.filter(d=>d.status==='non-payé').length,partiel:debts.filter(d=>d.status==='partiel').length,'payé':debts.filter(d=>d.status==='payé').length};
  const filtered=debts.filter(d=>d.status===tab);
  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <div className="sc r" style={{flex:1,padding:11,marginBottom:0}}><div className="sl">Total Dettes</div><div className="sv" style={{fontSize:17}}>{fmtMoney(total)}</div></div>
        <div className="sc g" style={{flex:1,padding:11,marginBottom:0}}><div className="sl">Soldées</div><div className="sv" style={{fontSize:17}}>{counts['payé']}</div></div>
        {perms.debts_manage&&<button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}>+ Créer dette</button>}
      </div>
      <div style={{display:'flex',gap:4,marginBottom:10}}>
        {[{k:'non-payé',l:'Impayées'},{k:'partiel',l:'Partielles'},{k:'payé',l:'Payées'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} className={`btn btn-sm ${tab===t.k?'btn-p':'btn-s'}`}>{t.l} <span style={{fontFamily:'var(--fc)',fontSize:10,opacity:.7}}>({counts[t.k]})</span></button>
        ))}
      </div>
      <div className="card">
        {filtered.length===0?<div style={{padding:36,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucune dette ici</div>:
          <table className="dt"><thead><tr><th>DÉBITEUR</th><th>MONTANT</th><th>RAISON</th><th>DATE</th><th>REMBOURSÉ</th><th>ACTION</th></tr></thead>
          <tbody>
            {filtered.map(d=>(
              <tr key={d.id}>
                <td style={{color:'var(--txt)',fontWeight:600}}>{d.debtor}</td>
                <td style={{fontFamily:'var(--fc)',color:d.status!=='payé'?'#e87060':'var(--green)',fontWeight:700}}>{fmtMoney(d.amount)}</td>
                <td style={{fontSize:11,maxWidth:130,color:'var(--txtm)'}}>{d.reason}</td>
                <td style={{fontSize:11,fontFamily:'var(--fc)'}}>{d.date}</td>
                <td><div style={{fontSize:11,fontFamily:'var(--fc)',marginBottom:3}}>{fmtMoney(d.paid)}/{fmtMoney(d.amount)}</div>
                  <div className="pb" style={{width:90}}><div className="pf" style={{width:`${Math.min(100,Math.round(d.paid/d.amount*100))}%`,background:d.status==='payé'?'var(--green)':d.status==='partiel'?'var(--gold)':'#e87060'}}></div></div>
                </td>
                <td><div style={{display:'flex',gap:4}}>
                  {d.status!=='payé'&&perms.debts_manage&&<button className="btn btn-s btn-sm" onClick={()=>{setRembModal(d.id);setRAmt('');}}>+ Remb.</button>}
                  {perms.debts_delete&&<button className="btn btn-d btn-sm" onClick={()=>delDebt(d.id)}>🗑</button>}
                </div></td>
              </tr>
            ))}
          </tbody></table>
        }
      </div>
      {showAdd&&<Modal title="Créer une Dette" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addDebt}>Créer</button></>}>
        <div className="fg"><label className="lbl">MEMBRE DÉBITEUR</label><select className="sel" value={form.debtor} onChange={e=>setForm({...form,debtor:e.target.value})}><option value="">Sélectionner...</option>{members.map(m=><option key={m.id}>{m.pseudo}</option>)}</select></div>
        <div className="fg"><label className="lbl">MONTANT ($)</label><input type="number" className="inp" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="25000"/></div>
        <div className="fg"><label className="lbl">RAISON</label><input className="inp" value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} placeholder="Livraison..."/></div>
        <div className="fg"><label className="lbl">DATE</label><input type="date" className="inp" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
      </Modal>}
      {rembModal&&(()=>{const d=debts.find(x=>x.id===rembModal);if(!d)return null;return(
        <Modal title="Remboursement" onClose={()=>setRembModal(null)} footer={<><button className="btn btn-s" onClick={()=>setRembModal(null)}>Annuler</button><button className="btn btn-p" onClick={addRemb}>Confirmer</button></>}>
          <div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:12,marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:'var(--txt)',marginBottom:8}}>{d.debtor}</div>
            <div style={{display:'flex',gap:18}}>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>TOTAL DÛ</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(d.amount)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>PAYÉ</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(d.paid)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>RESTE</div><div style={{fontSize:13,fontFamily:'var(--fc)',color:'var(--gold)',fontWeight:700}}>{fmtMoney(d.amount-d.paid)}</div></div>
            </div>
          </div>
          <div className="fg"><label className="lbl">MONTANT REMBOURSÉ ($)</label><input type="number" className="inp" value={rAmt} onChange={e=>setRAmt(e.target.value)} placeholder={`Max: ${fmtMoney(d.amount-d.paid)}`}/></div>
        </Modal>
      );})()}
    </div>
  );
}

// ─── VEHICLES ────────────────────────────────────────────────────────────────
function Vehicles({currentUser,perms}){
  const[vehicles,setVehicles]=useState([]);
  const[members,setMembers]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[selUser,setSelUser]=useState(currentUser.pseudo);
  const[form,setForm]=useState({model:'',plate:'',state:'Parfait'});
  useEffect(()=>{const u1=fbLsn('vehicles',setVehicles);const u2=fbLsn('members',setMembers);return()=>{u1();u2();};},[]);
  if(!perms.vehicles_view)return<AccessDenied/>;
  const sColor=s=>({Parfait:'var(--green)',Bon:'var(--gold)',Endommagé:'#e87060','Saisie probable':'#888'}[s]||'var(--txtm)');
  const addV=async()=>{
    if(!form.model||!form.plate)return;
    await fbAdd('vehicles',{model:form.model,plate:form.plate,state:form.state,lastUsedBy:'',usage:[]});
    pushLog('stock',`Véhicule: ${form.model} par ${currentUser.pseudo}`,'info');
    setShowAdd(false);setForm({model:'',plate:'',state:'Parfait'});
  };
  const claim=async id=>{
    const v=vehicles.find(x=>x.id===id);const d=new Date();const ds=`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
    await fbSet('vehicles',id,{lastUsedBy:selUser,usage:[...(v?.usage||[]),`${selUser} - ${ds}`]});
  };
  const del=async id=>{const v=vehicles.find(x=>x.id===id);await fbDel('vehicles',id);pushLog('suppression',`Véhicule supprimé: ${v?.model}`,'danger');};
  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <label className="lbl" style={{marginBottom:0,whiteSpace:'nowrap'}}>POUR :</label>
        <select className="sel" style={{width:170}} value={selUser} onChange={e=>setSelUser(e.target.value)}>{members.map(m=><option key={m.id}>{m.pseudo}</option>)}</select>
        {perms.vehicles_add&&<button className="btn btn-p btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAdd(true)}>+ Ajouter</button>}
      </div>
      <div className="card">
        {vehicles.length===0?<div style={{padding:36,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucun véhicule</div>:
          <table className="dt"><thead><tr><th>MODÈLE</th><th>PLAQUE</th><th>ÉTAT</th><th>DERNIER USAGE</th><th>ACTION</th></tr></thead>
          <tbody>
            {[...vehicles].sort((a,b)=>a.model.localeCompare(b.model)).map(v=>(
              <tr key={v.id}>
                <td style={{color:'var(--txt)',fontWeight:600}}>{v.model}</td>
                <td><span style={{fontSize:10,background:'var(--bg3)',padding:'2px 6px',borderRadius:3,border:'1px solid var(--bdr)',fontFamily:'var(--fc)'}}>{v.plate}</span></td>
                <td><span style={{fontSize:11,color:sColor(v.state),fontWeight:600}}>{v.state}</span></td>
                <td style={{fontSize:11,color:'var(--txtm)',fontFamily:'var(--fc)'}}>{(v.usage||[]).length>0?v.usage[v.usage.length-1]:'—'}</td>
                <td><div style={{display:'flex',gap:4}}>
                  <button className={`btn btn-sm ${v.lastUsedBy===selUser?'btn-g':'btn-s'}`} onClick={()=>claim(v.id)}>{v.lastUsedBy===selUser?`✓ ${selUser}`:`→ ${selUser}`}</button>
                  {perms.vehicles_delete&&<button className="btn btn-d btn-sm" onClick={()=>del(v.id)}>🗑</button>}
                </div></td>
              </tr>
            ))}
          </tbody></table>
        }
      </div>
      {showAdd&&<Modal title="Ajouter un Véhicule" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addV}>Enregistrer</button></>}>
        <div className="fg"><label className="lbl">MODÈLE</label><input className="inp" value={form.model} onChange={e=>setForm({...form,model:e.target.value})} placeholder="Sultan RS"/></div>
        <div className="fg"><label className="lbl">PLAQUE</label><input className="inp" value={form.plate} onChange={e=>setForm({...form,plate:e.target.value})} placeholder="VMF-01"/></div>
        <div className="fg"><label className="lbl">ÉTAT</label><select className="sel" value={form.state} onChange={e=>setForm({...form,state:e.target.value})}>{['Parfait','Bon','Endommagé','Saisie probable'].map(s=><option key={s}>{s}</option>)}</select></div>
      </Modal>}
    </div>
  );

// ─── FOUR ─────────────────────────────────────────────────────────────────────
const catColors={Drogue:'var(--green)',Arme:'#e87060',Munitions:'#f97316',Matériel:'#60a5fa',Electronique:'#a78bfa',Nourriture:'#84cc16',Alcool:'#f59e0b',Luxe:'var(--gold)',Argent:'var(--gold)',Autre:'var(--txtm)',Objets:'#a78bfa'};

// Étiquette produit four
function Etiquette({item,warehouses,storageItems,perms,onBuy,onSell,onEdit,onDel}){
  const[open,setOpen]=useState(false);
  const margin=item.sellPrice-item.buyPrice;
  const marginPct=item.buyPrice>0?Math.round((margin/item.buyPrice)*100):0;
  const stockColor=(item.stock||0)>0?'var(--txt)':'#e87060';
  // localisation : entrepôts qui ont ce produit
  const locs=[...new Set(storageItems.filter(s=>s.name===item.name&&s.qty>0).map(s=>s.warehouseId))];
  const locNames=locs.map(id=>warehouses.find(w=>w.id===id)?.name||'?').join(', ');
  const cat=catColors[item.category]||'var(--txtm)';
  return(
    <div className="etiquette" style={{borderTop:`3px solid ${cat}`}}>
      {/* Compact row */}
      <div className="etiquette-compact" onClick={()=>setOpen(o=>!o)}>
        {item.imageUrl
          ?<img src={item.imageUrl} alt={item.name} className="etiquette-img" onError={e=>e.target.style.display='none'}/>
          :<div className="etiquette-img-ph">📦</div>
        }
        <div className="etiquette-info">
          <div className="etiquette-name">{item.name}</div>
          <div className="etiquette-cat" style={{color:cat}}>{item.category} · {item.unit}</div>
          <div className="etiquette-loc">{locNames?`📍 ${locNames}`:'Aucun entrepôt'}</div>
        </div>
        <div className="etiquette-stock">
          <div className="etiquette-qty" style={{color:stockColor}}>{item.stock||0}</div>
          <div className="etiquette-unit">{item.unit}s</div>
        </div>
        <div className={`etiquette-chevron${open?' open':''}`}>▼</div>
      </div>
      {/* Expanded */}
      <div className={`etiquette-expand${open?' open':''}`}>
        <div className="etiquette-body">
          <div className="etiquette-row">
            <div className="etiquette-cell"><div className="etiquette-cell-lbl">ACHAT</div><div className="etiquette-cell-val" style={{color:'#e87060'}}>{fmtMoney(item.buyPrice)}</div></div>
            <div className="etiquette-cell"><div className="etiquette-cell-lbl">VENTE</div><div className="etiquette-cell-val" style={{color:'var(--green)'}}>{fmtMoney(item.sellPrice)}</div></div>
            <div className="etiquette-cell"><div className="etiquette-cell-lbl">MARGE</div><div className="etiquette-cell-val" style={{color:'var(--gold)'}}>+{marginPct}%</div></div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>REVENUS <span style={{color:'var(--green)',fontWeight:700}}>{fmtMoney(item.revenue||0)}</span></div>
            <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)'}}>VENDU <span style={{color:'var(--txt)',fontWeight:700}}>{item.totalSold||0}</span></div>
          </div>
          {item.linkedWarehouseAuto&&item.linkedWarehouseId&&(
            <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--green)',marginBottom:8,display:'flex',alignItems:'center',gap:4}}>
              <span>🔗</span><span>Sync auto: {warehouses.find(w=>w.id===item.linkedWarehouseId)?.name||'?'}</span>
            </div>
          )}
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {perms.four_buy&&<button className="btn btn-d btn-sm" style={{flex:1}} onClick={e=>{e.stopPropagation();onBuy(item);}}>🛒 Acheter</button>}
            {perms.four_sell&&(item.stock||0)>0&&<button className="btn btn-g btn-sm" style={{flex:1}} onClick={e=>{e.stopPropagation();onSell(item);}}>💵 Vendre</button>}
            {perms.four_sell&&(item.stock||0)===0&&<button className="btn btn-s btn-sm" style={{flex:1}} disabled>Stock vide</button>}
            {perms.four_manage&&<button className="btn btn-s btn-sm" onClick={e=>{e.stopPropagation();onEdit(item);}}>✏</button>}
            {perms.four_manage&&<button className="btn btn-d btn-sm" onClick={e=>{e.stopPropagation();onDel(item.id);}}>🗑</button>}
          </div>
        </div>
      </div>
    </div>
  );
}


// Recalcule et met à jour four_items.stock depuis la somme des storage_items du même nom
const syncFourStock=async(itemName,fourItemsList,storageItemsList)=>{
  const fourMatch=fourItemsList.find(fi=>fi.name.toLowerCase()===itemName.toLowerCase());
  if(!fourMatch)return;
  const total=storageItemsList.filter(si=>si.name.toLowerCase()===itemName.toLowerCase()).reduce((s,i)=>s+(Number(i.qty)||0),0);
  if((fourMatch.stock||0)!==total){
    await fbSet('four_items',fourMatch.id,{stock:total});
  }
};

function Four({currentUser,perms}){
  const[items,setItems]=useState([]);
  const[storageItems,setStorageItems]=useState([]);
  const items_storage_ref=useRef([]);
  const[treasury,setTreasury]=useState(null);
  const[warehouses,setWarehouses]=useState([]);
  const[showAddItem,setShowAddItem]=useState(false);
  const[showBuy,setShowBuy]=useState(null);
  const[showSell,setShowSell]=useState(null);
  const[showEditItem,setShowEditItem]=useState(null);
  const[showManualT,setShowManualT]=useState(null);
  const[transLog,setTransLog]=useState([]);
  const[catFilter,setCatFilter]=useState('all');
  const[search,setSearch]=useState('');
  const[itemsDb,setItemsDb]=useState([]);
  const emptyItem={name:'',buyPrice:'',sellPrice:'',category:'Drogue',unit:'unité',imageUrl:'',linkedWarehouseId:'',linkedWarehouseAuto:false};
  const[itemForm,setItemForm]=useState(emptyItem);
  const[buyQty,setBuyQty]=useState(1);
  const[buyWarehouse,setBuyWarehouse]=useState('');
  const[sellQty,setSellQty]=useState(1);
  const[sellPrice2,setSellPrice2]=useState('');
  const[buyPrice2,setBuyPrice2]=useState('');
  const[sellWarehouse,setSellWarehouse]=useState('');
  const[manualAmt,setManualAmt]=useState('');
  const[manualReason,setManualReason]=useState('');

  useEffect(()=>{
    const u1=fbLsn('four_items',setItems);
    const u2=fbLsnD('treasury','main',setTreasury);
    const u3=fbLsn('four_transactions',d=>setTransLog(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));
    const u4=fbLsn('warehouses',setWarehouses);
    const u5=fbLsn('storage_items',d=>{setStorageItems(d);items_storage_ref.current=d;});
    const u6=fbLsn('items_db',setItemsDb);
    return()=>{u1();u2();u3();u4();u5();u6();};
  },[]);

  if(!perms.four_view)return<AccessDenied/>;
  const tAmount=treasury?.amount||0;
  const ensureT=async()=>{if(!treasury)await fbSet('treasury','main',{amount:0});};

  const delItem=async id=>{
    const it=items.find(x=>x.id===id);
    if(!it)return;
    await fbDel('four_items',id);
    pushLog('suppression',`Produit four supprimé: ${it.name} par ${currentUser.pseudo}`,'danger','four');
  };

  const addItem=async()=>{
    if(!itemForm.name||!itemForm.buyPrice||!itemForm.sellPrice)return;
    await fbAdd('four_items',{name:itemForm.name,buyPrice:parseInt(itemForm.buyPrice),sellPrice:parseInt(itemForm.sellPrice),category:itemForm.category,unit:itemForm.unit||'unité',imageUrl:itemForm.imageUrl||'',linkedWarehouseId:itemForm.linkedWarehouseId||'',linkedWarehouseAuto:itemForm.linkedWarehouseAuto||false,stock:0,totalBought:0,totalSold:0,revenue:0});
    pushLog('stock',`Produit four ajouté: ${itemForm.name}`,'info','four');
    setShowAddItem(false);setItemForm(emptyItem);
  };

  const buyItem=async()=>{
    const qty=parseInt(buyQty)||1;
    if(!showBuy||qty<=0)return;
    await ensureT();
    const bprice=buyPrice2===''?showBuy.buyPrice:parseInt(buyPrice2)||0;
    const cost=bprice*qty;
    if(tAmount<cost){alert(`Trésorerie insuffisante! Disponible: ${fmtMoney(tAmount)}, Coût: ${fmtMoney(cost)}`);return;}
    await fbSet('four_items',showBuy.id,{totalBought:(showBuy.totalBought||0)+qty});
    await fbSet('treasury','main',{amount:tAmount-cost});
    await fbAdd('four_transactions',{type:'achat',item:showBuy.name,qty,price:bprice,total:cost,by:currentUser.pseudo,date:fmtDate()});
    const targetWh=buyWarehouse||(showBuy.linkedWarehouseAuto?showBuy.linkedWarehouseId:'');
    if(targetWh){
      await fbAdd('storage_items',{name:showBuy.name,category:showBuy.category||'Autre',qty,warehouseId:targetWh,addedBy:`[Four] ${currentUser.pseudo}`,date:fmtDate(),imageUrl:showBuy.imageUrl||'',note:`Achat depuis le Four`});
    }
    // Recalcul stock Four depuis stockage
    const allSt=[...items_storage_ref.current];
    if(targetWh)allSt.push({name:showBuy.name,qty});
    await syncFourStock(showBuy.name,[...items,showBuy],allSt);
    pushLog('stock',`Achat: ${qty}x ${showBuy.name} ${fmtMoney(cost)} par ${currentUser.pseudo}`,'warn','four');
    setShowBuy(null);setBuyQty(1);setBuyWarehouse('');setBuyPrice2('');
  };

  const sellItem=async()=>{
    const qty=parseInt(sellQty)||1;
    const sprice=sellPrice2===''?showSell.sellPrice:parseInt(sellPrice2)||0;
    if(!showSell||qty<=0)return;
    if(qty>(showSell.stock||0)){alert('Stock insuffisant!');return;}
    await ensureT();
    const gain=sprice*qty;
    await fbSet('four_items',showSell.id,{stock:(showSell.stock||0)-qty,totalSold:(showSell.totalSold||0)+qty,revenue:(showSell.revenue||0)+gain});
    await fbSet('treasury','main',{amount:tAmount+gain});
    await fbAdd('four_transactions',{type:'vente',item:showSell.name,qty,price:sprice,total:gain,by:currentUser.pseudo,date:fmtDate()});
    const effectiveWh=sellWarehouse||(()=>{const whs=[...new Set(items_storage_ref.current.filter(i=>i.name===showSell.name&&i.qty>0).map(i=>i.warehouseId))];return whs.length===1?whs[0]:'';})();
    if(effectiveWh){
      const storageMatches=items_storage_ref.current.filter(i=>i.warehouseId===effectiveWh&&i.name===showSell.name);
      let remaining=qty;
      for(const si of storageMatches){
        if(remaining<=0)break;
        const take=Math.min(si.qty,remaining);
        if(si.qty-take<=0)await fbDel('storage_items',si.id);
        else await fbSet('storage_items',si.id,{qty:si.qty-take});
        remaining-=take;
      }
    }
    // Recalcul stock Four depuis ce qu'il reste dans storage
    const remaining2=items_storage_ref.current.map(si=>{
      if(si.name.toLowerCase()!==showSell.name.toLowerCase())return si;
      if(si.warehouseId!==effectiveWh)return si;
      return null;
    }).filter(Boolean);
    // Recalcul propre via helper avec snapshot mis à jour
    const updatedStorage=items_storage_ref.current.filter(si=>!(si.name.toLowerCase()===showSell.name.toLowerCase()&&si.warehouseId===effectiveWh));
    await syncFourStock(showSell.name,items,updatedStorage);
    pushLog('stock',`Vente: ${qty}x ${showSell.name} ${fmtMoney(gain)} par ${currentUser.pseudo}`,'info','four');
    setShowSell(null);setSellQty(1);setSellPrice2('');setSellWarehouse('');
  };

  const saveEditItem=async()=>{
    if(!showEditItem)return;const{id,...d}=showEditItem;
    await fbSet('four_items',id,{name:d.name,buyPrice:parseInt(d.buyPrice),sellPrice:parseInt(d.sellPrice),category:d.category,unit:d.unit,imageUrl:d.imageUrl||'',linkedWarehouseId:d.linkedWarehouseId||'',linkedWarehouseAuto:d.linkedWarehouseAuto||false});
    setShowEditItem(null);
  };

  const doManualTreasury=async()=>{
    const v=parseInt(manualAmt);if(isNaN(v)||v<=0)return;
    if((showManualT==='add'||showManualT==='remove')&&!manualReason.trim()){alert('La raison est obligatoire.');return;}
    await ensureT();
    let newAmt=tAmount;
    if(showManualT==='add')newAmt=tAmount+v;
    else if(showManualT==='remove')newAmt=Math.max(0,tAmount-v);
    else if(showManualT==='set')newAmt=v;
    await fbSet('treasury','main',{amount:newAmt});
    const msg=showManualT==='add'?`+${fmtMoney(v)} ajouté (${manualReason}) par ${currentUser.pseudo}`:showManualT==='remove'?`−${fmtMoney(v)} retiré (${manualReason}) par ${currentUser.pseudo}`:`Trésorerie définie à ${fmtMoney(v)} par ${currentUser.pseudo}`;
    pushLog('modification',msg,'warn','tresorerie');
    setShowManualT(null);setManualAmt('');setManualReason('');
  };

  const totalRevenue=items.reduce((s,i)=>s+(i.revenue||0),0);
  const totalSpent=items.reduce((s,i)=>s+(i.totalBought||0)*(i.buyPrice||0),0);

  const sortedItems=[...items].sort((a,b)=>a.name.localeCompare(b.name));
  const filteredItems=sortedItems.filter(i=>{
    if(catFilter!=='all'&&i.category!==catFilter)return false;
    if(search&&!i.name.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  });

  return(
    <div className="pe">
      {/* Trésorerie */}
      <div className="treasury">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
          <div>
            <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--gold)',letterSpacing:'.12em',marginBottom:6}}>TRÉSORERIE DU GROUPE</div>
            <div style={{fontSize:30,fontWeight:800,color:'var(--gold)',lineHeight:1}}>{perms.treasury_view?fmtMoney(tAmount):'$ ••••••'}</div>
            <div style={{display:'flex',gap:20,marginTop:10}}>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>REVENUS</div><div style={{fontSize:12,fontFamily:'var(--fc)',color:'var(--green)',fontWeight:700}}>{fmtMoney(totalRevenue)}</div></div>
              <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>DÉPENSES</div><div style={{fontSize:12,fontFamily:'var(--fc)',color:'#e87060',fontWeight:700}}>{fmtMoney(totalSpent)}</div></div>
            </div>
          </div>
          {(perms.treasury_deposit||perms.treasury_withdraw||perms.treasury_set)&&(
            <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
              {perms.treasury_deposit&&<button className="btn btn-g btn-sm" onClick={()=>{setShowManualT('add');setManualAmt('');setManualReason('');}}>+ Déposer</button>}
              {perms.treasury_withdraw&&<button className="btn btn-d btn-sm" onClick={()=>{setShowManualT('remove');setManualAmt('');setManualReason('');}}>− Retirer</button>}
              {perms.treasury_set&&<button className="btn btn-s btn-sm" onClick={()=>{setShowManualT('set');setManualAmt(String(tAmount));setManualReason('');}}>✏ Définir</button>}
            </div>
          )}
        </div>
      </div>

      {/* Filtres + recherche */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <span style={{fontSize:13,fontWeight:700,color:'var(--txt)'}}>🍖 Produits</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {['all',...FOUR_CATS].map(c=>(
            <button key={c} className={`btn btn-sm ${catFilter===c?'btn-p':'btn-s'}`} onClick={()=>setCatFilter(c)} style={{fontSize:10}}>{c==='all'?'Tous':c}</button>
          ))}
        </div>
        <input className="searchbar" value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher un produit..."/>
        {perms.four_manage&&<button className="btn btn-p btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowAddItem(true)}>+ Produit</button>}
      </div>

      {filteredItems.length===0?
        <div className="card"><div style={{padding:36,textAlign:'center',color:'var(--txtm)',fontSize:12}}>Aucun produit</div></div>
      :
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10,marginBottom:20}}>
          {filteredItems.map(item=>(
            <Etiquette key={item.id} item={item} warehouses={warehouses} storageItems={storageItems} perms={perms}
              onBuy={it=>{setShowBuy(it);setBuyQty(1);setBuyPrice2('');}}
              onSell={it=>{setShowSell(it);setSellQty(1);setSellPrice2('');}}
              onEdit={it=>setShowEditItem({...it})}
              onDel={delItem}
            />
          ))}
        </div>
      }

      {/* Historique */}
      {transLog.length>0&&(
        <div className="card" style={{marginTop:4}}>
          <div className="ch"><span className="ct">📜 Transactions</span><span className="csub">{transLog.length} ops</span></div>
          <div style={{maxHeight:200,overflowY:'auto'}}>
            {transLog.slice(0,60).map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 14px',borderBottom:'1px solid var(--bdr)',fontSize:11}}>
                <span style={{fontSize:13}}>{t.type==='achat'?'🔴':'🟢'}</span>
                <span style={{fontFamily:'var(--fc)',color:'var(--txtm)',width:70,flexShrink:0}}>{t.date}</span>
                <span style={{flex:1,color:'var(--txt2)'}}>{t.type==='achat'?'Achat':'Vente'} {t.qty}x <strong style={{color:'var(--txt)'}}>{t.item}</strong></span>
                <span style={{fontFamily:'var(--fc)',fontWeight:700,color:t.type==='achat'?'#e87060':'var(--green)'}}>{t.type==='achat'?'-':'+' }{fmtMoney(t.total)}</span>
                <span style={{fontSize:9,color:'var(--txtm)',fontFamily:'var(--fc)'}}>{t.by}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Modal Trésorerie */}
      {showManualT&&<Modal title={showManualT==='add'?'Ajouter à la Trésorerie':showManualT==='remove'?'Retirer de la Trésorerie':'Définir la Trésorerie'} onClose={()=>setShowManualT(null)} footer={<><button className="btn btn-s" onClick={()=>setShowManualT(null)}>Annuler</button><button className={`btn ${showManualT==='remove'?'btn-d':'btn-p'}`} onClick={doManualTreasury}>Confirmer</button></>}>
        <div style={{background:'var(--bg3)',borderRadius:'var(--r)',padding:'10px 12px',marginBottom:14,display:'flex',gap:20}}>
          <div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>ACTUEL</div><div style={{fontSize:15,fontFamily:'var(--fc)',color:'var(--gold)',fontWeight:700}}>{fmtMoney(tAmount)}</div></div>
          {showManualT!=='set'&&manualAmt&&<div><div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>APRÈS</div><div style={{fontSize:15,fontFamily:'var(--fc)',color:showManualT==='add'?'var(--green)':'#e87060',fontWeight:700}}>{fmtMoney(showManualT==='add'?tAmount+parseInt(manualAmt||0):Math.max(0,tAmount-parseInt(manualAmt||0)))}</div></div>}
        </div>
        <div className="fg"><label className="lbl">MONTANT ($)</label><input type="number" className="inp" value={manualAmt} onChange={e=>setManualAmt(e.target.value)} placeholder="0" autoFocus/></div>
        {(showManualT==='add'||showManualT==='remove')&&<div className="fg"><label className="lbl">RAISON <span style={{color:'#e87060'}}>*</span></label><input className="inp" value={manualReason} onChange={e=>setManualReason(e.target.value)} placeholder={showManualT==='add'?'Ex: Vente de rue...':'Ex: Achat matériel...'}/></div>}
      </Modal>}

      {/* Modal add item */}
      {showAddItem&&<Modal title="Nouveau Produit" onClose={()=>setShowAddItem(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAddItem(false)}>Annuler</button><button className="btn btn-p" onClick={addItem}>Ajouter</button></>} wide>
        <div style={{display:'flex',gap:16}}>
          <div style={{flex:1}}>
            <div className="fg"><label className="lbl">NOM</label><input className="inp" value={itemForm.name} onChange={e=>{
              const name=e.target.value;
              const match=itemsDb.find(d=>d.name.toLowerCase()===name.toLowerCase());
              if(match){setItemForm({...itemForm,name,category:match.category,imageUrl:match.imageUrl||itemForm.imageUrl});}
              else{setItemForm({...itemForm,name});}
            }} placeholder="Ex: Kit médical"/>
            {itemForm.name&&itemsDb.find(d=>d.name.toLowerCase()===itemForm.name.toLowerCase())&&(
              <div style={{background:'var(--accf)',border:'1px solid rgba(200,202,212,.2)',borderRadius:'var(--r)',padding:'6px 10px',fontSize:10,fontFamily:'var(--fc)',color:'var(--acc)',marginTop:-6,marginBottom:8}}>✓ Item trouvé dans la DB — catégorie et image auto-remplies</div>
            )}</div>
            <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={itemForm.category} onChange={e=>setItemForm({...itemForm,category:e.target.value})}>{FOUR_CATS_ALL.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label className="lbl">UNITÉ</label><input className="inp" value={itemForm.unit} onChange={e=>setItemForm({...itemForm,unit:e.target.value})} placeholder="sachet, kg, unité..."/></div>
            <div className="g2">
              <div className="fg"><label className="lbl">PRIX ACHAT ($)</label><input type="number" className="inp" value={itemForm.buyPrice} onChange={e=>setItemForm({...itemForm,buyPrice:e.target.value})}/></div>
              <div className="fg"><label className="lbl">PRIX VENTE ($)</label><input type="number" className="inp" value={itemForm.sellPrice} onChange={e=>setItemForm({...itemForm,sellPrice:e.target.value})}/></div>
            </div>
            <div className="fg">
              <label className="lbl">SYNC STOCKAGE</label>
              <select className="sel" value={itemForm.linkedWarehouseId} onChange={e=>setItemForm({...itemForm,linkedWarehouseId:e.target.value})}>
                <option value="">— Pas de sync</option>
                {warehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
              {itemForm.linkedWarehouseId&&(
                <label style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:11,color:'var(--txt2)',cursor:'pointer'}}>
                  <input type="checkbox" checked={itemForm.linkedWarehouseAuto||false} onChange={e=>setItemForm({...itemForm,linkedWarehouseAuto:e.target.checked})}/>
                  Ajouter automatiquement au stock quand j'achète
                </label>
              )}
            </div>
          </div>
          <div style={{width:200}}>
            <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
              {itemForm.imageUrl?<img src={itemForm.imageUrl} alt="icon" style={{width:56,height:56,objectFit:'cover',borderRadius:12,border:'1px solid var(--bdr)'}}/>
                :<div style={{width:56,height:56,borderRadius:12,background:'var(--bg3)',border:'1px dashed var(--bdrb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',textAlign:'center',padding:4}}>Aucune image</div>}
            </div>
            <ItemIconPicker imageUrl={itemForm.imageUrl||''} onChangeImage={u=>setItemForm({...itemForm,imageUrl:u})}/>
          </div>
        </div>
        {itemForm.buyPrice&&itemForm.sellPrice&&<div style={{background:'var(--greenf)',border:'1px solid rgba(0,208,132,.3)',borderRadius:'var(--r)',padding:'8px 12px',fontSize:11,fontFamily:'var(--fc)',color:'var(--green)',marginTop:4}}>Marge: {fmtMoney(parseInt(itemForm.sellPrice||0)-parseInt(itemForm.buyPrice||0))} (+{Math.round(((parseInt(itemForm.sellPrice||0)-parseInt(itemForm.buyPrice||0))/Math.max(1,parseInt(itemForm.buyPrice||1)))*100)}%)</div>}
      </Modal>}

      {/* Modal edit item */}
      {showEditItem&&<Modal title={`Modifier — ${showEditItem.name}`} onClose={()=>setShowEditItem(null)} footer={<><button className="btn btn-s" onClick={()=>setShowEditItem(null)}>Annuler</button><button className="btn btn-p" onClick={saveEditItem}>Sauvegarder</button></>} wide>
        <div style={{display:'flex',gap:16}}>
          <div style={{flex:1}}>
            <div className="fg"><label className="lbl">NOM</label><input className="inp" value={showEditItem.name} onChange={e=>setShowEditItem({...showEditItem,name:e.target.value})}/></div>
            <div className="fg"><label className="lbl">CATÉGORIE</label><select className="sel" value={showEditItem.category} onChange={e=>setShowEditItem({...showEditItem,category:e.target.value})}>{FOUR_CATS_ALL.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label className="lbl">UNITÉ</label><input className="inp" value={showEditItem.unit} onChange={e=>setShowEditItem({...showEditItem,unit:e.target.value})}/></div>
            <div className="g2">
              <div className="fg"><label className="lbl">PRIX ACHAT ($)</label><input type="number" className="inp" value={showEditItem.buyPrice} onChange={e=>setShowEditItem({...showEditItem,buyPrice:e.target.value})}/></div>
              <div className="fg"><label className="lbl">PRIX VENTE ($)</label><input type="number" className="inp" value={showEditItem.sellPrice} onChange={e=>setShowEditItem({...showEditItem,sellPrice:e.target.value})}/></div>
            </div>
            <div className="fg">
              <label className="lbl">SYNC STOCKAGE</label>
              <select className="sel" value={showEditItem.linkedWarehouseId||''} onChange={e=>setShowEditItem({...showEditItem,linkedWarehouseId:e.target.value})}>
                <option value="">— Pas de sync</option>
                {warehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
              {showEditItem.linkedWarehouseId&&(
                <label style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:11,color:'var(--txt2)',cursor:'pointer'}}>
                  <input type="checkbox" checked={showEditItem.linkedWarehouseAuto||false} onChange={e=>setShowEditItem({...showEditItem,linkedWarehouseAuto:e.target.checked})}/>
                  Sync auto à l'achat
                </label>
              )}
            </div>
          </div>
          <div style={{width:200}}>
            <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
              {showEditItem.imageUrl?<img src={showEditItem.imageUrl} alt="icon" style={{width:56,height:56,objectFit:'cover',borderRadius:12,border:'1px solid var(--bdr)'}}/>
                :<div style={{width:56,height:56,borderRadius:12,background:'var(--bg3)',border:'1px dashed var(--bdrb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',textAlign:'center',padding:4}}>Aucune image</div>}
            </div>
            <ItemIconPicker imageUrl={showEditItem.imageUrl||''} onChangeImage={u=>setShowEditItem({...showEditItem,imageUrl:u})}/>
          </div>
        </div>
      </Modal>}

// ─── CHAT ─────────────────────────────────────────────────────────────────────
function Chat({currentUser,perms}){
  const[messages,setMessages]=useState([]);
  const[input,setInput]=useState('');
  const[presence,setPresence2]=useState([]);
  const[members,setMembers]=useState([]);
  const[webhookUrl,setWebhookUrl]=useState('');
  const endRef=useRef(null);
  useEffect(()=>{
    const u1=fbLsn('messages',d=>setMessages(d.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0))));
    const u2=fbLsn('presence',setPresence2);
    const u3=fbLsn('members',setMembers);
    const u4=fbLsnD('settings','webhooks',data=>{if(data){setWebhookUrl(data.chat||'');window._setWebhooks(data);}});
    return()=>{u1();u2();u3();u4();};
  },[]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  if(!perms.chat_read)return<AccessDenied/>;
  const send=()=>{
    if(!input.trim()||!perms.chat_write)return;
    const content=input.trim();
    fbAdd('messages',{userId:currentUser.id,pseudo:currentUser.pseudo,content,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),avatar:currentUser.avatar,avatarColor:currentUser.avatarColor});
    if(webhookUrl){
      sendWebhook(webhookUrl,{username:`VMF • ${currentUser.pseudo}`,content:`**[${currentUser.grade}] ${currentUser.pseudo}** : ${content}`});
    }
    setInput('');
  };
  const onlineCount=presence.filter(p=>p.online).length;
  return(
    <div className="pe" style={{height:'calc(100vh - var(--th) - 40px)',display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,display:'flex',minHeight:0,background:'var(--bgc)',border:'1px solid var(--bdr)',borderRadius:'var(--rl)',overflow:'hidden'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          <div style={{padding:'9px 14px',borderBottom:'1px solid var(--bdr)',background:'var(--bg3)',display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:'var(--red)',display:'inline-block'}}></span>
            <span style={{fontSize:12,fontWeight:700}}># canal général</span>
            <span style={{marginLeft:'auto',fontSize:10,fontFamily:'var(--fc)',color:'var(--green)'}}>{onlineCount} en ligne</span>
          </div>
          <div style={{flex:1,overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:7}}>
            {messages.length===0&&<div style={{textAlign:'center',color:'var(--txtm)',fontSize:12,padding:'20px 0'}}>Aucun message</div>}
            {messages.map(m=>(
              <div key={m.id} className={`cmsg ${m.userId===currentUser.id?'mine':'theirs'}`}>
                {m.userId!==currentUser.id&&<div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                  <div style={{width:16,height:16,borderRadius:'50%',background:m.avatarColor||'#7a90a8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10}}>{m.avatar}</div>
                  <span style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>{m.pseudo}</span>
                </div>}
                <div className="cbub">{m.content}</div>
                <div className="cmeta">{m.time}</div>
              </div>
            ))}
            <div ref={endRef}/>
          </div>
          <div style={{padding:'10px 14px',borderTop:'1px solid var(--bdr)',background:'var(--bgc)'}}>
            {perms.chat_write
              ?<div style={{display:'flex',gap:7}}><input className="inp" style={{fontSize:12}} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Message..."/><button style={{background:'var(--acc)',color:'#0e0e10',border:'none',padding:'7px 13px',borderRadius:'var(--r)',fontSize:12,cursor:'pointer',fontWeight:600}} onClick={send}>Envoyer</button></div>
              :<div style={{textAlign:'center',fontSize:11,fontFamily:'var(--fc)',color:'var(--txtm)',padding:'6px'}}>Écriture désactivée</div>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

      </div>
      <style>{`
        .vmf-popup .leaflet-popup-content-wrapper{background:transparent;border:none;box-shadow:none;padding:0}

        .leaflet-control-attribution a{color:var(--acc)!important}
      `}</style>
    </div>
  );

// ─── MAP CANVAS ───────────────────────────────────────────────────────────────
function MapCanvas({perms}){
  const canvasRef=useRef(null);
  const containerRef=useRef(null);
  const stateRef=useRef({x:0,y:0,zoom:0.6,dragging:false,dragStartX:0,dragStartY:0,img:null,imgLoaded:null,markers:[]});
  const[markers,setMarkers]=useState([]);
  const[addMode,setAddMode]=useState(false);
  const[selMarker,setSelMarker]=useState(null);
  const[markerForm,setMarkerForm]=useState({label:'',color:'#e87060',icon:'📍'});
  const[zoom,setZoom]=useState(0.6);
  const[imgStatus,setImgStatus]=useState('loading');
  const[coords,setCoords]=useState({x:0,y:0});

  // GTA V map — use a public image CDN that allows cross-origin
  const MAP_URL='https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/GTA_V_Map.png/1024px-GTA_V_Map.png';
  const MAP_W=1024,MAP_H=1024;

  const MARKER_ICONS=['📍','🏭','🏠','🚗','💰','⚠️','🎯','💊','🗡','🏪','🔴','🟡','🟢'];
  const MARKER_COLORS=['#e87060','#c9a84c','#00d084','#60a5fa','#a78bfa','#f97316','#ec4899','#c8cad4'];

  const draw=useCallback(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const s=stateRef.current;
    const W=canvas.width,H=canvas.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0a0c0e';ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(42,42,48,0.5)';ctx.lineWidth=1;
    const gs=50*s.zoom;const ox=((s.x%gs)+gs)%gs;const oy=((s.y%gs)+gs)%gs;
    for(let x2=ox-gs;x2<W+gs;x2+=gs){ctx.beginPath();ctx.moveTo(x2,0);ctx.lineTo(x2,H);ctx.stroke();}
    for(let y2=oy-gs;y2<H+gs;y2+=gs){ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(W,y2);ctx.stroke();}
    if(s.img&&s.imgLoaded){
      const sw=MAP_W*s.zoom,sh=MAP_H*s.zoom;
      ctx.drawImage(s.img,s.x,s.y,sw,sh);
    }
    // markers
    s.markers.forEach((m,idx)=>{
      const mx=s.x+m.nx*MAP_W*s.zoom;
      const my=s.y+m.ny*MAP_H*s.zoom;
      ctx.save();
      ctx.shadowColor=m.color||'#e87060';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(mx,my,10,0,Math.PI*2);
      ctx.fillStyle=(m.color||'#e87060')+'55';ctx.fill();
      ctx.strokeStyle=m.color||'#e87060';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
      ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(m.icon||'📍',mx,my);
      if(m.label){
        ctx.fillStyle='rgba(14,14,16,0.85)';
        const tw=ctx.measureText(m.label).width;
        ctx.fillRect(mx-tw/2-4,my+14,tw+8,16);
        ctx.fillStyle='#f0f0f5';ctx.font='bold 10px JetBrains Mono,monospace';
        ctx.textAlign='center';ctx.fillText(m.label,mx,my+22);
      }
    });
    if(s.imgLoaded===false&&s.img===null){
      ctx.fillStyle='#9090a0';ctx.font='14px Syne,sans-serif';ctx.textAlign='center';
      ctx.fillText('Chargement de la carte...',W/2,H/2);
    }
  },[]);

  useEffect(()=>{
    const s=stateRef.current;
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{
      s.img=img;s.imgLoaded=true;
      // center map initially
      const canvas=canvasRef.current;
      if(canvas){
        s.x=(canvas.width-MAP_W*s.zoom)/2;
        s.y=(canvas.height-MAP_H*s.zoom)/2;
      }
      setImgStatus('ok');draw();
    };
    img.onerror=()=>{s.imgLoaded=false;s.img=null;setImgStatus('error');draw();};
    img.src=MAP_URL;
    draw();
  },[draw]);

  const clamp=(val,min,max)=>Math.max(min,Math.min(max,val));

  const resizeCanvas=useCallback(()=>{
    const canvas=canvasRef.current;const cont=containerRef.current;
    if(!canvas||!cont)return;
    canvas.width=cont.clientWidth;canvas.height=cont.clientHeight;
    draw();
  },[draw]);

  useEffect(()=>{
    resizeCanvas();
    const ro=new ResizeObserver(resizeCanvas);
    if(containerRef.current)ro.observe(containerRef.current);
    return()=>ro.disconnect();
  },[resizeCanvas]);

  // sync markers to stateRef
  useEffect(()=>{stateRef.current.markers=markers;},[markers]);

  const onWheel=useCallback(e=>{
    e.preventDefault();
    const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const delta=e.deltaY>0?0.85:1.18;
    const nz=clamp(s.zoom*delta,0.15,4);
    // zoom around mouse
    s.x=mx-(mx-s.x)*(nz/s.zoom);
    s.y=my-(my-s.y)*(nz/s.zoom);
    s.zoom=nz;setZoom(nz);draw();
  },[draw]);

  const onMouseDown=useCallback(e=>{
    if(addMode){
      const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;
      const rect=canvas.getBoundingClientRect();
      const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
      const nx=(cx-s.x)/(MAP_W*s.zoom);
      const ny=(cy-s.y)/(MAP_H*s.zoom);
      if(nx>=0&&nx<=1&&ny>=0&&ny<=1){
        const nm={id:Date.now(),nx,ny,label:markerForm.label||'Marqueur',color:markerForm.color,icon:markerForm.icon};
        setMarkers(prev=>[...prev,nm]);setAddMode(false);draw();
      }
      return;
    }
    const s=stateRef.current;
    s.dragging=true;s.lastX=e.clientX;s.lastY=e.clientY;
  },[addMode,markerForm,draw]);

  const onMouseMove=useCallback(e=>{
    const s=stateRef.current;if(!s.dragging)return;
    s.x+=e.clientX-s.lastX;s.y+=e.clientY-s.lastY;
    s.lastX=e.clientX;s.lastY=e.clientY;
    const mx=e.clientX;const my=e.clientY;
    const canvas=canvasRef.current;if(canvas){const r=canvas.getBoundingClientRect();setCoords({x:Math.round((mx-r.left-s.x)/(MAP_W*s.zoom)*100),y:Math.round((my-r.top-s.y)/(MAP_H*s.zoom)*100)});}
    draw();
  },[draw]);

  const onMouseUp=useCallback(()=>{stateRef.current.dragging=false;},[]);

  const onTouchStart=useCallback(e=>{
    const s=stateRef.current;
    if(e.touches.length===1){s.dragging=true;s.lastX=e.touches[0].clientX;s.lastY=e.touches[0].clientY;}
  },[]);
  const onTouchMove=useCallback(e=>{
    e.preventDefault();
    const s=stateRef.current;
    if(e.touches.length===1&&s.dragging){
      s.x+=e.touches[0].clientX-s.lastX;s.y+=e.touches[0].clientY-s.lastY;
      s.lastX=e.touches[0].clientX;s.lastY=e.touches[0].clientY;draw();
    }
  },[draw]);

  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    canvas.addEventListener('wheel',onWheel,{passive:false});
    canvas.addEventListener('mousemove',onMouseMove);
    canvas.addEventListener('mousedown',onMouseDown);
    canvas.addEventListener('mouseup',onMouseUp);
    canvas.addEventListener('mouseleave',onMouseUp);
    canvas.addEventListener('touchstart',onTouchStart,{passive:false});
    canvas.addEventListener('touchmove',onTouchMove,{passive:false});
    canvas.addEventListener('touchend',onMouseUp);
    return()=>{
      canvas.removeEventListener('wheel',onWheel);
      canvas.removeEventListener('mousemove',onMouseMove);
      canvas.removeEventListener('mousedown',onMouseDown);
      canvas.removeEventListener('mouseup',onMouseUp);
      canvas.removeEventListener('mouseleave',onMouseUp);
      canvas.removeEventListener('touchstart',onTouchStart);
      canvas.removeEventListener('touchmove',onTouchMove);
      canvas.removeEventListener('touchend',onMouseUp);
    };
  },[onWheel,onMouseMove,onMouseDown,onMouseUp,onTouchStart,onTouchMove]);

  const resetView=()=>{
    const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;
    s.zoom=1;s.x=(canvas.width-MAP_W)/2;s.y=(canvas.height-MAP_H)/2;setZoom(1);draw();
  };
  const zoomIn=()=>{const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;const nz=clamp(s.zoom*1.3,0.15,4);const cx=canvas.width/2,cy=canvas.height/2;s.x=cx-(cx-s.x)*(nz/s.zoom);s.y=cy-(cy-s.y)*(nz/s.zoom);s.zoom=nz;setZoom(nz);draw();};
  const zoomOut=()=>{const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;const nz=clamp(s.zoom*0.77,0.15,4);const cx=canvas.width/2,cy=canvas.height/2;s.x=cx-(cx-s.x)*(nz/s.zoom);s.y=cy-(cy-s.y)*(nz/s.zoom);s.zoom=nz;setZoom(nz);draw();};
  const delMarker=id=>{setMarkers(prev=>prev.filter(m=>m.id!==id));setSelMarker(null);draw();};

  if(!perms.map_view)return<AccessDenied/>;

  return(
    <div className="pe" style={{height:'calc(100vh - var(--th) - 40px)',display:'flex',flexDirection:'column',gap:8}}>
      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:4}}>
          <button className="btn btn-s btn-sm" onClick={zoomOut} title="Zoom -">−</button>
          <button className="btn btn-s btn-sm" style={{minWidth:52,fontFamily:'var(--fc)',fontSize:10}} onClick={resetView}>{Math.round(zoom*100)}%</button>
          <button className="btn btn-s btn-sm" onClick={zoomIn} title="Zoom +">+</button>
        </div>
        <button className={`btn btn-sm ${addMode?'btn-g':'btn-s'}`} onClick={()=>setAddMode(v=>!v)} title="Placer un marqueur">
          {addMode?'🖱 Cliquer sur la carte':'📍 Ajouter marqueur'}
        </button>
        {addMode&&(
          <div style={{display:'flex',gap:6,alignItems:'center',background:'var(--bgc)',border:'1px solid var(--green)',borderRadius:'var(--r)',padding:'4px 10px'}}>
            <input className="inp" style={{width:120,padding:'4px 8px',fontSize:11}} value={markerForm.label} onChange={e=>setMarkerForm({...markerForm,label:e.target.value})} placeholder="Nom du lieu..."/>
            <div style={{display:'flex',gap:3}}>
              {MARKER_ICONS.map(ic=><button key={ic} onClick={()=>setMarkerForm({...markerForm,icon:ic})}
                style={{background:markerForm.icon===ic?'var(--accf)':'transparent',border:`1px solid ${markerForm.icon===ic?'var(--acc)':'transparent'}`,borderRadius:4,padding:'2px 4px',cursor:'pointer',fontSize:14}}>{ic}</button>)}
            </div>
            <div style={{display:'flex',gap:3}}>
              {MARKER_COLORS.map(c=><div key={c} onClick={()=>setMarkerForm({...markerForm,color:c})}
                style={{width:16,height:16,borderRadius:'50%',background:c,cursor:'pointer',border:`2px solid ${markerForm.color===c?'#fff':'transparent'}`,flexShrink:0}}/>)}
            </div>
          </div>
        )}
        <div style={{marginLeft:'auto',fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)'}}>
          {imgStatus==='loading'&&'⏳ Chargement...'}
          {imgStatus==='error'&&<span style={{color:'#e87060'}}>⚠ Carte non chargée — vérifiez la connexion</span>}
          {imgStatus==='ok'&&`${markers.length} marqueur${markers.length!==1?'s':''} • Scroll = zoom • Glisser = déplacer`}
        </div>
      </div>
      {/* Map + sidebar */}
      <div style={{flex:1,display:'flex',gap:8,minHeight:0}}>
        {/* Canvas */}
        <div ref={containerRef} style={{flex:1,borderRadius:'var(--rl)',overflow:'hidden',border:'1px solid var(--bdr)',position:'relative',cursor:addMode?'crosshair':'grab',background:'#0a0c0e'}}>
          <canvas ref={canvasRef} style={{display:'block',width:'100%',height:'100%'}}/>
          {imgStatus==='error'&&(
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,pointerEvents:'none'}}>
              <div style={{fontSize:36}}>🗺</div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--txt)'}}>Carte indisponible</div>
              <div style={{fontSize:10,fontFamily:'var(--fc)',color:'var(--txtm)',textAlign:'center',maxWidth:280,lineHeight:1.6}}>
                La carte satellite ne peut pas être chargée.<br/>
                <a href="https://gtaweb.eu/en/gtao-map" target="_blank" rel="noopener noreferrer" style={{color:'var(--acc)',pointerEvents:'all'}}>Ouvrir gtaweb.eu ↗</a>
              </div>
            </div>
          )}
          {/* Zoom controls overlay */}
          <div style={{position:'absolute',bottom:14,right:14,display:'flex',flexDirection:'column',gap:4}}>
            <button className="btn btn-s" style={{width:32,height:32,padding:0,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={zoomIn}>+</button>
            <button className="btn btn-s" style={{width:32,height:32,padding:0,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={zoomOut}>−</button>
            <button className="btn btn-s" style={{width:32,height:32,padding:0,fontSize:12,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={resetView} title="Réinitialiser vue">⌂</button>
          </div>
        </div>
        {/* Marker list */}
        {markers.length>0&&(
          <div style={{width:200,flexShrink:0,background:'var(--bgc)',border:'1px solid var(--bdr)',borderRadius:'var(--rl)',overflow:'hidden',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'10px 12px',borderBottom:'1px solid var(--bdr)',background:'var(--bg3)',fontSize:11,fontWeight:700,color:'var(--txt)'}}>📍 Marqueurs ({markers.length})</div>
            <div style={{flex:1,overflowY:'auto'}}>
              {markers.map(m=>(
                <div key={m.id} style={{padding:'8px 12px',borderBottom:'1px solid var(--bdr)',display:'flex',alignItems:'center',gap:8,cursor:'pointer',background:selMarker===m.id?'var(--accf)':'transparent'}}
                  onClick={()=>{
                    const s=stateRef.current;const canvas=canvasRef.current;if(!canvas)return;
                    const cx=canvas.width/2,cy=canvas.height/2;
                    s.x=cx-m.nx*MAP_W*s.zoom;s.y=cy-m.ny*MAP_H*s.zoom;
                    setSelMarker(m.id);draw();
                  }}>
                  <span style={{fontSize:16,flexShrink:0}}>{m.icon||'📍'}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--txt)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.label}</div>
                    <div style={{width:24,height:3,borderRadius:2,background:m.color,marginTop:3}}></div>
                  </div>
                  <button style={{background:'none',border:'none',color:'var(--txtm)',cursor:'pointer',fontSize:13,flexShrink:0}} onClick={e=>{e.stopPropagation();delMarker(m.id);}}>🗑</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ANNOUNCEMENTS ───────────────────────────────────────────────────────────
function Announcements({currentUser,perms}){
  const[anns,setAnns]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[editA,setEditA]=useState(null);
  const[form,setForm]=useState({title:'',content:'',priority:'medium'});
  useEffect(()=>{return fbLsn('announcements',d=>setAnns(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));},[]);
  if(!perms.announcements_view)return<AccessDenied/>;
  const addAnn=async()=>{
    if(!form.title||!form.content)return;
    await fbAdd('announcements',{...form,author:currentUser.pseudo,date:fmtDate()});
    pushLog('modification',`Annonce: "${form.title}" par ${currentUser.pseudo}`,'info','annonces');
    setShowAdd(false);setForm({title:'',content:'',priority:'medium'});
  };
  const saveEdit=async()=>{if(!editA)return;const{id,createdAt,...d}=editA;await fbSet('announcements',id,d);setEditA(null);};
  const del=async id=>{await fbDel('announcements',id);pushLog('suppression','Annonce supprimée','warn','annonces');};
  return(
    <div className="pe">
      {perms.announcements_post&&<div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}><button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}>+ Nouvelle annonce</button></div>}
      {anns.length===0&&<div style={{textAlign:'center',color:'var(--txtm)',fontSize:12,fontFamily:'var(--fc)',padding:'40px 0'}}>Aucune annonce</div>}
      {anns.map(a=>(
        <div className={`ann ${a.priority}`} key={a.id}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--txt)'}}>{a.title}</div>
            <div style={{display:'flex',gap:5,flexShrink:0}}>
              <span className={`bdg ${a.priority==='high'?'bdg-r':a.priority==='medium'?'bdg-gd':'bdg-gr'}`}>{a.priority==='high'?'URGENT':a.priority==='medium'?'IMPORTANT':'INFO'}</span>
              {(perms.announcements_post&&a.author===currentUser.pseudo||perms.announcements_delete)&&<button className="btn btn-s btn-sm" onClick={()=>setEditA({...a})}>✏</button>}
              {(perms.announcements_delete||a.author===currentUser.pseudo&&perms.announcements_post)&&<button className="btn btn-d btn-sm" onClick={()=>del(a.id)}>🗑</button>}
            </div>
          </div>
          <div style={{fontSize:11,color:'var(--txt2)',lineHeight:1.6,marginTop:6}}>{a.content}</div>
          <div style={{fontSize:9,fontFamily:'var(--fc)',color:'var(--txtm)',marginTop:6,display:'flex',gap:10}}><span>{a.author}</span><span>{a.date}</span></div>
        </div>
      ))}
      {showAdd&&<Modal title="Nouvelle Annonce" onClose={()=>setShowAdd(false)} footer={<><button className="btn btn-s" onClick={()=>setShowAdd(false)}>Annuler</button><button className="btn btn-p" onClick={addAnn}>Publier</button></>}>
        <div className="fg"><label className="lbl">TITRE</label><input className="inp" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></div>
        <div className="fg"><label className="lbl">PRIORITÉ</label><select className="sel" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option></select></div>
        <div className="fg"><label className="lbl">CONTENU</label><textarea className="inp" rows={5} value={form.content} onChange={e=>setForm({...form,content:e.target.value})} style={{resize:'none'}}/></div>
      </Modal>}
      {editA&&<Modal title="Modifier" onClose={()=>setEditA(null)} footer={<><button className="btn btn-s" onClick={()=>setEditA(null)}>Annuler</button><button className="btn btn-p" onClick={saveEdit}>Sauvegarder</button></>}>
        <div className="fg"><label className="lbl">TITRE</label><input className="inp" value={editA.title} onChange={e=>setEditA({...editA,title:e.target.value})}/></div>
        <div className="fg"><label className="lbl">PRIORITÉ</label><select className="sel" value={editA.priority} onChange={e=>setEditA({...editA,priority:e.target.value})}><option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option></select></div>
        <div className="fg"><label className="lbl">CONTENU</label><textarea className="inp" rows={5} value={editA.content} onChange={e=>setEditA({...editA,content:e.target.value})} style={{resize:'none'}}/></div>
      </Modal>}
    </div>
  );
}

// ─── LOGS ─────────────────────────────────────────────────────────────────────
function Logs({currentUser,perms}){
  const[logs,setLogs]=useState([]);
  const[filter,setFilter]=useState('all');
  useEffect(()=>{return fbLsn('logs',d=>setLogs(d.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))));},[]);
  if(!perms.logs_view)return<AccessDenied/>;
  const icons={connexion:'🔑',transfert:'🔁',modification:'✏️',suppression:'🗑️',stock:'📦'};
  const filtered=filter==='all'?logs:logs.filter(l=>l.level===filter);
  const clearLogs=async()=>{for(const l of logs){await fbDel('logs',l.id);}};
  return(
    <div className="pe">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{background:'var(--redf)',border:'1px solid rgba(192,57,43,.2)',borderRadius:'var(--r)',padding:'7px 12px',fontSize:10,fontFamily:'var(--fc)',color:'#e87060',flex:1}}>⚠ ACCÈS RESTREINT — Journaux confidentiels</div>
        <div style={{display:'flex',gap:5}}>{['all','info','warn','danger'].map(f=><button key={f} className={`btn btn-sm ${filter===f?'btn-p':'btn-s'}`} onClick={()=>setFilter(f)}>{f==='all'?'Tout':f.toUpperCase()}</button>)}</div>
        {currentUser.grade==='Heritier'&&<button className="btn btn-d btn-sm" onClick={clearLogs}>Effacer</button>}
      </div>
      <div className="card">
        <div className="ch"><span className="ct">📋 Journaux</span><span className="csub">{filtered.length} entrées</span></div>
        {filtered.length===0?<div style={{padding:28,textAlign:'center',color:'var(--txtm)',fontSize:11}}>Aucune entrée</div>:
          filtered.map(l=>(
            <div key={l.id} className="logrow">
              <span className="llt">{l.date} {l.time}</span>
              <span style={{fontSize:13}}>{icons[l.type]||'•'}</span>
              <span className="llm">{l.msg}</span>
              <span className={`llv ${l.level}`}>{l.level}</span>
            </div>
          ))
        }
      </div>
    </div>
  );
}
