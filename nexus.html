<style>

    --border:#2a2a30;--border-bright:#38383f;
    --accent-red:#888fa0;--accent-red-dim:#4a4d5a;--accent-red-glow:rgba(136,143,160,0.12);
    --accent-green:#00d084;--accent-green-dim:#007a4c;--accent-green-glow:rgba(0,208,132,0.1);
    --text-primary:#f0f0f5;--text-secondary:#9090a0;--text-muted:#4a4a55;--text-accent:#c8cad4;

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-main);overflow:hidden;}
  #root{height:100%;}
  ::-webkit-scrollbar{width:4px;height:4px;}

  .mono{font-family:var(--font-mono);}
  .app-layout{display:flex;height:100vh;overflow:hidden;background:var(--bg-primary);}
  .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:50;position:relative;}

  .sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
  .logo-mark{display:flex;align-items:center;gap:8px;}
  .logo-icon{width:32px;height:32px;background:var(--vmf-accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0e0e10;font-family:var(--font-mono);flex-shrink:0;}
  .logo-text{font-size:16px;font-weight:800;letter-spacing:0.12em;color:var(--text-primary);}
  .logo-sub{font-size:8px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.2em;margin-top:1px;}

  .user-info{flex:1;min-width:0;}

  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 6px var(--accent-green);flex-shrink:0;}

  .secure-dot{width:5px;height:5px;border-radius:50%;background:var(--accent-green);animation:pulse-green 2s infinite;}

  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
  .stat-card.red::before{background:var(--vmf-accent);}
  .stat-card.green::before{background:var(--accent-green);}

  .stat-label{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
  .stat-value{font-size:22px;font-weight:800;color:var(--text-primary);line-height:1;}
  .stat-sub{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;}

  .data-table th{text-align:left;padding:8px 12px;font-size:10px;font-family:var(--font-mono);font-weight:500;color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
  .data-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle;}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;font-size:9px;font-family:var(--font-mono);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
  .badge-red{background:var(--vmf-accent-glow);color:var(--vmf-accent);border:1px solid rgba(192,57,43,0.3);}
  .badge-green{background:var(--accent-green-glow);color:var(--accent-green);border:1px solid rgba(0,208,132,0.3);}
  .badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,0.3);}
  .badge-gray{background:rgba(61,84,112,0.2);color:var(--text-secondary);border:1px solid var(--border);}
  .badge-blue{background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);}
  .grade-collaborateur{color:#7a90a8;}.grade-syndic{color:#60a5fa;}.grade-senechaux{color:var(--accent-green);}.grade-regent{color:var(--gold);}.grade-heritier{color:var(--vmf-accent);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;font-family:var(--font-main);cursor:pointer;transition:var(--transition);border:none;outline:none;letter-spacing:0.04em;}
  .btn-primary{background:var(--vmf-accent);color:#0e0e10;}.btn-primary:hover{background:#fff;}
  .btn-secondary{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);}.btn-secondary:hover{background:var(--bg-card-hover);color:var(--text-primary);border-color:var(--border-bright);}
  .btn-sm{padding:4px 10px;font-size:11px;}
  .btn-green{background:var(--accent-green-dim);color:var(--accent-green);border:1px solid rgba(0,208,132,0.3);}.btn-green:hover{background:rgba(0,208,132,0.2);}
  .btn-danger{background:rgba(192,57,43,0.15);color:var(--vmf-accent);border:1px solid rgba(192,57,43,0.3);}.btn-danger:hover{background:rgba(192,57,43,0.25);}
  .input{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text-primary);font-family:var(--font-main);outline:none;transition:var(--transition);width:100%;}
  .input:focus{border-color:var(--vmf-accent);}.input::placeholder{color:var(--text-muted);}
  .select{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text-primary);font-family:var(--font-main);outline:none;cursor:pointer;width:100%;}
  .select:focus{border-color:var(--vmf-accent);}
  .label{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.08em;margin-bottom:6px;display:block;}
  .form-group{margin-bottom:14px;}
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;animation:fadeIn 0.15s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--bg-secondary);border:1px solid var(--border-bright);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;animation:slideUp 0.2s ease;}
  @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:14px;font-weight:700;color:var(--text-primary);}
  .modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:2px;}.modal-close:hover{color:var(--text-primary);}
  .modal-body{padding:20px;}
  .modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);position:relative;overflow:hidden;}
  .login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(192,57,43,0.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(0,208,132,0.02) 0%,transparent 50%);}
  .login-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(26,37,53,0.3) 40px,rgba(26,37,53,0.3) 41px);background-size:100% 41px;}
  .login-card{background:var(--bg-secondary);border:1px solid var(--border-bright);border-radius:var(--radius-lg);padding:40px;width:360px;position:relative;z-index:1;}
  .login-logo{text-align:center;margin-bottom:32px;}
  .login-logo-icon{width:56px;height:56px;margin:0 auto 12px;background:var(--vmf-accent);clip-path:polygon(50% 0%,100%25%,100%75%,50%100%,0%75%,0%25%);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#0e0e10;font-family:var(--font-mono);;font-family:var(--font-mono);}
  .login-title{font-size:22px;font-weight:800;letter-spacing:0.12em;}
  .login-sub{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.2em;margin-top:4px;}
  .login-warning{background:var(--vmf-accent-glow);border:1px solid rgba(192,57,43,0.3);border-radius:var(--radius);padding:10px 12px;font-size:10px;font-family:var(--font-mono);color:var(--vmf-accent);letter-spacing:0.06em;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .login-form{display:flex;flex-direction:column;gap:12px;}
  .login-btn{background:var(--vmf-accent);color:#0e0e10;border:none;padding:12px;border-radius:var(--radius);font-size:13px;font-weight:700;font-family:var(--font-main);cursor:pointer;letter-spacing:0.08em;transition:var(--transition);margin-top:4px;}.login-btn:hover{background:#ffffff;}
  .login-err{font-size:11px;font-family:var(--font-mono);color:var(--vmf-accent);text-align:center;min-height:16px;}
  .notif-panel{position:absolute;top:calc(var(--topbar-h) + 4px);right:8px;width:300px;z-index:100;background:var(--bg-secondary);border:1px solid var(--border-bright);border-radius:var(--radius-lg);overflow:hidden;animation:slideUp 0.2s ease;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:10px;align-items:flex-start;}.notif-item:last-child{border-bottom:none;}
  .notif-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .chat-msg{max-width:75%;}.chat-msg.mine{align-self:flex-end;}.chat-msg.theirs{align-self:flex-start;}
  .chat-msg-bubble{padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5;}
  .mine .chat-msg-bubble{background:var(--vmf-accent-glow);border:1px solid rgba(192,57,43,0.3);color:var(--text-primary);}
  .theirs .chat-msg-bubble{background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);}

  .chat-input{flex:1;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--text-primary);font-family:var(--font-main);outline:none;}.chat-input:focus{border-color:var(--vmf-accent);}
  .chat-send-btn{background:var(--vmf-accent);color:#0e0e10;border:none;padding:8px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-weight:600;transition:var(--transition);}.chat-send-btn:hover{background:#ffffff;}
  .map-wrapper{border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;height:520px;position:relative;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;}

  .ann-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
  .ann-body{font-size:12px;color:var(--text-secondary);line-height:1.6;}
  .ann-meta{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px;display:flex;gap:12px;}

  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .member-chip{display:flex;align-items:center;gap:6px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 4px;font-size:11px;color:var(--text-secondary);}
  .member-chip-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--font-mono);}
  .perm-table{width:100%;border-collapse:collapse;}
  .perm-table th{text-align:left;padding:10px 14px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase;border-bottom:1px solid var(--border);}
  .perm-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;}
  .perm-table tr:last-child td{border-bottom:none;}
  .perm-toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0;}
  .perm-toggle.on{background:var(--accent-green);}.perm-toggle.off{background:var(--border-bright);}
  .perm-toggle::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.2s;}
  .perm-toggle.on::after{left:18px;}.perm-toggle.off::after{left:2px;}
  .log-entry{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:flex-start;font-size:11px;}
  .log-entry:last-child{border-bottom:none;}
  .log-time{font-family:var(--font-mono);color:var(--text-muted);white-space:nowrap;font-size:10px;padding-top:1px;}
  .log-icon{font-size:14px;flex-shrink:0;}
  .log-msg{flex:1;color:var(--text-secondary);}
  .log-level{font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;flex-shrink:0;}
  .log-info{color:var(--text-muted);background:rgba(61,84,112,0.15);}
  .log-warn{color:var(--gold);background:rgba(201,168,76,0.1);}
  .log-danger{color:var(--vmf-accent);background:var(--vmf-accent-glow);}
  @media(max-width:900px){:root{--sidebar-w:48px;}.nav-item span,.logo-text,.logo-sub,.nav-label,.user-info,.secure-badge span,.sidebar-user{display:none;}.nav-item{justify-content:center;padding:10px;}.sidebar-logo{padding:12px 8px;}.logo-mark{justify-content:center;}}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── STORAGE KEY ────────────────────────────────────────────────────────────
const SK = {
  users: 'nexus_users_v1',
  sessions: 'nexus_sessions_v1',
  members: 'nexus_members_v1',

const load = (key, def) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } };

// ─── DEFAULT DATA ────────────────────────────────────────────────────────────
const DEFAULT_ACCOUNTS = [

];

const DEFAULT_MEMBERS = [
  { id:'m1', pseudo:'Ghost', grade:'Heritier', phone:'06 12 34 56 78', joined:'12/03/2024', avatar:'G', avatarColor:'#c0392b' },
];

const DEFAULT_WEAPONS = [];
const DEFAULT_DEBTS = [];
const DEFAULT_VEHICLES = [];
const DEFAULT_ANNOUNCEMENTS = [];
const DEFAULT_MESSAGES = [];
const DEFAULT_LOGS = [];

const DEFAULT_PERMISSIONS = {
  Heritier:  { members_view:true, members_add:true, members_edit:true, weapons_view:true, weapons_add:true, debts_view:true, debts_manage:true, vehicles_view:true, announcements_view:true, announcements_post:true, logs_view:true, permissions_edit:true },
  Regent:    { members_view:true, members_add:true, members_edit:true, weapons_view:true, weapons_add:true, debts_view:true, debts_manage:true, vehicles_view:true, announcements_view:true, announcements_post:true, logs_view:false, permissions_edit:false },
  Senechaux: { members_view:true, members_add:false, members_edit:false, weapons_view:true, weapons_add:true, debts_view:true, debts_manage:false, vehicles_view:true, announcements_view:true, announcements_post:true, logs_view:false, permissions_edit:false },
  Syndic:    { members_view:true, members_add:false, members_edit:false, weapons_view:true, weapons_add:false, debts_view:true, debts_manage:false, vehicles_view:true, announcements_view:true, announcements_post:false, logs_view:false, permissions_edit:false },
  Collaborateur: { members_view:true, members_add:false, members_edit:false, weapons_view:true, weapons_add:false, debts_view:false, debts_manage:false, vehicles_view:true, announcements_view:true, announcements_post:false, logs_view:false, permissions_edit:false },
};

const PERM_LABELS = {
  members_view:'Voir les membres', members_add:'Ajouter un membre', members_edit:'Modifier une fiche',
  weapons_view:'Voir les armes', weapons_add:'Déclarer une arme',
  debts_view:'Voir les dettes', debts_manage:'Créer/gérer les dettes',
  vehicles_view:'Voir les véhicules',
  announcements_view:'Voir les annonces', announcements_post:'Publier une annonce',
  logs_view:'Voir les logs', permissions_edit:'Modifier les permissions',
};

const WEAPON_TYPES = ['couteau','machette','petoire','revolver','batte','hache','marteau','katana','pied de biche','queue de billard','queue de golf','cambu'];
const GRADES = ['Collaborateur','Syndic','Senechaux','Regent','Heritier'];
const gradeColor = g => ({ Heritier:'#c0392b', Regent:'#c9a84c', Senechaux:'#00d084', Syndic:'#60a5fa', Collaborateur:'#7a90a8' }[g]||'#7a90a8');
const gradeClass = g => ({ Heritier:'grade-heritier', Regent:'grade-regent', Senechaux:'grade-senechaux', Syndic:'grade-syndic', Collaborateur:'grade-collaborateur' }[g]||'');
const fmtMoney = n => '$' + n.toLocaleString('fr-FR');
const fmtTime = () => { const now=new Date(); return now.toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
const fmtDate = () => new Date().toISOString().split('T')[0];

const statusBadge = s => {
  const map = { active:<span className="badge badge-green">● Actif</span>, inactive:<span className="badge badge-gray">○ Inactif</span>, disponible:<span className="badge badge-green">Disponible</span>, perdue:<span className="badge badge-gold">Perdue</span>, saisie:<span className="badge badge-red">Saisie</span>, 'payé':<span className="badge badge-green">Payé</span>, 'non-payé':<span className="badge badge-red">Impayé</span>, partiel:<span className="badge badge-gold">Partiel</span> };
  return map[s] || <span className="badge badge-gray">{s}</span>;
};

// ─── SESSIONS (qui est connecté) ─────────────────────────────────────────────
const getSessions = () => load(SK.sessions, {});
const addSession = (userId) => { const s=getSessions(); s[userId]={userId,since:Date.now()}; save(SK.sessions,s); };
const removeSession = (userId) => { const s=getSessions(); delete s[userId]; save(SK.sessions,s); };
const getOnlineUserIds = () => Object.keys(getSessions());

// ─── LOG HELPER ──────────────────────────────────────────────────────────────
const pushLog = (type, msg, level='info') => {
  const logs = load(SK.logs, []);
  const entry = { id:Date.now(), type, msg, level, time:fmtTime(), date:fmtDate() };
  save(SK.logs, [entry, ...logs].slice(0,200));
};

// ─── MODAL ───────────────────────────────────────────────────────────────────
function Modal({ title, onClose, children, footer, wide }) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={wide?{maxWidth:680}:{}}>
        <div className="modal-header"><span className="modal-title">{title}</span><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ currentUser }) {
  const [onlineIds, setOnlineIds] = useState(getOnlineUserIds());
  const accounts = load(SK.users, DEFAULT_ACCOUNTS);
  const members = load(SK.members, DEFAULT_MEMBERS);
  const debts = load(SK.debts, DEFAULT_DEBTS);
  const anns = load(SK.announcements, DEFAULT_ANNOUNCEMENTS);

  useEffect(() => {
    const t = setInterval(() => setOnlineIds(getOnlineUserIds()), 3000);
    return () => clearInterval(t);
  }, []);

  const onlineMembers = accounts
    .filter(a => onlineIds.includes(a.id))
    .map(a => members.find(m => m.id === a.memberId))
    .filter(Boolean);

  const unpaidDebts = debts.filter(d=>d.status!=='payé');
  const totalDebt = unpaidDebts.reduce((s,d)=>s+d.amount-d.paid,0);

  return (
    <div className="page-enter">
      <div className="stats-grid">
        <div className="stat-card green">
          <div className="stat-label">Membres Connectés</div>
          <div className="stat-value">{onlineMembers.length}</div>
          <div className="stat-sub">/{members.length} total</div>
          <span className="stat-icon">👥</span>
        </div>
        <div className="stat-card red">
          <div className="stat-label">Dettes Actives</div>
          <div className="stat-value">{fmtMoney(totalDebt)}</div>
          <div className="stat-sub">{unpaidDebts.length} en attente</div>
          <span className="stat-icon">💰</span>
        </div>
        <div className="stat-card gold">
          <div className="stat-label">Membres Total</div>
          <div className="stat-value">{members.length}</div>
          <div className="stat-sub">{accounts.length} comptes actifs</div>
          <span className="stat-icon">🔑</span>
        </div>
      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-header"><span className="card-title">📢 Dernières Annonces</span></div>
          <div className="card-body" style={{padding:'12px 16px'}}>
            {anns.length === 0 && <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:'20px 0'}}>Aucune annonce</div>}
            {anns.slice(0,3).map(a=>(
              <div className={`announcement ${a.priority}`} key={a.id}>
                <div className="ann-title">{a.title}</div>
                <div className="ann-body">{a.content.slice(0,80)}...</div>
                <div className="ann-meta"><span>{a.author}</span><span>{a.date}</span></div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="card">
            <div className="card-header"><span className="card-title">🟢 En Ligne</span><span className="card-subtitle">{onlineMembers.length} connecté{onlineMembers.length>1?'s':''}</span></div>
            <div className="card-body">
              {onlineMembers.length === 0
                ? <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:'12px 0'}}>Aucun membre connecté</div>
                : <div className="members-online">
                    {onlineMembers.map(m=>(
                      <div className="member-chip" key={m.id}>
                        <div className="member-chip-av" style={{background:m.avatarColor,color:'#fff'}}>{m.avatar}</div>
                        <span>{m.pseudo}</span>
                        <span style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}} className={gradeClass(m.grade)}>{m.grade}</span>
                      </div>
                    ))}
                  </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── MEMBERS ─────────────────────────────────────────────────────────────────
function Members({ currentUser, perms }) {
  const [members, setMembers] = useState(() => load(SK.members, DEFAULT_MEMBERS));
  const [onlineIds, setOnlineIds] = useState(getOnlineUserIds());
  const accounts = load(SK.users, DEFAULT_ACCOUNTS);
  const [showModal, setShowModal] = useState(false);
  const [editModal, setEditModal] = useState(null);
  const [form, setForm] = useState({ pseudo:'', grade:'Collaborateur', phone:'' });
  const [filter, setFilter] = useState('all');

  useEffect(() => {
    const t = setInterval(() => setOnlineIds(getOnlineUserIds()), 3000);
    return () => clearInterval(t);
  }, []);

  const filtered = filter==='all' ? members : members.filter(m=>m.grade===filter);
  const isOnline = (memberId) => {
    const acc = accounts.find(a => a.memberId === memberId);
    return acc ? onlineIds.includes(acc.id) : false;
  };

  const addMember = () => {
    if(!form.pseudo) return;
    const nm = { id:'m'+Date.now(), pseudo:form.pseudo, grade:form.grade, phone:form.phone, joined:new Date().toLocaleDateString('fr'), avatar:form.pseudo[0].toUpperCase(), avatarColor:gradeColor(form.grade) };
    const updated = [...members, nm];
    setMembers(updated); save(SK.members, updated);
    pushLog('modification', `Nouveau membre ajouté: ${form.pseudo} (${form.grade}) par ${currentUser.pseudo}`, 'info');
    setShowModal(false); setForm({ pseudo:'', grade:'Collaborateur', phone:'' });
  };

  const saveMember = () => {
    if(!editModal) return;
    const updated = members.map(m => m.id===editModal.id ? {...editModal} : m);
    setMembers(updated); save(SK.members, updated);
    pushLog('modification', `Fiche membre ${editModal.pseudo} modifiée par ${currentUser.pseudo}`, 'info');
    setEditModal(null);
  };

  const deleteMember = (id) => {
    const m = members.find(x=>x.id===id);
    const updated = members.filter(x=>x.id!==id);
    setMembers(updated); save(SK.members, updated);
    pushLog('suppression', `Membre ${m?.pseudo} supprimé par ${currentUser.pseudo}`, 'danger');
  };

  const isHeritier = currentUser.grade === 'Heritier';

  return (
    <div className="page-enter">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['all',...GRADES].map(g=>(
            <button key={g} className={`btn btn-secondary btn-sm ${filter===g?'btn-primary':''}`} onClick={()=>setFilter(g)}>{g==='all'?'Tous':g}</button>
          ))}
        </div>
        {perms.members_add && <button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowModal(true)}>+ Nouveau membre</button>}
      </div>
      <div className="card">
        <table className="data-table">
          <thead><tr><th>MEMBRE</th><th>GRADE</th><th>TÉLÉPHONE</th><th>STATUT</th><th>INTÉGRATION</th>{perms.members_edit&&<th>ACTION</th>}</tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:m.avatarColor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,fontFamily:'var(--font-mono)',color:'#fff',flexShrink:0,position:'relative'}}>
                      {m.avatar}
                      {isOnline(m.id) && <span style={{position:'absolute',bottom:-1,right:-1,width:9,height:9,borderRadius:'50%',background:'var(--accent-green)',border:'2px solid var(--bg-card)'}}></span>}
                    </div>
                    <span style={{color:'var(--text-primary)',fontWeight:600}}>{m.pseudo}</span>
                  </div>
                </td>
                <td><span className={gradeClass(m.grade)} style={{fontSize:12,fontWeight:600}}>{m.grade}</span></td>
                <td><span style={{fontFamily:'var(--font-mono)',fontSize:11}}>{m.phone||'—'}</span></td>
                <td>{isOnline(m.id) ? <span className="badge badge-green">● En ligne</span> : <span className="badge badge-gray">○ Hors ligne</span>}</td>
                <td><span style={{fontSize:11,fontFamily:'var(--font-mono)'}}>{m.joined}</span></td>
                {perms.members_edit && <td><div style={{display:'flex',gap:4}}><button className="btn btn-secondary btn-sm" onClick={()=>setEditModal({...m})}>✏</button>{currentUser.grade==='Heritier'&&m.id!==currentUser.id&&<button className="btn btn-danger btn-sm" onClick={()=>deleteMember(m.id)}>🗑</button>}</div></td>}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {showModal && (
        <Modal title="Nouveau Membre" onClose={()=>setShowModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addMember}>Confirmer</button></>}>
          <div className="form-group"><label className="label">PSEUDO RP</label><input className="input" value={form.pseudo} onChange={e=>setForm({...form,pseudo:e.target.value})} placeholder="Ex: Shadow" /></div>
          <div className="form-group"><label className="label">GRADE</label>
            <select className="select" value={form.grade} onChange={e=>setForm({...form,grade:e.target.value})}>
              {GRADES.map(g=><option key={g}>{g}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">TÉLÉPHONE RP</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Ex: 06 12 34 56 78" /></div>
        </Modal>
      )}

      {editModal && (
        <Modal title={`Modifier — ${editModal.pseudo}`} onClose={()=>setEditModal(null)}
          footer={<><button className="btn btn-secondary" onClick={()=>setEditModal(null)}>Annuler</button><button className="btn btn-primary" onClick={saveMember}>Sauvegarder</button></>}>
          <div className="form-group"><label className="label">PSEUDO RP</label><input className="input" value={editModal.pseudo} onChange={e=>setEditModal({...editModal,pseudo:e.target.value})} /></div>
          <div className="form-group"><label className="label">GRADE</label>
            <select className="select" value={editModal.grade} onChange={e=>setEditModal({...editModal,grade:e.target.value,avatarColor:gradeColor(e.target.value)})}>
              {GRADES.map(g=><option key={g}>{g}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">TÉLÉPHONE RP</label><input className="input" value={editModal.phone||''} onChange={e=>setEditModal({...editModal,phone:e.target.value})} placeholder="Ex: 06 12 34 56 78" /></div>
        </Modal>
      )}
    </div>
  );
}

// ─── WEAPONS ─────────────────────────────────────────────────────────────────
function Weapons({ currentUser, perms }) {
  const [weapons, setWeapons] = useState(() => load(SK.weapons, DEFAULT_WEAPONS));
  const [showModal, setShowModal] = useState(false);
  const members = load(SK.members, DEFAULT_MEMBERS);
  const [form, setForm] = useState({ type:'couteau', status:'disponible', owner:'', serial:'' });

  const typeIcon = t => ({ couteau:'🗡', machette:'🔪', petoire:'🔫', revolver:'🔫', batte:'🏏', hache:'🪓', marteau:'🔨', katana:'⚔', 'pied de biche':'🔧', 'queue de billard':'🎱', 'queue de golf':'🏌', cambu:'🪝' }[t]||'🗡');

  const addWeapon = () => {
    const nw = { id:'w'+Date.now(), type:form.type, owner:form.owner, status:form.status, serial:form.serial };
    const updated = [...weapons, nw];
    setWeapons(updated); save(SK.weapons, updated);
    pushLog('stock', `Arme déclarée: ${form.type}${form.serial?' #'+form.serial:''} par ${currentUser.pseudo}`, 'info');
    setShowModal(false); setForm({ type:'couteau', status:'disponible', owner:'', serial:'' });
  };

  const claimWeapon = id => {
    const updated = weapons.map(w=>w.id===id ? {...w, owner:currentUser.pseudo} : w);
    setWeapons(updated); save(SK.weapons, updated);
    pushLog('transfert', `Arme prise par ${currentUser.pseudo}`, 'warn');
  };

  const deleteWeapon = id => {
    const w = weapons.find(x=>x.id===id);
    const updated = weapons.filter(x=>x.id!==id);
    setWeapons(updated); save(SK.weapons, updated);
    pushLog('suppression', `Arme supprimée: ${w?.type}${w?.serial?' #'+w.serial:''} par ${currentUser.pseudo}`, 'danger');
  };

  return (
    <div className="page-enter">
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        {perms.weapons_add && <button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Déclarer une arme</button>}
      </div>
      <div className="card">
        {weapons.length===0
          ? <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:12,fontFamily:'var(--font-mono)'}}>Aucune arme enregistrée</div>
          : <table className="data-table">
              <thead><tr><th>TYPE</th><th>N° SÉRIE</th><th>DÉTENTEUR</th><th>STATUT</th><th>ACTION</th></tr></thead>
              <tbody>
                {weapons.map(w=>(
                  <tr key={w.id}>
                    <td><div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:16}}>{typeIcon(w.type)}</span><span style={{fontFamily:'var(--font-mono)',fontSize:11,textTransform:'capitalize'}}>{w.type}</span></div></td>
                    <td><span className="mono" style={{fontSize:10,background:'var(--bg-tertiary)',padding:'2px 6px',borderRadius:3,border:'1px solid var(--border)',color:'var(--text-muted)'}}>{w.serial||'—'}</span></td>
                    <td>{w.owner ? <span className={gradeClass(members.find(m=>m.pseudo===w.owner)?.grade||'')} style={{fontWeight:600}}>{w.owner}</span> : <span style={{color:'var(--text-muted)',fontFamily:'var(--font-mono)',fontSize:11}}>— non attribué</span>}</td>
                    <td>{statusBadge(w.status)}</td>
                    <td><div style={{display:'flex',gap:4}}><button className={`btn btn-sm ${w.owner===currentUser.pseudo?'btn-green':'btn-secondary'}`} onClick={()=>claimWeapon(w.id)}>{w.owner===currentUser.pseudo ? '✓ Sur moi' : "→ Je l'ai"}</button>{(currentUser.grade==='Heritier'||currentUser.grade==='Regent')&&<button className="btn btn-danger btn-sm" onClick={()=>deleteWeapon(w.id)}>🗑</button>}</div></td>
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>

      {showModal && (
        <Modal title="Déclarer une Arme" onClose={()=>setShowModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addWeapon}>Enregistrer</button></>}>
          <div className="form-group"><label className="label">TYPE</label>
            <select className="select" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
              {WEAPON_TYPES.map(t=><option key={t} value={t} style={{textTransform:'capitalize'}}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">NUMÉRO DE SÉRIE</label><input className="input" value={form.serial} onChange={e=>setForm({...form,serial:e.target.value})} placeholder="Ex: SN-4892-X" /></div>
          <div className="form-group"><label className="label">DÉTENTEUR</label>
            <select className="select" value={form.owner} onChange={e=>setForm({...form,owner:e.target.value})}>
              <option value="">— Non attribué</option>
              {members.map(m=><option key={m.id} value={m.pseudo}>{m.pseudo}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">STATUT</label>
            <select className="select" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
              <option value="disponible">Disponible</option><option value="perdue">Perdue</option><option value="saisie">Saisie</option>
            </select>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── DEBTS ───────────────────────────────────────────────────────────────────
function Debts({ currentUser, perms }) {
  const [debts, setDebts] = useState(() => load(SK.debts, DEFAULT_DEBTS));
  const [showModal, setShowModal] = useState(false);
  const [showRembModal, setShowRembModal] = useState(null);
  const [tab, setTab] = useState('non-payé');
  const members = load(SK.members, DEFAULT_MEMBERS);
  const [form, setForm] = useState({ debtor:'', amount:'', reason:'', date:'' });
  const [rembAmount, setRembAmount] = useState('');

  const addDebt = () => {
    if(!form.debtor || !form.amount) return;
    const nd = { id:'d'+Date.now(), debtor:form.debtor, amount:parseInt(form.amount), reason:form.reason, date:form.date||fmtDate(), status:'non-payé', paid:0 };
    const updated = [...debts, nd];
    setDebts(updated); save(SK.debts, updated);
    pushLog('modification', `Dette créée: ${form.debtor} — ${fmtMoney(parseInt(form.amount))} par ${currentUser.pseudo}`, 'warn');
    setShowModal(false); setForm({ debtor:'', amount:'', reason:'', date:'' });
  };

  const addRemb = () => {
    const val = parseInt(rembAmount);
    if(!val||val<=0) return;
    const updated = debts.map(d=>{
      if(d.id!==showRembModal) return d;
      const np = Math.min(d.paid+val, d.amount);
      return {...d, paid:np, status: np>=d.amount?'payé':np>0?'partiel':'non-payé'};
    });
    setDebts(updated); save(SK.debts, updated);
    pushLog('modification', `Remboursement de ${fmtMoney(val)} enregistré`, 'info');
    setRembAmount(''); setShowRembModal(null);
  };

  const deleteDebt = id => {
    const d = debts.find(x=>x.id===id);
    const updated = debts.filter(x=>x.id!==id);
    setDebts(updated); save(SK.debts, updated);
    pushLog('suppression', `Dette de ${d?.debtor} supprimée par ${currentUser.pseudo}`, 'danger');
  };

  const totalOwed = debts.filter(d=>d.status!=='payé').reduce((s,d)=>s+d.amount-d.paid,0);
  const tabCounts = { 'non-payé': debts.filter(d=>d.status==='non-payé').length, 'partiel': debts.filter(d=>d.status==='partiel').length, 'payé': debts.filter(d=>d.status==='payé').length };
  const filtered = debts.filter(d=>d.status===tab);

  return (
    <div className="page-enter">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div className="stat-card red" style={{flex:1,padding:12,marginBottom:0}}>
          <div className="stat-label">Total Dettes Actives</div>
          <div className="stat-value" style={{fontSize:18}}>{fmtMoney(totalOwed)}</div>
        </div>
        <div className="stat-card green" style={{flex:1,padding:12,marginBottom:0}}>
          <div className="stat-label">Dettes Soldées</div>
          <div className="stat-value" style={{fontSize:18}}>{tabCounts['payé']}</div>
        </div>
        {perms.debts_manage && <button className="btn btn-primary btn-sm" style={{flexShrink:0}} onClick={()=>setShowModal(true)}>+ Créer dette</button>}
      </div>

      {/* Tabs */}
      <div style={{display:'flex',gap:4,marginBottom:12}}>
        {[{k:'non-payé',label:'Impayées',color:'var(--vmf-accent)'},{k:'partiel',label:'Partielles',color:'var(--gold)'},{k:'payé',label:'Payées',color:'var(--accent-green)'}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)}
            className={`btn btn-sm ${tab===t.k?'btn-primary':'btn-secondary'}`}
            style={tab===t.k?{}:{}}
          >

                    <td style={{fontFamily:'var(--font-mono)',color:d.status!=='payé'?'var(--vmf-accent)':'var(--accent-green)',fontWeight:700}}>{fmtMoney(d.amount)}</td>

                      </div>

          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addDebt}>Créer</button></>}>
          <div className="form-group"><label className="label">MEMBRE DÉBITEUR</label>
            <select className="select" value={form.debtor} onChange={e=>setForm({...form,debtor:e.target.value})}>

          <div className="form-group"><label className="label">MONTANT ($)</label><input type="number" className="input" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} placeholder="Ex: 25000" /></div>
          <div className="form-group"><label className="label">RAISON</label><input className="input" value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} placeholder="Ex: Livraison de matériel" /></div>

      {showRembModal && (()=>{
        const d = debts.find(x=>x.id===showRembModal);
        if(!d) return null;
        return (
          <Modal title="Ajouter un Remboursement" onClose={()=>setShowRembModal(null)}
            footer={<><button className="btn btn-secondary" onClick={()=>setShowRembModal(null)}>Annuler</button><button className="btn btn-primary" onClick={addRemb}>Confirmer</button></>}>
            <div style={{background:'var(--bg-tertiary)',borderRadius:'var(--radius)',padding:'12px',marginBottom:16}}>
              <div style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-muted)',marginBottom:4}}>DETTE DE</div>
              <div style={{fontSize:14,fontWeight:700,color:'var(--text-primary)',marginBottom:8}}>{d.debtor}</div>
              <div style={{display:'flex',gap:20}}>
                <div><div style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>TOTAL DÛ</div><div style={{fontSize:13,fontFamily:'var(--font-mono)',color:'var(--vmf-accent)',fontWeight:700}}>{fmtMoney(d.amount)}</div></div>
                <div><div style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>PAYÉ</div><div style={{fontSize:13,fontFamily:'var(--font-mono)',color:'var(--accent-green)',fontWeight:700}}>{fmtMoney(d.paid)}</div></div>
                <div><div style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>RESTE</div><div style={{fontSize:13,fontFamily:'var(--font-mono)',color:'var(--gold)',fontWeight:700}}>{fmtMoney(d.amount-d.paid)}</div></div>
              </div>
            </div>
            <div className="form-group"><label className="label">MONTANT REMBOURSÉ ($)</label><input type="number" className="input" value={rembAmount} onChange={e=>setRembAmount(e.target.value)} placeholder={`Max: ${fmtMoney(d.amount-d.paid)}`} /></div>
          </Modal>
        );
      })()}
    </div>
  );
}

// ─── VEHICLES ────────────────────────────────────────────────────────────────
function Vehicles({ currentUser, perms }) {
  const [vehicles, setVehicles] = useState(() => load(SK.vehicles, DEFAULT_VEHICLES));
  const [showModal, setShowModal] = useState(false);
  const [selectedUser, setSelectedUser] = useState(currentUser.pseudo);
  const members = load(SK.members, DEFAULT_MEMBERS);
  const [form, setForm] = useState({ model:'', plate:'', state:'Parfait' });
  const stateColor = s => ({ 'Parfait':'var(--accent-green)', 'Bon':'var(--gold)', 'Endommagé':'var(--accent-red)', 'Saisie probable':'#888' }[s]||'var(--text-muted)');

  const addVehicle = () => {
    if(!form.model||!form.plate) return;
    const nv = { id:'v'+Date.now(), model:form.model, plate:form.plate, state:form.state, lastUsedBy:'', usage:[] };
    const updated = [...vehicles, nv];
    setVehicles(updated); save(SK.vehicles, updated);
    pushLog('stock', `Véhicule ajouté: ${form.model} (${form.plate}) par ${currentUser.pseudo}`, 'info');
    setShowModal(false); setForm({ model:'', plate:'', state:'Parfait' });
  };

  const claimVehicle = id => {
    const now = new Date();
    const d = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}`;
    const updated = vehicles.map(v=>v.id!==id?v:{ ...v, lastUsedBy:selectedUser, usage:[...v.usage,`${selectedUser} - ${d}`] });
    setVehicles(updated); save(SK.vehicles, updated);
    pushLog('transfert', `Véhicule utilisé par ${selectedUser}`, 'info');
  };

  const deleteVehicle = id => {
    const v = vehicles.find(x=>x.id===id);
    const updated = vehicles.filter(x=>x.id!==id);
    setVehicles(updated); save(SK.vehicles, updated);
    pushLog('suppression', `Véhicule supprimé: ${v?.model} (${v?.plate}) par ${currentUser.pseudo}`, 'danger');
  };

  return (
    <div className="page-enter">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label className="label" style={{marginBottom:0,whiteSpace:'nowrap'}}>DÉCLARER POUR :</label>
          <select className="select" style={{width:180}} value={selectedUser} onChange={e=>setSelectedUser(e.target.value)}>
            {members.map(m=><option key={m.id} value={m.pseudo}>{m.pseudo}</option>)}
          </select>
        </div>
        {currentUser.grade==='Heritier' && <button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>setShowModal(true)}>+ Ajouter véhicule</button>}
      </div>
      <div className="card">
        {vehicles.length===0
          ? <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:12,fontFamily:'var(--font-mono)'}}>Aucun véhicule enregistré</div>
          : <table className="data-table">
              <thead><tr><th>MODÈLE</th><th>PLAQUE</th><th>ÉTAT</th><th>DERNIER USAGE</th><th>ACTION</th></tr></thead>
              <tbody>
                {vehicles.map(v=>(
                  <tr key={v.id}>
                    <td style={{color:'var(--text-primary)',fontWeight:600}}>{v.model}</td>
                    <td><span className="mono" style={{fontSize:10,background:'var(--bg-tertiary)',padding:'2px 6px',borderRadius:3,border:'1px solid var(--border)'}}>{v.plate}</span></td>
                    <td><span style={{fontSize:11,color:stateColor(v.state),fontWeight:600}}>{v.state}</span></td>
                    <td style={{fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{v.usage.length>0 ? v.usage[v.usage.length-1] : '—'}</td>
                    <td><div style={{display:'flex',gap:4}}><button className={`btn btn-sm ${v.lastUsedBy===selectedUser?'btn-green':'btn-secondary'}`} onClick={()=>claimVehicle(v.id)}>{v.lastUsedBy===selectedUser ? `✓ ${selectedUser}` : `→ ${selectedUser} l'utilise`}</button>{currentUser.grade==='Heritier'&&<button className="btn btn-danger btn-sm" onClick={()=>deleteVehicle(v.id)}>🗑</button>}</div></td>
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>

      {showModal && (
        <Modal title="Ajouter un Véhicule" onClose={()=>setShowModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addVehicle}>Enregistrer</button></>}>
          <div className="form-group"><label className="label">MODÈLE</label><input className="input" value={form.model} onChange={e=>setForm({...form,model:e.target.value})} placeholder="Ex: Sultan RS" /></div>
          <div className="form-group"><label className="label">PLAQUE</label><input className="input" value={form.plate} onChange={e=>setForm({...form,plate:e.target.value})} placeholder="Ex: VMF-01" /></div>
          <div className="form-group"><label className="label">ÉTAT</label>
            <select className="select" value={form.state} onChange={e=>setForm({...form,state:e.target.value})}>
              {['Parfait','Bon','Endommagé','Saisie probable'].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── CHAT ────────────────────────────────────────────────────────────────────
function Chat({ currentUser }) {
  const [messages, setMessages] = useState(() => load(SK.messages, DEFAULT_MESSAGES));
  const [input, setInput] = useState('');
  const [onlineIds, setOnlineIds] = useState(getOnlineUserIds());
  const messagesEndRef = useRef(null);
  const members = load(SK.members, DEFAULT_MEMBERS);
  const accounts = load(SK.users, DEFAULT_ACCOUNTS);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  useEffect(() => {
    const t = setInterval(() => {
      setMessages(load(SK.messages, DEFAULT_MESSAGES));
      setOnlineIds(getOnlineUserIds());
    }, 2000);
    return () => clearInterval(t);
  }, []);

  const send = () => {
    if (!input.trim()) return;

    const msg = {
      id: 'msg' + Date.now(),
      userId: currentUser.id,
      pseudo: currentUser.pseudo,
      content: input.trim(),
      time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
      avatar: currentUser.avatar,
      color: currentUser.avatarColor
    };

    const updated = [...load(SK.messages, DEFAULT_MESSAGES), msg];
    save(SK.messages, updated);
    setMessages(updated);
    setInput('');
  };

  const onlineMembers = accounts
    .filter(a => onlineIds.includes(a.id))
    .map(a => members.find(m => m.id === a.memberId))
    .filter(Boolean);

  return (
    <div className="page-enter" style={{ height: 'calc(100vh - var(--topbar-h) - 40px)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, display: 'flex', minHeight: 0, background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', overflow: 'hidden' }}>
        
        <div className="chat-main">

          {/* HEADER */}
          <div style={{ padding: '10px 16px', borderBottom: '1px solid var(--border)', background: 'var(--bg-tertiary)', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--accent-red)' }}></span>
            <span style={{ fontSize: 13, fontWeight: 700 }}># canal général</span>

            <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
              {onlineMembers.slice(0, 5).map(m => (
                <div key={m.id} style={{
                  width: 20,
                  height: 20,
                  borderRadius: '50%',
                  background: m.avatarColor,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: 9,
                  color: '#fff'
                }}>
                  {m.avatar}
                </div>
              ))}
            </div>
          </div>

          {/* MESSAGES */}
          <div className="chat-messages">

            {messages.length === 0 && (
              <div style={{
                textAlign: 'center',
                color: 'var(--text-muted)',
                fontSize: 12,
                padding: '20px 0'
              }}>
                Aucun message
              </div>
            )}

            {messages.map(m => (
              <div key={m.id} className={`chat-msg ${m.userId === currentUser.id ? 'mine' : 'theirs'}`}>
                <div className="chat-msg-bubble">{m.content}</div>
                <div className="chat-msg-meta">
                  {m.pseudo} • {m.time}
                </div>
              </div>
            ))}

            <div ref={messagesEndRef} />

          </div>

          {/* INPUT */}
          <div className="chat-input-area">
            <div className="chat-input-row">
              <input
                className="chat-input"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && send()}
                placeholder="Message..."
              />
              <button className="chat-send-btn" onClick={send}>
                Envoyer
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}
