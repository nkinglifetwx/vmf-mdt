// ─── ANNOUNCEMENTS ───────────────────────────────────────────────────────────
function Announcements({ currentUser, perms }) {
  const [anns, setAnns] = useState(() => load(SK.announcements, DEFAULT_ANNOUNCEMENTS));
  const [showModal, setShowModal] = useState(false);
  const [editModal, setEditModal] = useState(null);
  const [form, setForm] = useState({ title:'', content:'', priority:'medium' });

  const addAnn = () => {
    if(!form.title||!form.content) return;
    const na = { id:'a'+Date.now(), ...form, author:currentUser.pseudo, date:fmtDate() };
    const updated = [na, ...anns];
    setAnns(updated); save(SK.announcements, updated);
    pushLog('modification', `Annonce publiée: "${form.title}" par ${currentUser.pseudo}`, 'info');
    setShowModal(false); setForm({ title:'', content:'', priority:'medium' });
  };

  const saveEdit = () => {
    if(!editModal) return;
    const updated = anns.map(a => a.id===editModal.id ? {...editModal} : a);
    setAnns(updated); save(SK.announcements, updated);
    setEditModal(null);
  };

  const deleteAnn = id => {
    const updated = anns.filter(a => a.id !== id);
    setAnns(updated); save(SK.announcements, updated);
    pushLog('suppression', `Annonce supprimée par ${currentUser.pseudo}`, 'warn');
  };

  const canManageAnn = a => currentUser.grade==='Heritier' || a.author===currentUser.pseudo;

  return (
    <div className="page-enter">
      {perms.announcements_post && <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}><button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Nouvelle annonce</button></div>}
      {anns.length===0 && <div style={{textAlign:'center',color:'var(--text-muted)',fontSize:12,fontFamily:'var(--font-mono)',padding:'40px 0'}}>Aucune annonce publiée</div>}
      {anns.map(a=>(
        <div className={`announcement ${a.priority}`} key={a.id}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div className="ann-title">{a.title}</div>
            <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
              <span className={`badge badge-${a.priority==='high'?'red':a.priority==='medium'?'gold':'gray'}`}>{a.priority==='high'?'URGENT':a.priority==='medium'?'IMPORTANT':'INFO'}</span>
              {canManageAnn(a) && <>
                <button className="btn btn-secondary btn-sm" onClick={()=>setEditModal({...a})}>✏</button>
                <button className="btn btn-danger btn-sm" onClick={()=>deleteAnn(a.id)}>🗑</button>
              </>}
            </div>
          </div>
          <div className="ann-body" style={{marginTop:8}}>{a.content}</div>
          <div className="ann-meta"><span>{a.author}</span><span>{a.date}</span></div>
        </div>
      ))}

      {showModal && (
        <Modal title="Nouvelle Annonce" onClose={()=>setShowModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addAnn}>Publier</button></>}>
          <div className="form-group"><label className="label">TITRE</label><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} /></div>
          <div className="form-group"><label className="label">PRIORITÉ</label>
            <select className="select" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
              <option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option>
            </select>
          </div>
          <div className="form-group"><label className="label">CONTENU</label><textarea className="input" rows={5} value={form.content} onChange={e=>setForm({...form,content:e.target.value})} style={{resize:'none'}} /></div>
        </Modal>
      )}

      {editModal && (
        <Modal title="Modifier l'Annonce" onClose={()=>setEditModal(null)}
          footer={<><button className="btn btn-secondary" onClick={()=>setEditModal(null)}>Annuler</button><button className="btn btn-primary" onClick={saveEdit}>Sauvegarder</button></>}>
          <div className="form-group"><label className="label">TITRE</label><input className="input" value={editModal.title} onChange={e=>setEditModal({...editModal,title:e.target.value})} /></div>
          <div className="form-group"><label className="label">PRIORITÉ</label>
            <select className="select" value={editModal.priority} onChange={e=>setEditModal({...editModal,priority:e.target.value})}>
              <option value="high">Urgent</option><option value="medium">Important</option><option value="low">Information</option>
            </select>
          </div>
          <div className="form-group"><label className="label">CONTENU</label><textarea className="input" rows={5} value={editModal.content} onChange={e=>setEditModal({...editModal,content:e.target.value})} style={{resize:'none'}} /></div>
        </Modal>
      )}
    </div>
  );
}

// ─── LOGS ────────────────────────────────────────────────────────────────────
function Logs({ currentUser, perms }) {
  const [logs, setLogs] = useState(() => load(SK.logs, DEFAULT_LOGS));
  const [filter, setFilter] = useState('all');

  useEffect(() => {
    const t = setInterval(() => setLogs(load(SK.logs, DEFAULT_LOGS)), 3000);
    return () => clearInterval(t);
  }, []);

  if(!perms.logs_view) {
    return (
      <div className="page-enter" style={{display:'flex',alignItems:'center',justifyContent:'center',height:300}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:16}}>🔒</div>
          <div style={{fontSize:16,fontWeight:700,color:'var(--text-primary)',marginBottom:8}}>Accès Refusé</div>
          <div style={{fontSize:12,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>Logs réservés selon vos permissions</div>
          <div style={{marginTop:16}}><span className="badge badge-red">GRADE INSUFFISANT</span></div>
        </div>
      </div>
    );
  }

  const typeIcon = t => ({ connexion:'🔑', transfert:'🔁', modification:'✏️', suppression:'🗑️', stock:'📦' }[t]||'•');
  const filtered = filter==='all' ? logs : logs.filter(l=>l.level===filter);

  const clearLogs = () => { save(SK.logs,[]); setLogs([]); };

  return (
    <div className="page-enter">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{background:'var(--vmf-accent-glow)',border:'1px solid rgba(192,57,43,0.3)',borderRadius:'var(--radius)',padding:'8px 14px',fontSize:11,fontFamily:'var(--font-mono)',color:'var(--accent-red)',display:'flex',gap:8,flex:1}}>
          <span>⚠</span><span>ACCÈS RESTREINT — Journaux confidentiels</span>
        </div>
        <div style={{display:'flex',gap:6}}>
          {['all','info','warn','danger'].map(f=>(
            <button key={f} className={`btn btn-secondary btn-sm ${filter===f?'btn-primary':''}`} onClick={()=>setFilter(f)}>{f==='all'?'Tout':f.toUpperCase()}</button>
          ))}
        </div>
        {currentUser.grade==='Heritier' && <button className="btn btn-danger btn-sm" onClick={clearLogs}>Effacer</button>}
      </div>
      <div className="card">
        <div className="card-header"><span className="card-title">📋 Journaux Système</span><span className="card-subtitle">{filtered.length} entrées</span></div>
        {filtered.length===0
          ? <div style={{padding:30,textAlign:'center',color:'var(--text-muted)',fontSize:11,fontFamily:'var(--font-mono)'}}>Aucune entrée</div>
          : filtered.map(l=>(
            <div key={l.id} className="log-entry">
              <span className="log-time">{l.date} {l.time}</span>
              <span className="log-icon">{typeIcon(l.type)}</span>
              <span className="log-msg">{l.msg}</span>
              <span className={`log-level log-${l.level}`}>{l.level}</span>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ─── PERMISSIONS ─────────────────────────────────────────────────────────────
function Permissions({ currentUser }) {
  const [perms, setPerms] = useState(() => load(SK.permissions, DEFAULT_PERMISSIONS));

  const toggle = (grade, perm) => {
    const updated = { ...perms, [grade]: { ...perms[grade], [perm]: !perms[grade][perm] } };
    setPerms(updated); save(SK.permissions, updated);
    pushLog('modification', `Permission "${perm}" pour ${grade} modifiée par ${currentUser.pseudo}`, 'warn');
  };

  const reset = () => { setPerms(DEFAULT_PERMISSIONS); save(SK.permissions, DEFAULT_PERMISSIONS); };

  if(currentUser.grade!=='Heritier') {
    return (
      <div className="page-enter" style={{display:'flex',alignItems:'center',justifyContent:'center',height:300}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:16}}>🔒</div>
          <div style={{fontSize:16,fontWeight:700,color:'var(--text-primary)',marginBottom:8}}>Accès Refusé</div>
          <div style={{fontSize:12,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>Configuration des permissions réservée à l'Héritier</div>
        </div>
      </div>
    );
  }

  return (
    <div className="page-enter">
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        <button className="btn btn-secondary btn-sm" onClick={reset}>↺ Réinitialiser</button>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        <table className="perm-table">
          <thead>
            <tr>
              <th style={{minWidth:200}}>PERMISSION</th>
              {GRADES.map(g=><th key={g} style={{textAlign:'center'}}><span className={gradeClass(g)}>{g}</span></th>)}
            </tr>
          </thead>
          <tbody>
            {Object.entries(PERM_LABELS).map(([key, label])=>(
              <tr key={key}>
                <td style={{color:'var(--text-secondary)',fontSize:12}}>{label}</td>
                {GRADES.map(g=>(
                  <td key={g} style={{textAlign:'center'}}>
                    {g==='Heritier'
                      ? <span title="Toujours actif" style={{fontSize:16}}>✅</span>
                      : <button
                          className={`perm-toggle ${perms[g]?.[key]?'on':'off'}`}
                          onClick={()=>toggle(g,key)}
                          title={perms[g]?.[key]?'Actif — cliquer pour désactiver':'Inactif — cliquer pour activer'}
                        />
                    }
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── ACCOUNT MANAGEMENT (Héritier only) ──────────────────────────────────────
function AccountManager({ currentUser }) {
  const [accounts, setAccounts] = useState(() => load(SK.users, DEFAULT_ACCOUNTS));
  const members = load(SK.members, DEFAULT_MEMBERS);
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ memberId:'', username:'', password:'' });
  const [showPassFor, setShowPassFor] = useState(null);

  if(currentUser.grade!=='Heritier') {
    return (
      <div className="page-enter" style={{display:'flex',alignItems:'center',justifyContent:'center',height:300}}>
        <div style={{textAlign:'center'}}><div style={{fontSize:40,marginBottom:16}}>🔒</div><div style={{fontSize:16,fontWeight:700}}>Accès Réservé à l'Héritier</div></div>
      </div>
    );
  }

  const createAccount = () => {
    if(!form.memberId||!form.username||!form.password) return;
    if(accounts.find(a=>a.username===form.username)) { alert('Identifiant déjà utilisé'); return; }
    const na = { id:'u'+Date.now(), username:form.username, password:form.password, memberId:form.memberId };
    const updated = [...accounts, na];
    setAccounts(updated); save(SK.users, updated);
    pushLog('connexion', `Nouveau compte créé: ${form.username} par ${currentUser.pseudo}`, 'info');
    setShowModal(false); setForm({ memberId:'', username:'', password:'' });
  };

  const deleteAccount = id => {
    if(id===currentUser.id) { alert('Impossible de supprimer votre propre compte.'); return; }
    const updated = accounts.filter(a=>a.id!==id);
    setAccounts(updated); save(SK.users, updated);
    removeSession(id);
    pushLog('suppression', `Compte supprimé par ${currentUser.pseudo}`, 'danger');
  };

  const memberWithoutAccount = members.filter(m=>!accounts.find(a=>a.memberId===m.id));

  return (
    <div className="page-enter">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
        <div style={{background:'var(--gold-dim)',border:'1px solid rgba(201,168,76,0.3)',borderRadius:'var(--radius)',padding:'8px 14px',fontSize:11,fontFamily:'var(--font-mono)',color:'var(--gold)',flex:1}}>
          👑 Seul l'Héritier peut créer des comptes. Partagez les identifiants en privé.
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Créer un compte</button>
      </div>
      <div className="card">
        <table className="data-table">
          <thead><tr><th>IDENTIFIANT</th><th>MEMBRE LIÉ</th><th>MOT DE PASSE</th><th>ACTION</th></tr></thead>
          <tbody>
            {accounts.map(a=>{
              const member = members.find(m=>m.id===a.memberId);
              return (
                <tr key={a.id}>
                  <td style={{color:'var(--text-primary)',fontWeight:600,fontFamily:'var(--font-mono)'}}>{a.username}</td>
                  <td>{member ? <span className={gradeClass(member.grade)} style={{fontWeight:600}}>{member.pseudo} — {member.grade}</span> : <span style={{color:'var(--accent-red)'}}>Membre introuvable</span>}</td>
                  <td>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:12}}>{showPassFor===a.id ? a.password : '••••••••'}</span>
                      <button className="btn btn-secondary btn-sm" onClick={()=>setShowPassFor(showPassFor===a.id?null:a.id)}>{showPassFor===a.id?'🙈':'👁'}</button>
                    </div>
                  </td>
                  <td>
                    {a.id!==currentUser.id && <button className="btn btn-danger btn-sm" onClick={()=>deleteAccount(a.id)}>🗑 Supprimer</button>}
                    {a.id===currentUser.id && <span style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>Vous</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {showModal && (
        <Modal title="Créer un Compte" onClose={()=>setShowModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Annuler</button><button className="btn btn-primary" onClick={createAccount}>Créer</button></>}>
          <div className="form-group"><label className="label">MEMBRE À LIER</label>
            <select className="select" value={form.memberId} onChange={e=>setForm({...form,memberId:e.target.value})}>
              <option value="">Sélectionner un membre...</option>
              {members.map(m=>(
                <option key={m.id} value={m.id} disabled={!!accounts.find(a=>a.memberId===m.id)}>
                  {m.pseudo} — {m.grade}{accounts.find(a=>a.memberId===m.id)?' (compte existant)':''}
                </option>
              ))}
            </select>
          </div>
          <div className="form-group"><label className="label">IDENTIFIANT DE CONNEXION</label><input className="input" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="Ex: ghost_nexus" autoComplete="off" /></div>
          <div className="form-group"><label className="label">MOT DE PASSE</label><input type="text" className="input" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Définissez un mot de passe fort" autoComplete="off" /></div>
          <div style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)',background:'var(--bg-tertiary)',padding:'8px 12px',borderRadius:'var(--radius)'}}>⚠ Partagez ces identifiants de façon sécurisée au membre concerné.</div>
        </Modal>
      )}
    </div>
  );
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const ITEM_CATEGORIES = ['Arme','Drogue','Argent','Matériel','Véhicule','Document','Autre'];
const DEFAULT_STORAGE = {
  warehouses: [
    { id:'wh1', name:'Entrepôt Principal', zone:'Cypress Flats', capacity:100, color:'#c0392b' },
    { id:'wh2', name:'Planque Nord', zone:'Paleto Bay', capacity:50, color:'#c9a84c' },
  ],
  items: []
};

function Storage({ currentUser, perms }) {
  const [data, setData] = useState(() => load(SK.storage, DEFAULT_STORAGE));
  const [selectedWh, setSelectedWh] = useState(null);
  const [showWhModal, setShowWhModal] = useState(false);
  const [showItemModal, setShowItemModal] = useState(false);
  const [whForm, setWhForm] = useState({ name:'', zone:'', capacity:50 });
  const [itemForm, setItemForm] = useState({ name:'', category:'Matériel', qty:1, warehouseId:'', note:'' });
  const [filter, setFilter] = useState('all');

  const saveData = (d) => { setData(d); save(SK.storage, d); };

  const addWarehouse = () => {
    if(!whForm.name) return;
    const colors = ['#c0392b','#c9a84c','#00d084','#60a5fa','#a78bfa'];
    const nw = { id:'wh'+Date.now(), name:whForm.name, zone:whForm.zone, capacity:Number(whForm.capacity)||50, color:colors[data.warehouses.length%colors.length] };
    const d = { ...data, warehouses:[...data.warehouses, nw] };
    saveData(d);
    pushLog('stock', `Entrepôt créé: ${whForm.name} par ${currentUser.pseudo}`, 'info');
    setShowWhModal(false); setWhForm({ name:'', zone:'', capacity:50 });
  };

  const deleteWarehouse = (id) => {
    const d = { warehouses: data.warehouses.filter(w=>w.id!==id), items: data.items.filter(i=>i.warehouseId!==id) };
    saveData(d);
    if(selectedWh===id) setSelectedWh(null);
  };

  const addItem = () => {
    if(!itemForm.name||!itemForm.warehouseId) return;
    const ni = { id:'item'+Date.now(), name:itemForm.name, category:itemForm.category, qty:Number(itemForm.qty)||1, warehouseId:itemForm.warehouseId, note:itemForm.note, addedBy:currentUser.pseudo, date:fmtDate() };
    const d = { ...data, items:[...data.items, ni] };
    saveData(d);
    pushLog('stock', `Objet ajouté: ${ni.qty}x ${ni.name} (${ni.category}) par ${currentUser.pseudo}`, 'info');
    setShowItemModal(false); setItemForm({ name:'', category:'Matériel', qty:1, warehouseId:'', note:'' });
  };

  const deleteItem = (id) => {
    const item = data.items.find(i=>i.id===id);
    const d = { ...data, items: data.items.filter(i=>i.id!==id) };
    saveData(d);
    pushLog('stock', `Objet retiré: ${item?.name} par ${currentUser.pseudo}`, 'warn');
  };

  const catColor = c => ({ 'Arme':'#c0392b','Drogue':'#00d084','Argent':'#c9a84c','Matériel':'#60a5fa','Véhicule':'#a78bfa','Document':'#7a90a8','Autre':'#3d5470' }[c]||'#3d5470');
  const catIcon = c => ({ 'Arme':'🗡','Drogue':'💊','Argent':'💰','Matériel':'🔧','Véhicule':'🚗','Document':'📄','Autre':'📦' }[c]||'📦');

  const visibleItems = data.items.filter(i => {
    if(selectedWh && i.warehouseId!==selectedWh) return false;
    if(filter!=='all' && i.category!==filter) return false;
    return true;
  });

  const getWhName = id => data.warehouses.find(w=>w.id===id)?.name || '?';
  const getWhUsage = id => data.items.filter(i=>i.warehouseId===id).reduce((s,i)=>s+i.qty,0);
  const totalItems = data.items.length;
  const totalQty = data.items.reduce((s,i)=>s+i.qty,0);

  return (
    <div className="page-enter">
      {/* Stats */}
      <div className="stats-grid" style={{marginBottom:16}}>
        <div className="stat-card green">
          <div className="stat-label">Entrepôts</div>
          <div className="stat-value">{data.warehouses.length}</div>
          <div className="stat-sub">Actifs</div>
          <span className="stat-icon">🏭</span>
        </div>
        <div className="stat-card gold">
          <div className="stat-label">Références</div>
          <div className="stat-value">{totalItems}</div>
          <div className="stat-sub">{totalQty} unités au total</div>
          <span className="stat-icon">📦</span>
        </div>
        <div className="stat-card red">
          <div className="stat-label">Capacité Totale</div>
          <div className="stat-value">{data.warehouses.reduce((s,w)=>s+w.capacity,0)}</div>
          <div className="stat-sub">unités max</div>
          <span className="stat-icon">📊</span>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:16,alignItems:'start'}}>
        {/* Liste entrepôts */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--text-muted)',letterSpacing:'0.1em'}}>ENTREPÔTS</span>
            {currentUser.grade==='Heritier' && <button className="btn btn-primary btn-sm" onClick={()=>setShowWhModal(true)}>+ Nouveau</button>}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div onClick={()=>setSelectedWh(null)}
              style={{background:'var(--bg-card)',border:`1px solid ${!selectedWh?'var(--accent-red)':'var(--border)'}`,borderRadius:'var(--radius)',padding:'10px 12px',cursor:'pointer',transition:'border-color 0.15s'}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-primary)'}}>🏭 Tous les entrepôts</div>
              <div style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)',marginTop:2}}>{totalItems} références · {totalQty} unités</div>
            </div>
            {data.warehouses.map(wh=>{
              const usage = getWhUsage(wh.id);
              const pct = Math.min(100, Math.round((usage/wh.capacity)*100));
              return (
                <div key={wh.id} onClick={()=>setSelectedWh(wh.id)}
                  style={{background:'var(--bg-card)',border:`1px solid ${selectedWh===wh.id?wh.color+'88':'var(--border)'}`,borderLeft:`3px solid ${wh.color}`,borderRadius:'var(--radius)',padding:'10px 12px',cursor:'pointer',transition:'all 0.15s'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color:'var(--text-primary)'}}>{wh.name}</div>
                      <div style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)',marginTop:1}}>{wh.zone}</div>
                    </div>
                    {currentUser.grade==='Heritier' && <button className="btn btn-danger btn-sm" style={{padding:'2px 6px',fontSize:10}} onClick={e=>{e.stopPropagation();deleteWarehouse(wh.id);}}>🗑</button>}
                  </div>
                  <div style={{marginTop:8}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)',marginBottom:4}}>
                      <span>{usage} unités</span><span>{pct}% ({wh.capacity} max)</span>
                    </div>
                    <div className="progress-bar">
                      <div className="progress-fill" style={{width:`${pct}%`,background:pct>80?'var(--accent-red)':pct>50?'var(--gold)':'var(--accent-green)'}}></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Contenu entrepôt */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:6}}>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {['all',...ITEM_CATEGORIES].map(c=>(
                <button key={c} className={`btn btn-secondary btn-sm ${filter===c?'btn-primary':''}`} style={{fontSize:10}} onClick={()=>setFilter(c)}>
                  {c==='all'?'Tout':c}
                </button>
              ))}
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>{setItemForm({name:'',category:'Matériel',qty:1,warehouseId:selectedWh||data.warehouses[0]?.id||'',note:''});setShowItemModal(true);}}>+ Ajouter un objet</button>
          </div>

          <div className="card">
            {visibleItems.length===0 ? (
              <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:12,fontFamily:'var(--font-mono)'}}>
                <div style={{fontSize:24,marginBottom:8}}>📦</div>
                Aucun objet{selectedWh?' dans cet entrepôt':''}{filter!=='all'?' dans cette catégorie':''}
              </div>
            ) : (
              <table className="data-table">
                <thead><tr><th>OBJET</th><th>CATÉGORIE</th><th>QTÉ</th>{!selectedWh&&<th>ENTREPÔT</th>}<th>AJOUTÉ PAR</th><th>DATE</th><th>NOTE</th><th>ACTION</th></tr></thead>
                <tbody>
                  {visibleItems.map(item=>(
                    <tr key={item.id}>
                      <td style={{color:'var(--text-primary)',fontWeight:600}}>
                        <span style={{marginRight:6}}>{catIcon(item.category)}</span>{item.name}
                      </td>
                      <td><span style={{fontSize:9,fontFamily:'var(--font-mono)',fontWeight:700,color:catColor(item.category),background:`${catColor(item.category)}22`,padding:'2px 7px',borderRadius:3}}>{item.category}</span></td>
                      <td><span className="mono" style={{fontSize:13,fontWeight:700,color:'var(--text-primary)'}}>{item.qty}</span></td>
                      {!selectedWh&&<td style={{fontSize:11}}>{getWhName(item.warehouseId)}</td>}
                      <td style={{fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{item.addedBy}</td>
                      <td style={{fontSize:10,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{item.date}</td>
                      <td style={{fontSize:11,color:'var(--text-secondary)',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.note||'—'}</td>
                      <td><button className="btn btn-danger btn-sm" onClick={()=>deleteItem(item.id)}>Retirer</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      </div>

      {/* Modal nouvel entrepôt */}
      {showWhModal && (
        <Modal title="🏭 Nouvel Entrepôt" onClose={()=>setShowWhModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowWhModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addWarehouse}>Créer</button></>}>
          <div className="form-group"><label className="label">NOM DE L'ENTREPÔT</label><input className="input" value={whForm.name} onChange={e=>setWhForm({...whForm,name:e.target.value})} placeholder="Ex: Entrepôt Sud" autoFocus /></div>
          <div className="form-group"><label className="label">ZONE / ADRESSE</label><input className="input" value={whForm.zone} onChange={e=>setWhForm({...whForm,zone:e.target.value})} placeholder="Ex: La Mesa" /></div>
          <div className="form-group"><label className="label">CAPACITÉ (unités)</label><input type="number" className="input" value={whForm.capacity} onChange={e=>setWhForm({...whForm,capacity:e.target.value})} placeholder="50" /></div>
        </Modal>
      )}

      {/* Modal ajouter objet */}
      {showItemModal && (
        <Modal title="📦 Ajouter un Objet" onClose={()=>setShowItemModal(false)}
          footer={<><button className="btn btn-secondary" onClick={()=>setShowItemModal(false)}>Annuler</button><button className="btn btn-primary" onClick={addItem}>Enregistrer</button></>}>
          <div className="form-group"><label className="label">ENTREPÔT</label>
            <select className="select" value={itemForm.warehouseId} onChange={e=>setItemForm({...itemForm,warehouseId:e.target.value})}>
              <option value="">Sélectionner un entrepôt...</option>
              {data.warehouses.map(w=><option key={w.id} value={w.id}>{w.name} ({w.zone})</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">NOM DE L'OBJET</label><input className="input" value={itemForm.name} onChange={e=>setItemForm({...itemForm,name:e.target.value})} placeholder="Ex: Pistolet 50" autoFocus /></div>
          <div className="form-group"><label className="label">CATÉGORIE</label>
            <select className="select" value={itemForm.category} onChange={e=>setItemForm({...itemForm,category:e.target.value})}>
              {ITEM_CATEGORIES.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">QUANTITÉ</label><input type="number" className="input" min="1" value={itemForm.qty} onChange={e=>setItemForm({...itemForm,qty:e.target.value})} /></div>
          <div className="form-group"><label className="label">NOTE (optionnel)</label><input className="input" value={itemForm.note} onChange={e=>setItemForm({...itemForm,note:e.target.value})} placeholder="Ex: Confisqué lors d'une opération" /></div>
        </Modal>
      )}
    </div>
  );
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const login = () => {
    setLoading(true); setError('');
    setTimeout(()=>{
      const accounts = load(SK.users, DEFAULT_ACCOUNTS);
      const account = accounts.find(a => a.username===username && a.password===password);
      if(account) {
        const members = load(SK.members, DEFAULT_MEMBERS);
        const member = members.find(m => m.id===account.memberId);
        if(member) {
          addSession(account.id);
          pushLog('connexion', `${member.pseudo} connecté`, 'info');
          onLogin({ ...member, accountId: account.id });
        } else {
          setError('Membre introuvable. Contactez l\'Héritier.'); setLoading(false);
        }
      } else {
        setError('Identifiants incorrects. Accès refusé.'); setLoading(false);
      }
    }, 600);
  };

  return (
    <div className="login-screen">
      <div className="login-bg"></div>
      <div className="login-lines"></div>
      <div style={{position:'absolute',top:0,left:0,right:0,height:2,background:'linear-gradient(to right,transparent,var(--accent-red),transparent)'}}></div>
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-icon">V</div>
          <div className="login-title">VMF</div>
          <div className="login-sub">RÉSEAU PRIVÉ SÉCURISÉ // v3.0.0</div>
        </div>
        <div className="login-warning"><span>⚠</span><span>ACCÈS RÉSERVÉ — Toute tentative non autorisée sera enregistrée.</span></div>
        <div className="login-form">
          <div><label className="label">IDENTIFIANT</label><input className="input" placeholder="Identifiant de connexion" value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} autoComplete="off" /></div>
          <div><label className="label">MOT DE PASSE</label><input className="input" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} autoComplete="off" /></div>
          <div className="login-err">{error}</div>
          <button className="login-btn" onClick={login} disabled={loading}>{loading?'█ AUTHENTIFICATION...':'→ ACCÉDER AU RÉSEAU'}</button>
        </div>
        <div style={{textAlign:'center',marginTop:20}}>
          <div className="secure-badge" style={{justifyContent:'center'}}>
            <span className="secure-dot"></span>
            <span style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)',letterSpacing:'0.15em'}}>COMPTES GÉRÉS PAR L'HÉRITIER UNIQUEMENT</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── NAV CONFIG ──────────────────────────────────────────────────────────────
const NAV = [
  { section:'Général', items:[
    { id:'dashboard', icon:'⬡', label:'Dashboard' },
    { id:'announcements', icon:'📢', label:'Annonces' },
    { id:'chat', icon:'💬', label:'Messagerie' },
    { id:'map', icon:'🗺', label:'Carte' },
  ]},
  { section:'Gestion', items:[
    { id:'members', icon:'👥', label:'Membres' },
    { id:'weapons', icon:'🗡', label:'Armes' },
    { id:'debts', icon:'💰', label:'Dettes' },
    { id:'vehicles', icon:'🚗', label:'Véhicules' },
    { id:'storage', icon:'🏭', label:'Stockage' },
  ]},
  { section:'Administration', items:[
    { id:'logs', icon:'📋', label:'Logs Privés' },
    { id:'permissions', icon:'🛡', label:'Permissions' },
    { id:'accounts', icon:'🔑', label:'Comptes' },
  ]},
];

const PAGE_NAMES = { dashboard:'Dashboard', members:'Membres', weapons:'Armes', debts:'Dettes', vehicles:'Véhicules', chat:'Messagerie', map:'Carte', announcements:'Annonces', logs:'Logs Privés', permissions:'Permissions', accounts:'Gestion Comptes', storage:'Stockage' };

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [notifOpen, setNotifOpen] = useState(false);

  const perms = React.useMemo(() => {
    if(!currentUser) return {};
    const stored = load(SK.permissions, DEFAULT_PERMISSIONS);
    return stored[currentUser.grade] || DEFAULT_PERMISSIONS[currentUser.grade] || {};
  }, [currentUser, page]);

  const logout = () => {
    if(currentUser) {
      removeSession(currentUser.accountId);
      pushLog('connexion', `${currentUser.pseudo} déconnecté`, 'info');
    }
    setCurrentUser(null);
  };

  if(!currentUser) return <LoginScreen onLogin={setCurrentUser} />;

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <Dashboard currentUser={currentUser} />;
      case 'members': return <Members currentUser={currentUser} perms={perms} />;
      case 'weapons': return <Weapons currentUser={currentUser} perms={perms} />;
      case 'debts': return <Debts currentUser={currentUser} perms={perms} />;
      case 'vehicles': return <Vehicles currentUser={currentUser} perms={perms} />;
      case 'chat': return <Chat currentUser={currentUser} />;
      case 'map': return <MapPage />;
      case 'announcements': return <Announcements currentUser={currentUser} perms={perms} />;
      case 'logs': return <Logs currentUser={currentUser} perms={perms} />;
      case 'permissions': return <Permissions currentUser={currentUser} />;
      case 'accounts': return <AccountManager currentUser={currentUser} />;
      case 'storage': return <Storage currentUser={currentUser} perms={perms} />;
      default: return <Dashboard currentUser={currentUser} />;
    }
  };

  return (
    <div className="app-layout" onClick={()=>notifOpen&&setNotifOpen(false)}>
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-mark">
            <div className="logo-icon">N</div>
            <div><div className="logo-text">VMF</div><div className="logo-sub">réseau privé</div></div>
          </div>
        </div>
        <div className="sidebar-user">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="user-avatar" style={{background:currentUser.avatarColor}}>
              <span style={{fontSize:12,fontWeight:700,fontFamily:'var(--font-mono)',color:'#fff'}}>{currentUser.avatar}</span>
            </div>
            <div className="user-info">
              <div className="user-name">{currentUser.pseudo}</div>
              <div className={`user-grade ${gradeClass(currentUser.grade)}`} style={{fontSize:10,fontFamily:'var(--font-mono)'}}>{currentUser.grade}</div>
            </div>
            <div className="status-dot"></div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(section=>(
            <div className="nav-section" key={section.section}>
              <div className="nav-label">{section.section}</div>
              {section.items.map(item=>(
                <div key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>setPage(item.id)}>
                  <span className="icon">{item.icon}</span>
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="secure-badge"><span className="secure-dot"></span><span>RÉSEAU SÉCURISÉ</span></div>
          <div style={{marginTop:8,fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-muted)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>v3.0.0</span>
            <button style={{background:'none',border:'none',color:'var(--accent-red)',cursor:'pointer',fontSize:9,fontFamily:'var(--font-mono)'}} onClick={logout}>Déconnexion</button>
          </div>
        </div>
      </aside>

      <div className="main-area">
        <div className="topbar">
          <div>
            <div className="topbar-title">{PAGE_NAMES[page]||page}</div>
            <div className="topbar-breadcrumb mono">VMF // {PAGE_NAMES[page]||page}</div>
          </div>
          <div className="topbar-actions">
            <div className="user-avatar" style={{width:32,height:32,background:currentUser.avatarColor,fontSize:12,fontWeight:700,fontFamily:'var(--font-mono)',color:'#fff',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}>
              {currentUser.avatar}
            </div>
            <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>{currentUser.pseudo}</span>
            <span className={`badge badge-${currentUser.grade==='Heritier'?'red':currentUser.grade==='Regent'?'gold':currentUser.grade==='Senechaux'?'green':currentUser.grade==='Syndic'?'blue':'gray'}`}>{currentUser.grade}</span>
          </div>
        </div>
        <div className="content-scroll">{renderPage()}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
